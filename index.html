 the glycosylation machinery. This is the best demonstration that the two inclusion criteria are mutually independent — screening on phenotype alone would draw in the entire segmentation clock pathway.\n[Paralogues cause no skeletal disease] The Fringe family also contains MFNG and RFNG, with similar substrate specificity, but no skeletal dysplasia has been reported from mutations in either.","sources":["Sparrow DB, et al. Mutation of the LUNATIC FRINGE gene in humans causes spondylocostal dysostosis with a severe vertebral phenotype. Am J Hum Genet 2006;78:28-37. PMID:16385447 PMC1380221 [gene discovery]","OMIM 609813 / 602576","Moloney DJ, et al. Fringe is a glycosyltransferase that modifies Notch. Nature 2000;406:369-375","Otomo N, et al. Identification of novel LFNG mutations in spondylocostal dysostosis. J Hum Genet 2019 (second family reported with LFNG mutations)","Functional characterization of novel Lunatic Fringe variants in spondylocostal dysostosis type-III with scoliosis. PMC11919168"],"ev":"established","pw":[{"name":"NOTCH","evidence":"direct","note":"LFNG (Lunatic Fringe) is a Golgi-resident beta-1,3-N-acetylglucosaminyltransferase that transfers GlcNAc onto the O-fucose residues of the EGF-like repeats in the NOTCH1 extracellular domain, elongating the O-fucose glycan and shifting the receptor's ligand preference (strengthening binding to DLL1, suppressing binding to JAG1). The patient F188L mutant protein loses enzymatic activity, is mislocalised subcellularly and cannot modulate Notch signalling in cell-based assays — evidence at both the direct and the functional level."}],"dc":"glycan_machinery"},{"key":"EOGT-AOS4","zh":"Adams-Oliver syndrome 4 (AOS4)","en":"","genes":["EOGT"],"cluster":"Notch_O_glycosylation","inh":"AR","omim":["615297"],"hpo":["HP:0001057","HP:0007385","HP:0045060","HP:0010185","HP:0001800","HP:0001770","HP:0001631","HP:0001629","HP:0001643","HP:0002060","HP:0000965","HP:0001537"],"pathway":"EOGT places O-GlcNAc on extracellular-destined proteins containing EGF-like domains within the ER lumen, and so regulates developmental signalling. Its modification site does not overlap with those of the two other Notch-pathway glycosyltransferases: POFUT1 adds O-fucose between C2 and C3, POGLUT1 adds O-glucose between C1 and C2, and **EOGT adds O-GlcNAc between C5 and C6**, while the Fringe family (LFNG and others) elongates the O-fucose installed by POFUT1. Knockout of Eogt in Drosophila causes a cell-adhesion defect in the wing disc with blistering of the posterior wing, a phenotype fully rescued by mouse Eogt1, indicating functional conservation; O-GlcNAc on extracellular domains has been shown to mediate epithelial cell-matrix interactions.","notes":"[The most complete example of 'one disease, several mechanisms' in this database] The known genes for Adams-Oliver syndrome fall into three groups at different mechanistic levels of one phenotype:\n  - **Notch pathway components**: NOTCH1 (receptor), DLL4 (ligand), RBPJ (the binding partner that activates NOTCH1) — AD\n  - **A glycosyltransferase modifier of Notch**: EOGT — AR, i.e. this entry\n  - **Regulators of CDC42 and the actin cytoskeleton**: ARHGAP31, DOCK6 — AD and AR respectively\nGeneReviews notes that AOS is currently regarded as a multi-pathway disorder, but that several known links between Notch signalling and CDC42 suggest these mechanisms may eventually be unified.\n[Read alongside LFNG-SCDO3] Together the two Notch-glycosylation entries make the point that glycosyltransferase defects are not 'another class of disease' but another point of failure within the same developmental pathway.\n[Phenotype] The core features are aplasia cutis congenita (in the great majority on the vertex or occipital scalp, often with an underlying skull defect) and terminal transverse limb defects (absence of distal phalanges or whole digits — true adactyly; occasionally involving metacarpals/metatarsals or more proximal structures), with hypoplastic or absent nails and sometimes syndactyly (most often of toes 2-3). Cardiovascular malformations (atrial/ventricular septal defect, patent ductus arteriosus), brain abnormalities and vascular defects (cutis marmorata, dilated scalp veins) may also occur. The clinical presentation is highly variable.\n[Nature of the skeletal phenotype] Note that this is a **limb reduction defect** rather than a chondrodysplasia, unlike the skeletal phenotype of most entries in this database.\n[Diagnostic criteria] Aplasia cutis congenita or a terminal transverse limb defect, plus a pathogenic variant in one AD-associated gene or biallelic pathogenic variants in one AR-associated gene.","sources":["Shaheen R, et al. Mutations in EOGT confirm the genetic heterogeneity of autosomal-recessive Adams-Oliver syndrome. Am J Hum Genet 2013;92:598-604. PMID:23522784 [gene discovery]","Cohen I, et al. Autosomal recessive Adams-Oliver syndrome caused by homozygous mutation in EOGT, encoding an EGF domain-specific O-GlcNAc transferase. Eur J Hum Genet 2014;22:374-378. doi:10.1038/ejhg.2013.159 PMC3925282","Sakaidani Y, et al. O-linked-N-acetylglucosamine modification of mammalian Notch receptors by an atypical O-GlcNAc transferase Eogt1. Biochem Biophys Res Commun 2012;419:14-19","Sakaidani Y, et al. O-linked-N-acetylglucosamine on extracellular protein domains mediates epithelial cell-matrix interactions. Nat Commun 2011;2:583","Schroder KC, et al. Adams-Oliver syndrome caused by mutations of the EOGT gene. Am J Med Genet A 2019;179A:2246-2251. PMID:31368252","Ogawa M, et al. Impaired O-linked N-acetylglucosaminylation in the ER by mutated EOGT found in Adams-Oliver syndrome. J Biol Chem 2015;290:2137-2149","GeneReviews NBK355754 (Adams-Oliver Syndrome)","OMIM 615297 / 614789"],"ev":"established","pw":[{"name":"NOTCH","evidence":"direct","note":"EOGT is an EGF domain-specific O-linked N-acetylglucosaminyltransferase of the ER lumen (family GT61) that uses UDP-GlcNAc as donor and specifically glycosylates the threonine **between the fifth and sixth conserved cysteines** of folded EGF-like domains, with NOTCH receptors among its substrates; this O-GlcNAc can be further elongated into a glycan capped with N-acetyllactosamine. GeneReviews states explicitly that 'EOGT glycosylates NOTCH1', which is direct-level evidence."}],"dc":"glycan_machinery"},{"key":"SLC10A7-SSAISD","zh":"Short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis (SLC10A7-CDG)","en":"","genes":["SLC10A7"],"cluster":"golgi_transporter","inh":"AR","omim":["618363"],"hpo":["HP:0002652","HP:0004322","HP:0000705","HP:0001373","HP:0002751","HP:0002650","HP:0003026","HP:0003071","HP:0002673","HP:0002857","HP:0003417","HP:0003301","HP:0000347","HP:0000175","HP:0000365","HP:0004349","HP:0012345"],"pathway":"SLC10A7 encodes a ten-transmembrane transporter homodimer localised mainly to the Golgi, where it influences Ca2+ homeostasis in the secretory pathway. Although it belongs to the SLC10 family (whose other members transport Na+ and bile acids), it has no transport activity towards the family's canonical substrates and **remains an orphan transporter**. Slc10a7 knockout mice show reduced HS in cartilage but not muscle, and patient fibroblasts likewise show reduced HS; yet neither a structural change in HS nor a sulfation defect has been found, so the exact mechanism of impaired GAG synthesis remains undetermined.","notes":"[A skeletal phenotype resembling diastrophic dysplasia, but not a sulfation disorder] The full skeletal presentation comprises prenatal and postnatal short stature, short long bones, Pierre-Robin sequence, cleft palate, micrognathia, vertebral anomalies, thoracic deformity, exaggerated lumbar lordosis, kyphoscoliosis, dislocation of the large joints, genu valgum, a 'monkey wrench' appearance of the proximal femur, advanced carpal/tarsal ossification and small epiphyses.\n[Hallmark associated feature] Hypomineralised **amelogenesis imperfecta** is a constant finding; most patients also have hearing loss of varying degree. Less commonly there is mild intellectual disability, optic atrophy with refractive error, and cardiac defects.\n[Evidence] Alizarin red staining in a zebrafish SLC10A7-deficient model shows markedly reduced bone mineralisation; in patient fibroblasts glycoproteins are mislocalised intracellularly and post-Golgi transport to the plasma membrane is impaired. Reported ages span 6 months to 33 years, with only 12 cases published as of 2023.\n[Multiple glycosylation pathways affected] As with SLC35A3 and TMEM165, SLC10A7 deficiency affects both N-glycosylation and GAG biosynthesis — disturbance of the Golgi environment or organisation spills over onto the several glycosylation pathways that coexist there.","sources":["Dubail J, et al. SLC10A7 mutations cause a skeletal dysplasia with amelogenesis imperfecta mediated by GAG biosynthesis defects. Nat Commun 2018;9:3087. PMID:30082715 [gene discovery]","Ashikov A, et al. 2018 (independent report; bone mineralisation and post-Golgi transport defects)","Karger Mol Syndromol 2025 (review of GAG biosynthesis skeletal disorders; doi:10.1159/000551137)","CDG due to defective membrane transporters: update. PMC12815614","OMIM 618363 / 611459"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC35A3-AMRS","zh":"Arthrogryposis, impaired intellectual development, and seizures (SLC35A3-CDG)","en":"","genes":["SLC35A3"],"cluster":"golgi_transporter","inh":"AR","omim":["615553"],"hpo":["HP:0002804","HP:0002650","HP:0002827","HP:0004976","HP:0008807","HP:0100490","HP:0000252","HP:0001263","HP:0001249","HP:0001250","HP:0003468","HP:0012345"],"pathway":"SLC35A3 is the Golgi UDP-GlcNAc transporter, carrying UDP-GlcNAc from the cytosol into the Golgi lumen for use by glycosyltransferases; it governs both N-glycan branching and the supply of GlcNAc for the disaccharide unit of HS. Patient cells and plasma show reduced N-glycan branching, and patient serum contains an abnormally migrating band of the CS-bearing proteoglycan bikunin, indicating that GAG metabolism is affected as well.","notes":"[Nature of the skeletal phenotype: a segmentation defect, not a chondrodysplasia] The skeletal changes are camptodactyly, malalignment of the distal limbs and **scoliosis due to multiple vertebral segmentation defects**. Taken with the severe neurological features and the vertebral malformation, SLC35A3 is inferred to be important for both embryonic brain development and vertebral segmentation.\n[The bovine counterpart] Missense variants in SLC35A3 cause complex vertebral malformation (CVM) in cattle; Slc35a3 knockout mice die perinatally with a chondrodysplasia reproducing CVM-like vertebral anomalies, and Slc35a3 mRNA is expressed in the presomitic mesoderm of wild-type mice — implying that the UDP-GlcNAc it transports is used for glycan modifications required for somite formation.\n[An echo of LFNG] LFNG deficiency elsewhere in this database likewise causes vertebral segmentation defects (spondylocostal dysostosis), and the sugar donor for LFNG is UDP-GlcNAc — SLC35A3 supplies the substrate and LFNG uses it, so defects in either strike the segmentation clock. This is a further 'upstream supply versus downstream enzyme' pairing.\n[Diagnosis] In a patient with arthrogryposis, seizures and intellectual disability, a fibroblast UDP-GlcNAc transport assay or direct genetic testing can be performed. Treatment is purely symptomatic.","sources":["Edvardson S, et al. Mutations in SLC35A3 cause autism spectrum disorder, epilepsy and arthrogryposis. J Med Genet 2013;50:733-739 [gene discovery]","Marini C, et al. Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects. Am J Med Genet A 2017;173:1119-1123","Mice lacking SLC35A3 exhibit lethal chondrodysplasia with vertebral anomalies and impaired glycosaminoglycan biosynthesis","Karger Mol Syndromol 2025","OMIM 615553"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC35B2-LDHCD","zh":"Leukodystrophy, hypomyelinating, 26, with chondrodysplasia (SLC35B2-CDG)","en":"","genes":["SLC35B2"],"cluster":"GAG_sulfation","inh":"AR","omim":["620269"],"hpo":["HP:0002652","HP:0003510","HP:0001511","HP:0003026","HP:0002650","HP:0001373","HP:0003042","HP:0004976","HP:0008434","HP:0010585","HP:0004233","HP:0002673","HP:0001181","HP:0000278","HP:0000175","HP:0001263","HP:0001249","HP:0012345"],"pathway":"SLC35B2 (also known as PAPST1) is the **PAPS transporter** of the Golgi membrane, carrying the universal sulfate donor PAPS from its site of synthesis in the cytosol into the Golgi lumen for use by sulfotransferases; a second PAPS transporter is encoded by SLC35B3. Functional studies in patients confirm that impaired SLC35B2 function disrupts GAG sulfation in fibroblasts and serum.","notes":"[The final link of the sulfation pathway is now in place] The sulfation chain in this database is now complete: SLC26A2 imports sulfate, PAPSS2 activates it to PAPS, **SLC35B2 delivers PAPS into the Golgi**, CHST3/11/14 and others transfer the sulfate, and BPNT2 clears the by-product PAP. This was the first Golgi PAPS transporter defect to be identified.\n[The neurological phenotype may exceed the skeletal one] The clinical picture is dominated by severe psychomotor delay with hypomyelinating leukodystrophy and corpus callosum hypoplasia; reviewers accordingly suggest that SLC35B2 may matter more to the central nervous system than to bone and joint.\n[Skeletal features] Pierre-Robin sequence, severe short stature (height between -4 and -8 SD), distal joint contractures and dislocation of the large joints; imaging shows cervical (C3-C4) hypoplasia, early-onset scoliosis, subluxation or dislocation of the large joints, flat acetabula, mild epiphyseal dysplasia, widened long-bone metaphyses and advanced carpal ossification.","sources":["Guasto A, Dubail J, Aguilera-Albesa S, et al. Biallelic variants in SLC35B2 cause a novel chondrodysplasia with hypomyelinating leukodystrophy. Brain 2022;145:3711-3722. PMID:35325049 [gene discovery]","Genomics England PanelApp, SLC35B2 (Skeletal dysplasia panel)","Karger Mol Syndromol 2025","OMIM 620269"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"HS2ST1-NFSKS","zh":"Neurofacioskeletal syndrome with or without renal agenesis (HS2ST1)","en":"","genes":["HS2ST1"],"cluster":"GAG_sulfation","inh":"AR","omim":["619194"],"hpo":["HP:0002652","HP:0004322","HP:0002650","HP:0002808","HP:0002857","HP:0002987","HP:0006380","HP:0003273","HP:0003090","HP:0009836","HP:0011927","HP:0000470","HP:0000767","HP:0000278","HP:0000280","HP:0001249","HP:0001263","HP:0001252"],"pathway":"HS2ST1 encodes heparan sulfate 2-O-sulfotransferase 1, which sulfates the C2 position of uronic acid residues within HS chains. The sulfation pattern of HS determines its binding specificity for morphogens, so this defect lies at the level of HS **fine structure** rather than chain length or chain abundance.","notes":"[A different level from EXT1/EXT2] EXT deficiency means too few HS chains are made; HS2ST1 deficiency means the chains are made but carry **the wrong sulfation pattern**. Together they show that HS function depends on both quantity and modification pattern.\n[Phenotype] Severe developmental delay, coarse facies and skeletal change (scoliosis/kyphosis, genu valgum, flexion contractures of elbows and knees, hip contracture, hypoplastic femoral capital epiphyses, broad short distal phalanges), with renal agenesis in some patients.\n[Functional specificity of 2-O-sulfation (Nature 2026)] In U2OS cells, knockout of NDST1 (N-sulfation) or HS6ST1 (6-O-sulfation) reduced cell-surface glycoRNA/RNA-binding-protein clusters by 53-77%, whereas **knockout of HS2ST1 had no significant effect**; exogenous HS chains lacking only the 2-O-sulfate (rHS37) actually increased cluster formation two- to threefold. This suggests that individual sulfation positions on HS serve distinct downstream functions and that the pathogenic mechanism of HS2ST1 deficiency is unlikely to run through cell-surface RNA assembly, lying more plausibly in morphogen-binding specificity. Note that the experiment was performed in vitro in an osteosarcoma cell line, and no direct chain of evidence links it to the patients' skeletal phenotype.","sources":["Karger Mol Syndromol 2025 (Genetic skeletal disorders with defects in GAG biosynthesis; doi:10.1159/000551137)","OMIM 619194","Chai P, et al. Nature 2026;651(8106):808-818. doi:10.1038/s41586-025-10052-8 (HS2ST1 knockout does not affect csRNPs, unlike NDST1/HS6ST1)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SULF1-MSS","zh":"Mesomelia-synostoses syndrome (SULF1)","en":"","genes":["SULF1"],"cluster":"GAG_sulfation","inh":"AD","omim":["600383"],"hpo":["HP:0003027","HP:0008845","HP:0002983","HP:0002982","HP:0005096","HP:0005891","HP:0005694","HP:0100328","HP:0100329","HP:0009701","HP:0009803","HP:0010743","HP:0001773","HP:0003468","HP:0000347","HP:0000308","HP:0010292","HP:0001611","HP:0000365","HP:0000126"],"pathway":"SULF1 encodes extracellular heparan sulfate 6-O-endosulfatase 1. It sits at a different level from the other sulfation entries in this database: CHST, PAPSS, SLC26A2 and SLC35B2 all **add** sulfate within the Golgi, whereas SULF1 **removes** the 6-O-sulfate from HS chains that have already been assembled, out in the extracellular matrix, and so continues to rewrite the sulfation pattern after synthesis is complete. The 6-O-sulfation state of HS governs its affinity for heparin-binding morphogens such as Wnt, FGF, BMP and Hedgehog, which makes SULF1 an extracellular tuner of morphogen gradients in the growth plate; quantitative RT-PCR shows SULF1 transcripts to be most abundant in human osteoblasts and cartilage.","notes":"[Why the evidence level is provisional: the causative gene is not settled] MSS is a **contiguous gene deletion syndrome**. Isidor et al. 2010 found an interstitial 582-738 kb deletion at 8q13 in every patient, invariably encompassing just two genes, SULF1 and SLCO5A1, and inferred from expression profiling that 'haploinsufficiency of SULF1 is the main contributor'. The evidence has since continued to favour SULF1: Dardis et al. 2019 reported a patient with monoallelic SULF1 expression and no alteration of SLCO5A1, and Bendas Feres Lima et al. 2024 reported a translocation that truncated SLCO5A1 but produced **no** MSS phenotype, excluding SLCO5A1 as a candidate. The same paper notes, however, that the MSS deletions also remove a topologically associating domain (TAD) boundary, so **enhancer adoption** remains an unexcluded alternative explanation. In other words, SULF1 is the most likely causative gene, but 'loss of function of SULF1 alone is sufficient to cause the disease' is not established, hence provisional rather than established.\n[Why the systematic screen missed it — another blind spot of the same class as FAM20B] The v4.2 whole-set scan followed the path 'gene to its OMIM diseases', and **SULF1 has no OMIM association at all** in HPO's genes_to_phenotype (contiguous gene deletion syndromes are usually not mapped at gene level). Neither Route A nor Route B could therefore have hit it. Recomputed starting from diseases, the official annotations of OMIM 600383 contain 15/33 = 45% skeletal terms, far above the Route A threshold; and it carries three terms held by **only one disease in the whole corpus** (partial fusion of the proximal row of carpal bones, progressive forearm bowing, carpometacarpal synostosis), so Route B is satisfied as well.\n[Phenotype] Mesomelic limb shortening and mesomelic short stature, micromelia, bowing of the tibia and distal femur, progressive forearm bowing, multiple synostoses of the carpal, carpometacarpal and tarsometatarsal bones, short phalanges and metatarsals, and abnormal vertebral morphology; craniofacially there is microretrognathia, an absent uvula and hypernasal speech, together with hearing impairment and hydronephrosis. Intelligence is usually normal (global developmental delay has a frequency of 0/5 in the official annotations).\n[A three-tier contrast with the other HS entries in this database] EXT1/EXT2 deficiency means HS chains **cannot be made**; HS2ST1 deficiency means the chains are made but carry **the wrong 2-O-sulfation pattern**; SULF1 deficiency means chain and pattern are both normal but the **post-synthetic 6-O-desulfation editing fails**. All three concern HS, yet they occupy the synthetic, modifying and post-modification editing layers respectively, and their clinical phenotypes bear no resemblance to one another (exostoses / neurofacioskeletal syndrome / mesomelic dysplasia) — a further illustration of this database's argument that position in a pathway does not predict phenotype.\n[Intersection with Nature 2026] That paper showed that assembly of cell-surface glycoRNA-RNA-binding-protein clusters depends on N-sulfation and **6-O-sulfation** of HS (NDST1, HS6ST1) but not on 2-O-sulfation. SULF1 is precisely the enzyme that removes the 6-O-sulfate and could in principle regulate that assembly in the opposite direction; but this has not been tested in MSS patient material or in skeletal tissue, so no pathways annotation is added on its basis.","sources":["Isidor B, Pichon O, Baron S, David A, Le Caignec C. Mesomelia-synostoses syndrome results from deletion of SULF1 and SLCO5A1 genes at 8q13. Am J Hum Genet. 2010;87(1):95-100. PMID:20602915 [gene discovery]","Dardis A, et al. Mesomelia-synostoses syndrome: description of a patient presenting a monoallelic expression of SULF1 without alterations in the SLCO5A1 gene. Clin Genet. 2019. PMID:30450550","Bendas Feres Lima I, et al. Mesomelia-synostoses syndrome: contiguous deletion syndrome, SULF1 haploinsufficiency or enhancer adoption? Mol Cytogenet. 2024. PMID:38992676 [excludes SLCO5A1 but raises enhancer adoption as an alternative]","OMIM 600383","Chai P, et al. Nature 2026;651(8106):808-818. doi:10.1038/s41586-025-10052-8 (csRNP assembly depends on 6-O-sulfation)"],"ev":"provisional","pw":[],"dc":"glycan_machinery"},{"key":"PIGB-AFFND1","zh":"Acrofrontofacionasal dysostosis 1 (AFFND1)","en":"","genes":["PIGB"],"cluster":"GPI_anchor","inh":"AR","omim":["201180"],"hpo":["HP:0002813","HP:0009882","HP:0010049","HP:0011304","HP:0008807","HP:0000767","HP:0000248","HP:0000272","HP:0000303","HP:0000316","HP:0000175","HP:0004322","HP:0001249"],"pathway":"PIGB encodes GPI mannosyltransferase III, which adds the third mannose to the growing GPI anchor, an obligatory step in anchor synthesis.","notes":"[Widening the GPI deficiency spectrum] This entry extends the phenotypic spectrum of GPI defects from a predominantly neurological one to a definite **dysostosis**. The literature states explicitly that the case 'expands the range of phenotypes associated with GPI biosynthesis defects'.\n[Phenotype] Facial anomalies (hypertelorism, a flat notched nasal tip, cleft lip/palate, broad protruding upper central incisors), digital anomalies (camptodactyly, brachydactyly, polydactyly, syndactyly), hypoplasia of certain bones (ilium, fibula), short stature and intellectual disability; also mesomelic shortening, hypoplastic distal phalanges, fibular hypoplasia and talipes. Vision is impaired by ocular anomalies including iris, retinal and optic nerve coloboma, and hearing loss may appear in later life.\n[Extreme rarity and a founder effect] Only seven cases have been reported: initially five individuals from three Brazilian families, later two sibs of Indian descent. In 2021 the same intronic variant (causing skipping of exon 7 with frameshift) was found in two Brazilian patients, indicating a founder effect in that population.\n[Genetic heterogeneity] AFFND3 is caused by NBAS variants and is unrelated to glycosylation.","sources":["Palagano E, et al. A novel intronic variant in PIGB in acrofrontofacionasal dysostosis type 1 patients expands the spectrum of phenotypes associated with GPI biosynthesis defects. Bone 2021 [gene discovery]","OMIM 201180 / 604122"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PIGT-MCAHS3","zh":"Multiple congenital anomalies-hypotonia-seizures syndrome 3 (MCAHS3, PIGT)","en":"","genes":["PIGT"],"cluster":"GPI_anchor","inh":"AR","omim":["615398"],"hpo":["HP:0000938","HP:0000939","HP:0002650","HP:0003022","HP:0000767","HP:0004443","HP:0011330","HP:0000248","HP:0000256","HP:0001263","HP:0001249","HP:0001250","HP:0001252"],"pathway":"PIGT is a subunit of the GPI transamidase complex, which transfers the completed GPI anchor onto the C-terminus of target proteins. Because the defect lies at an **early/transfer step**, serum alkaline phosphatase is usually not elevated — in contrast with the hyperphosphatasia of late defects such as PIGV, PIGO, PGAP2 and PGAP3.","notes":"[Basis for inclusion: objective screening] This entry is dominated by a neurological phenotype. It is included because a systematic screen against the official HPO annotations found 10 skeletal terms (18% of all annotations), meeting the database threshold (at least 5 skeletal terms and at least 15%). Skeletal involvement comprises osteopenia/osteoporosis, scoliosis, ulnar hypoplasia, pectus excavatum and craniosynostosis (lambdoid and metopic sutures).\n[Allelic disorder] PIGT also causes paroxysmal nocturnal haemoglobinuria type 2 (615399), a phenotype without skeletal involvement (0/11 on screening), which is not included here.","sources":["OMIM 615398 / 610272","Screen of the official HPO phenotype.hpoa annotations (database methodology, see Methods)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PIGS-GPIBD18","zh":"Glycosylphosphatidylinositol biosynthesis defect 18 (GPIBD18, PIGS)","en":"","genes":["PIGS"],"cluster":"GPI_anchor","inh":"AR","omim":["618143"],"hpo":["HP:0001156","HP:0011927","HP:0009882","HP:0010044","HP:0004689","HP:0004209","HP:0002804","HP:0002828","HP:0002650","HP:0000768","HP:0000252","HP:0000280","HP:0001263","HP:0001250","HP:0000365"],"pathway":"PIGS, like PIGT, is a subunit of the GPI transamidase complex and participates in transferring the GPI anchor onto the protein C-terminus.","notes":"[Basis for inclusion: objective screening] As with PIGT, this entry is dominated by a neurological phenotype and is included because 11 skeletal terms among the official annotations (17%) meet the threshold. Skeletal involvement is predominantly acral: brachydactyly, short digits, short fourth metacarpals/metatarsals and fifth-finger clinodactyly, together with multiple joint contractures, arthrogryposis multiplex congenita, scoliosis and pectus carinatum.\n[Read alongside PIGT] Both belong to the transamidase complex, yet the distribution of skeletal involvement differs — PIGT towards the cranial sutures and bone density, PIGS towards the acral skeleton.","sources":["OMIM 618143 / 610271","Screen of the official HPO phenotype.hpoa annotations (database methodology, see Methods)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"AGA-AGU","zh":"Aspartylglucosaminuria (AGU)","en":"","genes":["AGA"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["208400"],"hpo":["HP:0000943","HP:0000926","HP:0002650","HP:0002808","HP:0004568","HP:0002684","HP:0002738","HP:0003302","HP:0003304","HP:0000248","HP:0004322","HP:0001382","HP:0000938","HP:0000280","HP:0001249","HP:0001250","HP:0000518"],"pathway":"AGA encodes aspartylglucosaminidase (N-aspartyl-beta-glucosaminidase), which catalyses the final step of glycoprotein degradation by cleaving the bond between GlcNAc and asparagine. Deficiency causes aspartylglucosamine to accumulate in lysosomes and to be excreted in the urine, from which the disease takes its name.","notes":"[Completing the glycoproteinosis group] The lysosomal glycoprotein degradation group of this database now contains five entries: MAN2B1, FUCA1, NEU1, CTSA and AGA.\n[Course] Early development is usually normal; the disorder presents in early childhood with speech delay, and intellectual disability worsens with age, sometimes with seizures or movement disorder. Other features include angiokeratoma, **dysostosis multiplex**, joint hypermobility, osteoporosis, short stature and a characteristic facies (hypertelorism, small ears, sagging cheeks, thick lips, short nose).\n[Epidemiology] Found in all populations but **commoner among Finns** (one of the Finnish disease heritage disorders).\n[Treatment] Haematopoietic stem cell transplantation has been undertaken in alpha-mannosidosis, fucosidosis and this disorder and may benefit carefully selected patients; no enzyme replacement therapy exists.","sources":["Rudolph's Pediatrics 24th ed., Mucopolysaccharidosis, Mucolipidosis, and Glycoproteinosis","Arvio M, et al. (Finnish cohort follow-up and facial feature study)","Springer, Mucopolysaccharidoses and Oligosaccharidoses (2011)","OMIM 208400"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"HYAL1-MPSIX","zh":"Mucopolysaccharidosis type IX (MPS IX; hyaluronidase deficiency)","en":"","genes":["HYAL1"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["601492"],"hpo":["HP:0020127","HP:0100769","HP:0033640","HP:0000934","HP:0004626","HP:0006094","HP:0004322","HP:0001999"],"pathway":"HYAL1 encodes lysosomal hyaluronoglucosaminidase-1, which degrades **hyaluronan**. Hyaluronan is the only GAG that is neither sulfated nor attached to a core protein, so a defect in its degradation constitutes the mechanistically most distinctive of the MPS disorders.","notes":"[The last piece of the MPS spectrum] Alongside MPS I/II/III/IVA/IVB/VI/VII already in this database, MPS IX is the only form directed at hyaluronan. Before 1996, 'deficiencies of all the other lysosomal GAG-degrading enzymes had been identified, with hyaluronidase alone missing'; the first description by Natowicz et al. filled that gap.\n[A phenotype quite unlike other MPS] There is no dysostosis multiplex and no intellectual disability. The core presentation is **multiple periarticular soft-tissue masses** (which may swell intermittently and painfully), joint disease and synovitis, acetabular erosion, chondrocalcinosis, lumbar scoliosis and interphalangeal joint hypermobility, with mild short stature, subtle facial changes and recurrent otitis media.\n[Extreme rarity and misdiagnosis] Only four cases (two families) have been reported. One presentation was as **familial juvenile idiopathic arthritis** — the same diagnostic trap as PRG4/CACP elsewhere in this database, where a non-inflammatory arthropathy is treated as JIA.\n[A literature erratum] The text of OMIM 601492 at one point writes 'HYAL3 gene (607071.0003)', but 607071 is the gene MIM number of **HYAL1** and the allelic variant number likewise belongs to HYAL1; from the context (the family was mapped after sequencing HYAL1/2/3) this is a typographical error.\n[Nomenclature history] The disorder once called MPS VIII (DiFerrante syndrome) was later shown to rest on erroneous data, and that number has been retired.","sources":["Natowicz MR, et al. Clinical and biochemical manifestations of hyaluronidase deficiency. N Engl J Med 1996;335:1029-1033 [first description]","Triggs-Raine B, et al. Mutations in HYAL1 cause a newly described lysosomal disorder, mucopolysaccharidosis IX. PNAS 1999;96:6296-6300 [gene identification]","Imundo L, et al. A complete deficiency of HYAL1 presenting as familial juvenile idiopathic arthritis. J Inherit Metab Dis 2011;34:1013-1022","OMIM 601492 / 607071"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"VPS33A-MPSPS","zh":"Mucopolysaccharidosis-Plus syndrome (MPSPS)","en":"","genes":["VPS33A"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["617303"],"hpo":["HP:0000943","HP:0003016","HP:0002869","HP:0002680","HP:0008807","HP:0000470","HP:0000767","HP:0000768","HP:0001371","HP:0000252","HP:0000280","HP:0001252","HP:0001263","HP:0004322"],"pathway":"VPS33A is a subunit of the HOPS/CORVET tethering complexes and participates in endosome-lysosome fusion. Unlike every classical MPS, **this is not a lysosomal enzyme deficiency**: VPS33A regulates lysosomal acidification and glycosaminoglycan metabolism rather than, as might have been expected, endocytosis or autophagy.","notes":"[An important differential category: the phenotype resembles MPS, the mechanism does not] The clinical phenotype resembles the classical enzyme-deficiency MPS disorders (dysostosis multiplex, coarse facies, developmental delay), but some patients also have cerebral hypomyelination, hypertrophic cardiomyopathy, bone marrow dysfunction and nephropathy, which are atypical of classical MPS. It should be considered in the differential diagnosis of MPS.\n[Population] Described in the Yakut population of the Sakha region of eastern Siberia, with marked population specificity.\n[Mechanism still unclear] The detailed pathogenic mechanism of VPS33A and the domain-specific functions of the protein remain to be worked out.\n[Note on classification here] The entry is placed in the lysosomal GAG degradation group on the basis of its GAG metabolic phenotype, but at the molecular level it is a defect of **vesicle tethering and lysosomal acidification**, unlike the enzyme deficiencies that make up the rest of that group.","sources":["Kondo H, et al. 2017 (VPS33A and mucopolysaccharidosis-plus syndrome)","MedLink Neurology, Mucopolysaccharidoses (VPS33A entry)","OMIM 617303"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"EXTL3-ISDNA","zh":"Immunoskeletal dysplasia with neurodevelopmental abnormalities (ISDNA)","en":"","genes":["EXTL3"],"cluster":"GAG_chain","inh":"AR","omim":["617425"],"hpo":["HP:0002652","HP:0000926","HP:0003498","HP:0002751","HP:0003311","HP:0005930","HP:0000944","HP:0001156","HP:0004430","HP:0001249","HP:0001252","HP:0001250","HP:0001363","HP:0000252","HP:0012345"],"pathway":"EXTL3 encodes exostosin-like glycosyltransferase 3, which has GlcNAcT-I activity: it transfers the first alpha-GlcNAc onto the linker tetrasaccharide (GlcA-Gal-Gal-Xyl-)Ser and so **initiates** heparan sulfate (HS) chain synthesis; it may also contribute to HS elongation (GlcNAcT-II) but has no GlcAT-II activity. Within this database EXTL3 and EXT1/EXT2 form the complete HS synthesis chain: EXTL3 initiates and the EXT1/EXT2 complex polymerises. The patient glycosylation profile is abnormal, with HS reduced overall while dermatan sulfate (DS) and chondroitin sulfate (CS) are increased.","notes":"[Three systems involved] Skeleton, nervous system and immune system. Skeletal: severe platyspondyly causing disproportionate short stature with progressive kyphosis, cervical malformation and odontoid hypoplasia with cervical instability, short-limbed short stature and brachydactyly, with epiphyseal/metaphyseal change in some families. Neurological: ranging from mild learning difficulty to inability to sit, crawl, walk, speak or interact. Immunological: three of five families had severe T-cell immunodeficiency, in some cases SCID with complete absence of T cells.\n[Unexplained phenotypic variability] Patients carrying the **same** EXTL3 variant still differ markedly in their immunological presentation, implying unknown modifiers; variant position cannot at present be mapped onto disease severity.\n[Extreme rarity] Fourteen cases were reported by three independent groups in 2017, and a fifteenth in 2022.","sources":["Oud MM, et al. Mutations in EXTL3 cause neuro-immuno-skeletal dysplasia syndrome. Am J Hum Genet 2017;100:281-296. PMID:28132690 PMC5294674 [gene discovery]","Volpi S, et al. EXTL3 mutations cause skeletal dysplasia, immune deficiency, and developmental delay. J Exp Med 2017;214:623-637. PMID:28148688","OMIM 617425 / 605744","BMC Pediatr 2022;22:78 (PMC8812182, fifteenth case plus literature review)","Mol Genet Genomic Med 2024 (PMC10767689, novel variants in a Chinese family)"],"ev":"established","pw":[{"name":"FGF","evidence":"functional","note":"Functional analysis indicates that EXTL3 mutations **enhance FGF2 signalling** by altering the length and composition of heparan sulfate (HS) chains; ERK phosphorylation after FGF2 stimulation is raised in patient fibroblasts and is corrected by EXTL3 overexpression."}],"dc":"glycan_machinery"},{"key":"CHSY1-TPBS","zh":"Temtamy preaxial brachydactyly syndrome (TPBS)","en":"","genes":["CHSY1"],"cluster":"GAG_chain","inh":"AR","omim":["605282"],"hpo":["HP:0001156","HP:0030368","HP:0001510","HP:0001999","HP:0000365","HP:0001263","HP:0004322","HP:0004349"],"pathway":"CHSY1 encodes chondroitin synthase 1, which carries both beta3-glucuronosyltransferase and beta4-N-acetylgalactosaminyltransferase activities and performs the **polymerising elongation** of chondroitin sulfate (CS) chains (chondroitin polymerising factor ChPF has no independent activity of its own and must interact with a chondroitin synthase to enhance elongation). Skin biopsies from patients show weakened CS-specific immunostaining, and serum bikunin, which carries a CS chain, is of reduced molecular weight.","notes":"[Division of labour with CSGALNACT1] CSGALNACT1 initiates the CS chain by transferring the first GalNAc; CHSY1 elongates it.\n[Phenotype] Bilaterally symmetrical preaxial brachydactyly with digital hyperphalangism, growth retardation, facial dysmorphism, deafness, and motor and intellectual delay.\n[What the limb patterning defect implies] The patterning abnormality suggests that CHSY1 and CSPGs help determine joint position, or regulate signalling and cell behaviour during bone morphogenesis and joint formation — rather than merely providing structural support. Chsy1-deficient mice develop chondrodysplasia, reduced bone density and severe limb patterning defects, including ectopic joints displaced orthogonally.","sources":["Li Y, et al. 2010 (CHSY1 gene discovery, TPBS)","Front Genet 2021;12:642097 (PMC8242584, review of chondrodysplasia with multiple dislocations)","FEBS J 2020 (Paganini et al., review of bone and connective tissue disorders due to GAG defects; doi:10.1111/febs.14984)","Wilson DG, et al. 2012 (Chsy1 knockout mouse)","OMIM 605282"],"ev":"established","pw":[{"name":"NOTCH","evidence":"functional","note":"A secreted form of CHSY1 exists and contains a Fringe domain; its loss **triggers NOTCH activation** in cultured fibroblasts and in chsy1 knockdown zebrafish embryos. On this basis CHSY1 has been proposed to inhibit the NOTCH pathway in the extracellular space through its Fringe domain."},{"name":"BMP","evidence":"functional","note":"Gdf5 (BMP-14) is abnormally expressed in the digits of Chsy1 knockout mice. Gdf5 belongs to the TGF-beta superfamily and is one of the earliest markers of embryonic joint formation, implicating BMP signalling."},{"name":"HEDGEHOG","evidence":"functional","note":"In the same Chsy1 knockout mouse model, endochondral expression of Ihh during differentiation of the skeletal elements is abnormal."}],"dc":"glycan_machinery"},{"key":"CHST3-SEDCJD","zh":"Spondyloepiphyseal dysplasia with congenital joint dislocations, CHST3 type (recessive Larsen syndrome; humero-spinal dysostosis; SED Omani type)","en":"","genes":["CHST3"],"cluster":"GAG_sulfation","inh":"AR","omim":["143095"],"hpo":["HP:0002652","HP:0004322","HP:0001373","HP:0002827","HP:0003042","HP:0001762","HP:0001376","HP:0002751","HP:0003417","HP:0001654"],"pathway":"CHST3 encodes carbohydrate sulfotransferase 3 (chondroitin 6-O-sulfotransferase 1, C6ST-1), which sulfates the C6 position of GalNAc residues in CS chains. Patient fibroblasts show a marked reduction in 6-O-sulfated disaccharides with a compensatory rise in 4-O-sulfated disaccharides, and urinary 6-O-sulfated disaccharides are likewise reduced.","notes":"[One spectrum under several historical names] Recessive Larsen syndrome, humero-spinal dysostosis (HSD) and spondyloepiphyseal dysplasia Omani type have been shown to be one disease spectrum, for which the collective term 'CHST3-related skeletal dysplasia' is now recommended.\n[Distinction from dominant Larsen syndrome] Dominant Larsen syndrome (LRS1) is caused by FLNB mutations through a cytoskeletal mechanism unrelated to glycosylation. The CHST3 form has knee dislocation at birth and is often first diagnosed as Larsen syndrome; the dislocations may improve spontaneously or after surgery during childhood, after which the spondyloepiphyseal dysplasia features emerge.\n[The most recognisable imaging feature] Dysostosis-like change of the thoracolumbar spine — widened interpedicular distance at L1 on the frontal view and short, clefted vertebral bodies on the lateral.\n[Differential] Must be distinguished from SLC26A2 (DTDST)-deficient cells, which have a sulfate transport defect rather than a sulfotransferase defect. Intelligence and vision are normal. Some patients have mild cardiac valve dysplasia.","sources":["Thiele H, et al. 2004 (CHST3 and SED Omani type)","Hermanns P, et al. Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency in recessive Larsen syndrome and humero-spinal dysostosis. Am J Hum Genet 2008 (unification of the phenotypic spectrum)","GeneReviews: Chondrodysplasia with congenital joint dislocations, CHST3-related. PMID:21882400","OMIM 143095","Front Genet 2021;12:642097"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"CHST11-OCBMD","zh":"Osteochondrodysplasia, brachydactyly, and overlapping malformed digits","en":"","genes":["CHST11"],"cluster":"GAG_sulfation","inh":"AR","omim":["618167"],"hpo":["HP:0002652","HP:0001156","HP:0002813","HP:0004322","HP:0002650","HP:0001547","HP:0001373"],"pathway":"CHST11 encodes chondroitin 4-O-sulfotransferase 1 (C4ST-1), which sulfates the C4 position of GalNAc residues in CS chains. C4 sulfation of CS is carried out by the three enzymes CHST11-13, and C6 sulfation by CHST3 and CHST7.","notes":"[Phenotype] Bilaterally symmetrical skeletal defects, predominantly of the limbs: shortening of the lower leg bones causing mild short stature, with hand and foot malformation (chiefly brachydactyly and overlapping digits). Scoliosis, patellar and fibular dislocation and pectus excavatum also occur.\n[A more severe mouse phenotype] Gene-trap C4st1 mutant mice develop severe chondrodysplasia associated with abnormal long-bone growth plates; embryos have a small thorax, extremely short limbs, a twisted spine and a domed skull.\n[Audit note] An earlier version of this database wrongly attached OMIM 618167 to CSGALNACT1; the `audit` command, checking against the official HPO gene-to-disease mapping, revealed that the MIM number belongs to CHST11, and this has been corrected.","sources":["Shabbir MI, et al. (CHST11 gene discovery)","Front Genet 2021;12:642097 (PMC8242584)","Kluppel M, et al. 2005 (C4st1 mutant mouse)","OMIM 618167"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"CHST14-DSE-mcEDS","zh":"Musculocontractural Ehlers-Danlos syndrome type 1 (CHST14) and type 2 (DSE); adducted thumb-clubfoot syndrome","en":"","genes":["CHST14","DSE"],"cluster":"GAG_sulfation","inh":"AR","omim":["601776","615539"],"hpo":["HP:0002828","HP:0001181","HP:0001762","HP:0001382","HP:0002751","HP:0001252","HP:0000974","HP:0000963","HP:0000978","HP:0001075","HP:0001999","HP:0003198","HP:0001654"],"pathway":"The two genes act at the **last two steps** of the CS-to-DS conversion, introducing iduronic acid (IdoA)-containing domains into the GAG chain:\n- DSE encodes dermatan sulfate epimerase, which epimerises C5 of GlcUA to IdoA;\n- CHST14 encodes dermatan 4-O-sulfotransferase 1 (D4ST1), which sulfates the C4 position of IdoA-GalNAc.\nLoss of either causes a shortage of dermatan sulfate (DS). Patient fibroblasts show reduced DS with a compensatory increase in CS, and DS is undetectable in the urine of CHST14 patients (it is detectable in healthy controls). The key consequence is that the side chain of decorin that should be DS is replaced by a CS chain; the resulting immature decorin proteoglycan disorders the spatial arrangement of the collagen network.","notes":"[Why the two are merged into one entry] mcEDS-CHST14 and mcEDS-DSE are clinically very similar and occupy two adjacent terminal steps of DS biosynthesis; the literature distinguishes the subtypes by a gene suffix rather than treating them as two diseases.\n[Synonyms] Adducted thumb-clubfoot syndrome (ATCS) and EDS Kosho type, now unified as mcEDS.\n[Phenotype] Distal joint contractures and hypotonia from the neonatal period make this an important differential diagnosis within the spectrum of congenital neuromuscular and connective tissue disorders. Features include a characteristic facies, adducted thumbs, clubfoot, instability of the large joints, severe kyphoscoliosis, skin hyperextensibility/thinness/easy bruising/atrophic scarring and recurrent large subcutaneous haematomas.\n[A source conflict, verified] One sentence of Front Genet 2021 states that mcEDS type 2 is caused by **CHST3** mutations, but the same paper elsewhere, the FEBS review and the official HPO gene-to-disease mapping all give **DSE** (CHST3 corresponds to SEDCJD, 143095). This is judged a typographical error, and this database follows DSE.\n[Numbers reported] 31 cases of the CHST14 form and 3 of the DSE form as of the 2016 review.","sources":["Miyake N, et al. Loss-of-function mutations of CHST14 in a new type of Ehlers-Danlos syndrome. Hum Mutat 2010;31:966-974","Muller T, et al. 2013 (DSE causing mcEDS type 2)","Janecke AR, et al. The phenotype of the musculocontractural type of Ehlers-Danlos syndrome due to CHST14 mutations. 2016. PMC5115638","Front Genet 2021;12:642097","OMIM 601776 / 615539"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"BPNT2-gPAPP","zh":"Chondrodysplasia with joint dislocations, gPAPP type","en":"","genes":["BPNT2"],"cluster":"GAG_sulfation","inh":"AR","omim":["614078"],"hpo":["HP:0002652","HP:0001373","HP:0004322","HP:0000175","HP:0000347","HP:0001762","HP:0001156"],"pathway":"BPNT2 (formerly IMPAD1, protein alias gPAPP) encodes a Golgi-resident 3'-phosphoadenosine phosphatase. PAP (3'-phosphoadenosine 5'-phosphate), the by-product of sulfotransfer reactions, **feedback-inhibits** sulfotransferases unless removed, and gPAPP hydrolyses it to AMP and phosphate so that sulfation can continue. Its position parallels that of CANT1 with respect to glycosyltransferases — both are gatekeepers clearing a reaction by-product.","notes":"[Gene symbol] HPO and current nomenclature use **BPNT2**; IMPAD1 is the older symbol and both appear in the literature. This database uses BPNT2 as the primary symbol (a search for IMPAD1 will also hit this note).\n[Overlap with Catel-Manzke] Two patients originally diagnosed as 'Catel-Manzke-like' were ultimately found to carry BPNT2/IMPAD1 variants, making this an important differential diagnosis for TGDS-Catel-Manzke syndrome.\n[Mechanistic analogy] This database contains two 'by-product clearance' entries: CANT1 hydrolyses UDP (the glycosyltransferase by-product) and BPNT2 hydrolyses PAP (the sulfotransferase by-product). Both impair GAG synthesis indirectly through product feedback inhibition.","sources":["Vissers LE, et al. Chondrodysplasia and abnormal joint development associated with mutations in IMPAD1, encoding the Golgi-resident nucleotide phosphatase, gPAPP. Am J Hum Genet 2011;88:608-615","Nizon M, et al. IMPAD1 mutations in two Catel-Manzke like patients. Am J Med Genet A 2012;158A:2183-2187","OMIM 614078","Front Genet 2021;12:642097"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC26A2-DTDST","zh":"SLC26A2(DTDST)-related spectrum: diastrophic dysplasia (DTD), achondrogenesis 1B (ACG1B), atelosteogenesis 2 (AO2), recessive multiple epiphyseal dysplasia (EDM4)","en":"","genes":["SLC26A2"],"cluster":"GAG_sulfation","inh":"AR","omim":["222600","256050","600972","226900"],"hpo":["HP:0002652","HP:0005716","HP:0004322","HP:0001762","HP:0002751","HP:0005930","HP:0001181","HP:0001376","HP:0002983","HP:0000175"],"pathway":"SLC26A2 (formerly DTDST) is a plasma-membrane sulfate-chloride antiporter that imports extracellular sulfate into the cell. In the cytosol sulfate is activated by PAPSS2 to the universal sulfate donor PAPS, which SLC35B2/B3 then transport into the Golgi for use by sulfotransferases. SLC26A2 deficiency leaves too little intracellular sulfate and leads to undersulfation of proteoglycans.","notes":"[Exceptional allelic heterogeneity — the widest span in this database] The phenotypic spectrum of this one gene runs from the mildest, recessive multiple epiphyseal dysplasia (AR-MED/EDM4), to lethal achondrogenesis 1B (ACG1B), with diastrophic dysplasia (DTD) and atelosteogenesis type 2 (AO2) in between.\n[Classical signs of DTD] The 'hitchhiker thumb', talipes equinovarus and kyphoscoliosis.\n[A potential therapeutic lead] Animal studies suggest that N-acetylcysteine (NAC) can ameliorate undersulfation, and the skeletal phenotype of a DTD mouse model improved with NAC treatment. This is one of the few entries in the database with a defined therapeutic direction.","sources":["Rossi A, Superti-Furga A, et al. (SLC26A2/DTDST series)","Monti L, et al. N-acetylcysteine treatment ameliorates the skeletal phenotype of a mouse model of diastrophic dysplasia. 2015","PMC13143333 / PMID:42094029 (Genetic skeletal disorders with defects in GAG biosynthesis, review)","OMIM 222600 / 256050 / 600972 / 226900"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PAPSS2-brachyolmia","zh":"Autosomal recessive brachyolmia type 4 (PAPSS2); formerly SEMD, Pakistani type","en":"","genes":["PAPSS2"],"cluster":"GAG_sulfation","inh":"AR","omim":["612847"],"hpo":["HP:0002652","HP:0000926","HP:0003468","HP:0004322","HP:0005930","HP:0012412","HP:0002758"],"pathway":"PAPSS2 encodes PAPS synthase 2, which activates sulfate in the cytosol to 3'-phosphoadenosine 5'-phosphosulfate (PAPS), the **universal sulfate donor** for all sulfotransfer reactions. Deficiency limits PAPS synthesis and lowers GAG sulfation generally.","notes":"[A counterintuitive point worth noting] Since PAPS is the universal sulfate donor, PAPSS2 deficiency might be expected to resemble the sulfate transport defect of DTD — but it does not. AR brachyolmia is a **late-onset** skeletal dysplasia in which joint problems are not the principal clinical issue, whereas DTD presents at birth with severe joint and limb deformity. This divergence between expectation and fact is currently unexplained.\n[An extraskeletal feature: androgen excess] PAPS is also the donor used by SULT2A1 to sulfate dehydroepiandrosterone (DHEA) to DHEA-S. Inactivation of PAPSS2 therefore also blocks the DHEA-to-DHEA-S conversion, so DHEA accumulates and is converted through androstenedione to testosterone, presenting clinically as premature adrenarche, androgen excess and hyperandrogenic anovulation. Only a minority of patients, however, have clinical signs of androgen excess.\n[Nomenclature] A study of 13 families supports brachyolmia types 1A, 1B and 4 being one and the same disease.","sources":["Miyake N, et al. PAPSS2 mutations cause autosomal recessive brachyolmia. J Med Genet 2012;49:533-538","Iida A, et al. Clinical and radiographic features of the autosomal recessive form of brachyolmia caused by PAPSS2 mutations. Hum Mutat 2013;34:1381-1386","Noordam C, et al. Inactivating PAPSS2 mutations in a patient with premature pubarche. N Engl J Med 2009;360:2310-2318","OMIM 612847","PMC13143333 (review of GAG biosynthesis skeletal disorders)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"HSPG2-perlecan","zh":"Perlecan spectrum: dyssegmental dysplasia Silverman-Handmaker type (DDSH); Schwartz-Jampel syndrome type 1 (SJS1)","en":"","genes":["HSPG2"],"cluster":"PG_core_protein","inh":"AR","omim":["224410","255800"],"hpo":["HP:0002652","HP:0005716","HP:0002879","HP:0002983","HP:0001999","HP:0000347","HP:0000175","HP:0001376","HP:0002084","HP:0002486","HP:0004322","HP:0002758"],"pathway":"HSPG2 encodes the secreted core protein **perlecan**, which can carry four or more long HS chains and is the principal HSPG of nearly all basement membranes as well as being abundantly deposited in cartilage. It is laid down from early embryogenesis in cartilage anlagen, pericardium, vessel walls and heart; **the tissue with the highest deposition is the cartilage undergoing endochondral ossification**. In the pericellular space perlecan binds, crosslinks and stabilises many molecules, including extracellular matrix structural proteins and growth factors.","notes":"[Severity is inversely proportional to perlecan deposition] This is an uncommonly clear dose-effect genotype-phenotype relationship: complete functional null alleles give lethal DDSH, while hypomorphic variants give the milder Schwartz-Jampel syndrome. Truncation in the C-terminal region is comparatively tolerated, resulting in SJS rather than DDSH.\n[Molecular consequence] Perlecan antibody staining of the patient cartilage matrix is very weak, yet intracellular inclusions stain positively — truncated perlecan **cannot be secreted** and is degraded to small fragments within the cell.\n[DDSH] A lethal autosomal recessive skeletal dysplasia: anisospondyly, micromelia, flat facies, micrognathia, cleft palate and restricted joint movement, often with encephalocele. Fewer than 40 cases reported.\n[SJS1] Chondrodystrophic myotonia: sustained muscle contraction (myotonia) restricting movement, combined with chondrodysplasia. SJS and DDSH are allelic.\n[Recent development] In 2024 the non-lethal Rolland-Desbuquois type of dyssegmental dysplasia (DDRD) was also reported to arise from pathogenic HSPG2 variants, with five patients sharing a founder haplotype. That phenotype has no separate MIM number in HPO/OMIM and is not listed separately here for now.","sources":["Arikawa-Hirasawa E, et al. Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene. Nat Genet 2001;27:431-434. PMID:11279527 [gene discovery]","Arikawa-Hirasawa E, et al. Structural and functional mutations of the perlecan gene cause Schwartz-Jampel syndrome. Am J Hum Genet 2002;70:1368-1375","Martinez JR, et al. Modular proteoglycan perlecan/HSPG2: mutations, phenotypes, and functions. Genes 2018;9:556. PMC6266596","J Hum Genet 2024 (DDRD also caused by HSPG2, founder haplotype)","OMIM 224410 / 255800 / 142461"],"ev":"established","pw":[],"dc":"core_protein"},{"key":"GPC6-OMOD1","zh":"Omodysplasia 1 (OMOD1)","en":"","genes":["GPC6"],"cluster":"PG_core_protein","inh":"AR","omim":["258315"],"hpo":["HP:0002652","HP:0004322","HP:0002813","HP:0001999","HP:0008905","HP:0000316","HP:0005280"],"pathway":"GPC6 encodes glypican-6, a GPI-anchored HSPG of the plasma membrane. Glypicans use their HS chains to capture and present heparin-binding morphogens (Hh, Wnt, FGF, BMP) at the cell surface and so shape morphogen gradients.","notes":"[Phenotype] Facial dysmorphism, short stature and limb shortening, especially of the humerus.\n[Complementary to HME] EXT1/EXT2 deficiency elsewhere in this database means HS chains cannot be made; GPC6 deficiency means **the core protein that carries the HS chains is gone**. The two impair HSPG function by different routes and make the best available contrast between 'glycan machinery' and 'core protein' defects.\n[Adult bone homeostasis] GWAS show that SNPs adjacent to the GPC6 coding sequence are risk factors for osteoporosis, suggesting a role for GPC6 in adult bone homeostasis as well.","sources":["Campos-Xavier AB, et al. (GPC6 and omodysplasia 1)","medRxiv 2022.04.18.22273971 supplement (review of HSPG biosynthesis genes)","OMIM 258315","Filmus J. Glypicans, 35 years later. Proteoglycan Research 2023;1(2):e5. doi:10.1002/pgr2.5 (authoritative review of the glypican family; discusses the functional overlap of GPC6 and GPC4 in the embryonic gut)"],"ev":"established","pw":[{"name":"HEDGEHOG","evidence":"functional","note":"Gpc6 knockout mice die at birth with severe facial malformation and a skeleton markedly shorter than that of littermate controls; the phenotype has been attributed to defective signalling by the morphogen **Sonic hedgehog**, a heparin-binding protein."}],"dc":"core_protein"},{"key":"GPC3-SGBS1","zh":"Simpson-Golabi-Behmel syndrome type 1 (SGBS1)","en":"","genes":["GPC3"],"cluster":"PG_core_protein","inh":"XL (M:F about 9:1)","omim":["312870"],"hpo":["HP:0001548","HP:0000256","HP:0001999","HP:0002813","HP:0000028","HP:0000158","HP:0002667","HP:0001263"],"pathway":"GPC3 encodes glypican-3, a GPI-anchored HSPG. Contrary to most skeletal dysplasias, GPC3 deficiency causes **overgrowth**, implying that the glypican acts here to restrain growth.","notes":"[Phenotype] Pre- and postnatal overgrowth, a characteristic facies, variable visceral, skeletal and neurodevelopmental anomalies, and genitourinary dysfunction; cryptorchidism is common in males. Female carriers are more mildly affected, probably through skewed X inactivation.\n[Tumour risk] Associated with embryonal tumours such as Wilms tumour; somatic pathogenic GPC3 variants are also frequently found in sporadic Wilms tumour without the other features of SGBS1.\n[Reason for inclusion, and its limits] The axis of this disorder is overgrowth, and the skeletal abnormalities are accompanying rather than core features; it is included to present the glypican family in full.\n[Are the HS chains required? — an unresolved disagreement] Capurro et al. 2008 report explicitly that 'the heparan sulfate chains of GPC3 are **not required** for its interaction with Hedgehog', which would make SGBS1 a pure core-protein disorder consistent with the defect_class=core_protein assignment here. Liu et al. 2022 conclude the opposite: the HS-modified (not chondroitin sulfate-modified) stalk region of GPC3 is **both necessary and sufficient** for its Hh activity, the core globular domain alone being insufficient. The disagreement bears directly on whether this database's central conceptual distinction (glycan machinery defect versus core protein defect) holds for the glypicans; it is unresolved and recorded here as it stands.","sources":["GeneReviews NBK1219 (Simpson-Golabi-Behmel Syndrome Type 1)","OMIM 312870","Filmus J. Glypicans, 35 years later. Proteoglycan Research 2023;1(2):e5. doi:10.1002/pgr2.5 (authoritative review)","Capurro MI, Xu P, Shi W, Li F, Jia A, Filmus J. Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog binding. Dev Cell 2008;14:700-711. PMID:18477453","Capurro MI, et al. Overgrowth of a mouse model of Simpson-Golabi-Behmel syndrome is partly mediated by Indian Hedgehog. EMBO Rep 2009 (epistasis analysis)","Capurro MI, Shi W, Filmus J. LRP1 mediates Hedgehog-induced endocytosis of the GPC3-Hedgehog complex. J Cell Sci 2012;125:3380-3389","Liu YC, Wierbowski BM, Salic A. Hedgehog pathway modulation by glypican 3-conjugated heparan sulfate. J Cell Sci 2022;135:jcs259297 (opposite conclusion)","Song HH, Shi W, Xiang Y, Filmus J. The loss of glypican-3 induces alterations in Wnt signaling. J Biol Chem 2005;280:2116-2125"],"ev":"established","pw":[{"name":"HEDGEHOG","evidence":"functional","note":"This is the entry with the strongest Hedgehog pathway evidence in the database, but **the direction is disputed in the literature**. The series of studies from the Filmus laboratory (Capurro 2008 Dev Cell and others) argues that GPC3 is a **negative** regulator of Hh: GPC3 binds Hh with high affinity but does not bind its receptor Patched, competes with Patched for Hh, and induces LRP1-mediated endocytosis and degradation of Hh; Hh signalling is raised in Gpc3-null embryos. Genetic epistasis supports the model — Gpc3-null mice overgrow by 29.9% on an Ihh wild-type background but by only 19.8% on an Ihh-null background, so removing Ihh partially rescues the overgrowth. Against this, Liu, Wierbowski and Salic 2022 (J Cell Sci 135:jcs259297) report that GPC3 **is required** for the Hh response and acts at a downstream signal transduction step. The two point in opposite directions and are recorded here side by side without adjudication."},{"name":"WNT","evidence":"functional","note":"Loss of GPC3 alters Wnt signalling (Song, Shi, Xiang & Filmus, JBC 2005); several reviews describe GPC3 as a **positive** regulator of canonical Wnt/beta-catenin acting through both the core protein and the HS chains, consistent with its tumour-promoting role in hepatocellular carcinoma and Wilms tumour. The direction is opposite to that for Hedgehog, in keeping with the general property of glypicans of activating or inhibiting according to context."}],"dc":"core_protein"},{"key":"GPC4-Keipert","zh":"Keipert syndrome (nasodigitoacoustic syndrome)","en":"","genes":["GPC4"],"cluster":"PG_core_protein","inh":"XL","omim":["301026"],"hpo":["HP:0000256","HP:0002007","HP:0000316","HP:0000431","HP:0002813","HP:0000365","HP:0001263"],"pathway":"GPC4 encodes glypican-4, likewise a GPI-anchored HSPG. The zebrafish gpc4 mutant (knypek) shows defective chondrocyte stacking and intercalation.","notes":"[Contrast with SGBS1] GPC3 and GPC4 are adjacent at Xq26.2, yet Keipert syndrome **does not** display the visceromegaly, tumours, genitourinary dysfunction or congenital heart disease of SGBS1; only some facial and acral features are shared.\n[Phenotype] Macrocephaly, frontal bossing, hypertelorism and a broad nasal bridge, with digital anomalies; skeletal malformation has also been reported, and some patients have learning difficulties.","sources":["Amor DJ, et al. Pathogenic variants in GPC4 cause Keipert syndrome. Am J Hum Genet 2019;104:914-924. PMC6507040 [gene discovery]","GeneReviews NBK1219","OMIM 301026","Filmus J. Glypicans, 35 years later. Proteoglycan Research 2023;1(2):e5. doi:10.1002/pgr2.5"],"ev":"established","pw":[],"dc":"core_protein"},{"key":"BGN-SEMDX","zh":"Spondyloepimetaphyseal dysplasia, X-linked (SEMDX; biglycan type)","en":"","genes":["BGN"],"cluster":"PG_core_protein","inh":"XL (X-linked recessive)","omim":["300106"],"hpo":["HP:0002652","HP:0004322","HP:0000926","HP:0005930","HP:0000944","HP:0008905","HP:0001156","HP:0002970","HP:0002515","HP:0002938","HP:0002758"],"pathway":"BGN encodes biglycan, a member of the **small leucine-rich proteoglycan (SLRP)** family that carries two CS/DS chains. As an extracellular matrix proteoglycan it is central to homeostasis of chondrocytes and the pericellular matrix.","notes":"[One gene, two quite different diseases] This is one of the clearest mechanism-based distinctions in the database: **missense** variants (K147E, G259V, which do not affect splicing) cause X-linked SEMD (a skeletal disorder, 300106), whereas **loss-of-function** variants cause Meester-Loeys syndrome (MRLS, 300989), an aortopathy dominated by early-onset thoracic aortic aneurysm and dissection. Only the skeletal phenotype, SEMDX, is included here.\n[Phenotype] Short-trunk short stature, rhizomelic shortening, marked bowing of the lower limbs, a waddling gait with lumbar lordosis, brachydactyly, platyspondyly, and osteoarthritic joint change in adulthood. It is not detectable at birth and emerges with age.\n[Mouse] Bgn-deficient mice are normal at birth and then develop a reduced growth rate and low bone mass with age, with shortened tubular bones and reduced bone density on radiographs — matching the human pattern of absence at birth and emergence with age.\n[Differential] To be distinguished from SEMD aggrecan type (612813), Dyggve-Melchior-Clausen disease, mesomelic dysplasia Maroteaux type and pseudoachondroplasia, all of which are autosomal dominant or recessive, whereas this disorder is X-linked.","sources":["Cho SY, et al. BGN mutations in X-linked spondyloepimetaphyseal dysplasia. Am J Hum Genet 2016;98:1243-1248. PMID:27236923 PMC4908150 [gene discovery]","OMIM 300106 / 301870","Xu T, et al. Targeted disruption of the biglycan gene leads to an osteoporosis-like phenotype in mice. Nat Genet 1998;20:78-82","Berendsen AD, et al. Modulation of canonical Wnt signaling by the extracellular matrix component biglycan. PNAS 2011;108:17022-17027","Stem Cell Res 2023 (PMC9972783, patient iPSC chondrocyte model)"],"ev":"established","pw":[{"name":"TGFB","evidence":"functional","note":"Biglycan binds TGF-beta and thereby regulates its free concentration. Three-dimensional modelling places both pathogenic residues (K147E, G259V) on the **concave face of the leucine-rich repeat domain — precisely the interface that interacts with TGF-beta**. Mutant biglycan is expressed at lower levels and degraded faster in patient fibroblasts, which is presumed to alter extracellular TGF-beta signalling."},{"name":"BMP","evidence":"inferred","note":"Biglycan has been reported to regulate BMP4-induced osteoblast differentiation and to control osteogenic differentiation through Erk-activated Runx2 and through the SMAD1/5/8 pathway; but these are general features of biglycan biology rather than direct readouts in SEMDX patients."},{"name":"WNT","evidence":"inferred","note":"Biglycan has been reported to modulate canonical Wnt signalling (Berendsen et al. PNAS 2011); again general biology rather than evidence specific to this disease."}],"dc":"core_protein"},{"key":"ACAN-related","zh":"Aggrecan-related bone disorders: SED Kimberley type (SEDK); SEMD aggrecan type (SEMD-ACAN); familial osteochondritis dissecans / idiopathic short stature","en":"","genes":["ACAN"],"cluster":"PG_core_protein","inh":"AD","omim":["608361","612813","165800"],"hpo":["HP:0002652","HP:0004322","HP:0000926","HP:0005930","HP:0000944","HP:0001156","HP:0002758","HP:0000256","HP:0002983"],"pathway":"ACAN encodes aggrecan, a lectican and the **principal component** of the cartilage extracellular matrix, carrying more than a hundred CS and KS chains. Its dense negative charge draws in water to create swelling pressure, conferring compressive resistance on cartilage and placing it at the hub of skeletal development.","notes":"[One gene, a continuum from rare disease to common trait] The phenotypes of ACAN variants run from severe SEMD through SED Kimberley type and familial osteochondritis dissecans all the way to **idiopathic short stature**, a common trait. Several studies have found ACAN variants in cohorts with isolated short stature — making ACAN one of the few genes in this database that straddles the boundary between rare disease and common trait.\n[Mixed inheritance] SEDK and osteochondritis dissecans are autosomal dominant; the family in which SEMD-ACAN was first reported was autosomal recessive, but heterozygous missense variants have since been reported to cause SEMD with a milder phenotype than in the original report.\n[Imaging features of SEMD-ACAN] Platyspondyly with rectangular vertebral bodies, widened long-bone metaphyses with small irregular epiphyses, severe brachydactyly with supernumerary carpal bones, and cervical clefting.\n[Relation to glycosylation] This is a typical core_protein defect — the CS/KS chains of aggrecan are built by enzymes such as CSGALNACT1, CHSY1, CHST3 and CHST11 elsewhere in this database, and a fault at either end, core protein or glycan machinery, disables the cartilage matrix.","sources":["Gleghorn L, et al. A mutation in the variable repeat region of the aggrecan gene (AGC1) causes a form of spondyloepiphyseal dysplasia associated with severe, premature osteoarthritis. Am J Hum Genet 2005;77:484-490","Tompson SW, et al. A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense mutation affecting the C-type lectin domain of aggrecan. Am J Hum Genet 2009;84:72-79","Clin Dysmorphol 2019;28:26-29 (second report of SEMD-ACAN, milder phenotype)","PMC10860877 (review of ACAN-related bone disease plus novel variants)","OMIM 608361 / 612813 / 165800"],"ev":"established","pw":[],"dc":"core_protein"},{"key":"PRG4-CACP","zh":"Camptodactyly-arthropathy-coxa vara-pericarditis syndrome (CACP)","en":"","genes":["PRG4"],"cluster":"PG_core_protein","inh":"AR","omim":["208250"],"hpo":["HP:0012385","HP:0003040","HP:0002812","HP:0001701","HP:0001698","HP:0001367","HP:0004349","HP:0003093"],"pathway":"PRG4 encodes **lubricin**, secreted by synoviocytes and superficial-zone chondrocytes as the principal lubricant of the joint cavity and as an inhibitor of synovial overgrowth. Its core functional region is a **mucin-like domain** bearing abundant O-linked oligosaccharides — the epitope recognised by anti-lubricin monoclonal antibodies is precisely an O-linked oligosaccharide attached to the KEPAPTTT peptide motif.","notes":"[Why this entry is closely tied to glycosylation] Of 38 reported pathogenic variants, 26 (70%) lie in **exon 6**, and exon 6 encodes exactly that critical mucin-like (heavily O-glycosylated) domain of lubricin. Pathogenic variants are therefore strongly enriched in the O-glycan-bearing functional region.\n[A clinical trap: readily misdiagnosed as juvenile idiopathic arthritis (JIA)] This is a **non-inflammatory** arthropathy: inflammatory markers remain normal and radiographs show preserved joint space without erosive change. Misdiagnosis leads to prolonged, unnecessary immunosuppression — several reports describe patients given multiple disease-modifying drugs and biologics without benefit. Camptodactyly often appears later in the course, making recognition harder still.\n[The tetrad] Congenital or early-onset camptodactyly, childhood-onset non-inflammatory arthropathy with synovial hyperplasia, progressive coxa vara, and non-inflammatory pericardial/pleural effusion. The tetrad is not complete in every patient.\n[Treatment] Anti-inflammatory drugs are ineffective. Management is chiefly physiotherapy; total hip replacement may be required for severe hip disease. Intra-articular hyaluronan gives partial short-term benefit (about three weeks). Recombinant lubricin therapy is under evaluation.\n[Epidemiology] An estimated 7,000 cases worldwide, with a higher prevalence in Arab populations.","sources":["Marcelino J, et al. 1999 (PRG4/CACP gene discovery)","Rhee DK, et al. The secreted glycoprotein lubricin protects cartilage surfaces and inhibits synovial cell overgrowth","Yilmaz S, et al. Genotype-phenotype investigation of 35 patients from 11 unrelated families with CACP syndrome. Mol Genet Genomic Med 2018;6:1-11","Pediatr Rheumatol 2026 (PMID:42482035, case series misdiagnosed as JIA)","OMIM 208250"],"ev":"established","pw":[],"dc":"core_protein"},{"key":"STT3A-CDG","zh":"STT3A-CDG (CDG-Iw, autosomal recessive)","en":"","genes":["STT3A"],"cluster":"OST_complex","inh":"AR","omim":["615596"],"hpo":["HP:0012345","HP:0001263","HP:0001252","HP:0001250","HP:0004322","HP:0000252"],"pathway":"STT3A is a catalytic subunit of the oligosaccharyltransferase (OST) complex, which transfers the lipid-linked oligosaccharide en bloc onto asparagine residues of nascent polypeptides (the co-translational route). **Connection with RNA glycosylation**: inhibiting the OST complex with NGI-1 reduces glycoRNA labelling in a dose-dependent manner, and of the two catalytic subunits of OST, STT3A-dependent activity is particularly important for glycoRNA production.","notes":"This is the only entry in the database that both represents an established Mendelian disease and has been experimentally shown to be required for glycoRNA generation, and it can be read as the bridge between CDG and RNA glycosylation. Note that glycoRNA abnormalities have not been verified directly in STT3A-CDG patient samples; the inference comes from pharmacological and genetic perturbation in cell lines. The skeletal evidence is weak.","sources":["Cell 2021;184:3109-3124 (Flynn et al.)","Protein Cell 2026;17:1 (glycoRNA research review, PMC12959772)","Liu et al. 2024 (STT3A dependence, cited in the above review)","OMIM 615596"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"STT3B-CDG","zh":"STT3B-CDG (CDG-Ix, autosomal recessive)","en":"","genes":["STT3B"],"cluster":"OST_complex","inh":"AR","omim":["615597"],"hpo":["HP:0012345","HP:0001263","HP:0001252","HP:0001250"],"pathway":"STT3B is the other catalytic subunit of the OST complex and performs post-translocational, salvage glycosylation.","notes":"Compared with STT3A, the contribution of STT3B to glycoRNA has not been emphasised in published work. This entry is included to keep the OST complex complete as a mechanistic layer; the skeletal evidence is weak.","sources":["OMIM 615597","J Inherit Metab Dis 2011;34:869-878 (OST review)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"NGLY1-CDDG","zh":"NGLY1-related congenital disorder of deglycosylation (NGLY1-CDDG)","en":"","genes":["NGLY1"],"cluster":"deglycosylation","inh":"AR","omim":["615273"],"hpo":["HP:0002650","HP:0034392","HP:0001263","HP:0001249","HP:0001252","HP:0001250","HP:0000522","HP:0009830","HP:0002072","HP:0002910"],"pathway":"NGLY1 encodes cytosolic peptide:N-glycanase (PNGase), which removes N-glycans from misfolded glycoproteins retrotranslocated out of the ER as part of ERAD, and which fully activates the transcription factor NFE2L1 by N-to-D sequence editing, thereby regulating proteasome subunit expression. **Connection with the skeleton**: reviews list bone morphogenetic protein (BMP) signalling explicitly among the key processes affected by loss of NGLY1, and Ngly1-/- rats show developmental delay, motor impairment, somatosensory impairment and scoliosis.","notes":"An important distinction: this is a disorder of **de**glycosylation (CDDG), not of glycosylation, and it was once called CDG-Iv. A Genomics England review comment makes the point that 'its inclusion on the CDG panel is debatable, since it is a deglycosylation disorder and the phenotype may be closer to a lysosomal storage disease'. Diagnostic trap: routine CDG screening such as serum transferrin glycoform analysis and N/O-glycan profiling **cannot reliably detect** this disease; the biomarker is accumulation of GlcNAc-Asn (GNA) / aspartylglucosamine. The skeletal phenotype is confined to scoliosis and joint contractures and is not a skeletal dysplasia. More than 100 cases and over 70 pathogenic variants have been reported.","sources":["GeneReviews NBK481554","OMIM 615273","Genet Med 2014;16:751-758 (Enns et al.)","Cells 2022;11:1155 (PMC8997433, BMP signaling)","J Hum Genet 2025 (Fujihira et al.)","Genomics England PanelApp, NGLY1"],"ev":"established","pw":[{"name":"BMP","evidence":"functional","note":"Reviews list bone morphogenetic protein (BMP) signalling explicitly among the key processes affected by loss of NGLY1; the evidence comes mainly from Drosophila, C. elegans and rodent models, with limited direct readout in human patients."}],"dc":"glycan_machinery"},{"key":"GBA1-Gaucher","zh":"Gaucher disease (glucosylceramide storage; types I, II, III)","en":"","genes":["GBA1"],"cluster":"glycosphingolipid","inh":"AR","omim":["230800","230900","231000"],"hpo":["HP:0004975","HP:0002953","HP:0010885","HP:0002756","HP:0000938","HP:0002653","HP:0001744","HP:0001433","HP:0001873","HP:0001903"],"pathway":"GBA1 encodes lysosomal acid beta-glucocerebrosidase, which hydrolyses **glucosylceramide** (GlcCer) to glucose and ceramide. GlcCer is both the common precursor of all glycosphingolipids and the final common step of their degradation, so GBA1 deficiency causes glycolipid to accumulate in macrophage lysosomes, forming 'Gaucher cells'. The bone disease is thought to arise from marrow infiltration by Gaucher cells, an imbalance between osteoclasts and osteoblasts, and local ischaemia — rather than from a glycan defect of the cartilage matrix itself, which sets it apart in kind from the other skeletal entries in this database.","notes":"[This is the sole route by which lipid glycosylation enters the database, and it was admitted on specificity rather than proportion] Under the database's usual proportional criterion, Gaucher disease type I scores only 2/25 = 8%, far below the 15% threshold. But one of its skeletal annotations is **Erlenmeyer flask deformity of the femurs**, a term annotated to only **7** of the 8,478 OMIM diseases in the full set — close to pathognomonic. On that basis the supplementary 'highly specific skeletal phenotype' route (Route B, see GLOBAL_NOTES) was invoked.\n[HPO annotations substantially understate the skeletal burden of Gaucher disease] Clinically, bone disease is the leading cause of disability in type I Gaucher disease: bone crises, osteonecrosis (especially of the femoral head), pathological fracture, osteopenia and marrow expansion. Yet the official HPO gives only two skeletal terms for 230800. This is a textbook **false negative** of the database's quantitative screen: when the annotations of a multisystem disease are filled with haematological and visceral terms, the proportional method dilutes away a real and serious skeletal burden. Alagille syndrome is another instance of the same problem (see GLOBAL_NOTES).\n[A mechanistic difference from the rest of the database that must be stated] In the great majority of entries the skeletal phenotype arises from a glycan or core-protein defect **within cartilage or bone matrix itself**; in Gaucher disease it arises from the **space-occupying and paracrine effects of storage cells on the marrow**. Both fall under 'abnormal glycosylation plus skeletal abnormality', but they are not the same class of pathology. This should be borne in mind when reading the database by mechanism cluster.\n[Types II and III are predominantly neurological] Skeletal involvement is comparatively secondary in type II (acute neuronopathic) and type III (subacute), though it can be appreciable in type III. The 'skeletal' annotations of the perinatal lethal form (608013) are mainly arthrogryposis multiplex and thoracic hypoplasia, which are secondary changes.","sources":["OMIM 230800 / 230900 / 231000","GeneReviews: Gaucher Disease (NBK1269)","HPO phenotype.hpoa (Erlenmeyer flask deformity is carried by only 7 diseases in the full set, the basis for inclusion under Route B)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"OGT-CDG","zh":"OGT-CDG (X-linked intellectual disability syndrome)","en":"","genes":["OGT"],"cluster":"O_GlcNAc_nucleocytoplasmic","inh":"XL","omim":["300997"],"hpo":["HP:0030084","HP:0004209","HP:0100807","HP:0000252","HP:0004322","HP:0001510","HP:0001263","HP:0012345"],"pathway":"OGT encodes O-GlcNAc transferase, **the sole writer of all nucleocytoplasmic O-GlcNAc modification**, adding a single GlcNAc to serine and threonine residues of thousands of nuclear and cytosolic proteins; its counterpart OGA (O-GlcNAcase) is the only eraser. This is **topologically quite distinct** from the secretory-pathway (ER/Golgi) glycosylation of every other entry in the database: O-GlcNAc is a single sugar, never elongated or branched, and cycles reversibly, behaving more like phosphorylation than a classical glycan. OGT has a further, non-glycosyltransferase function: proteolytic processing of the transcriptional co-regulator HCF1.","notes":"[Reason for inclusion, with an explicit qualification: this entry does not meet the database's skeletal threshold] Skeletal terms make up only 3/20 = 15% of the official HPO annotations; the proportion passes but **the count of 3 is below 5**, so Route A is not satisfied, and there is no highly specific skeletal phenotype, so Route B is not satisfied either. It is nevertheless retained, flagged evidence_level=provisional, in order to **complete coverage of the types of glycosylation**: O-GlcNAc is an entire class of modification previously absent from the database (EOGT places O-GlcNAc on EGF domains within the ER lumen — a different enzyme, different substrate and different compartment from the nucleocytoplasmic O-GlcNAc of OGT, and not interchangeable with it). Users working through the differential diagnosis of a skeletal dysplasia **should not** treat this entry as a candidate; --established-only will exclude it.\n[Skele
