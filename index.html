s; OGT: only 3 skeletal terms, below the threshold, included to complete coverage of nucleocytoplasmic O-GlcNAc as a whole class of glycosylation); mechanism = a mechanism or pathway entry rather than a disease entity, with no causative gene (glycoRNA alone). Statistics and similarity calculations include all three by default; --established-only keeps only the established entries.","[An inherent limitation of the phenotype association graph, with a worked example] Nature 2025 showed that TGDS supplies UDP-xylose through UXS1, and UDP-xylose is precisely the substrate of XYLT1/XYLT2 — the two are directly connected biochemically. Yet the phenotypic Jaccard index between TGDS-CatelManzke and every linkeropathy entry falls below the default threshold of 0.25 (XYLT1 only 0.16, and B3GAT3, the highest, only 0.18). In other words, a purely phenotype-driven association graph cannot discover this pathway connection. The phenotype graph and the mechanism clusters must be used together; either alone will miss real relationships.","[Record of data updates] The TGDS entry was rewritten after the publication of Nature 2025;646:218-226, which showed that TGDS produces the 'enzyme-rescue metabolite' UDP-4-keto-6-deoxyglucose to revive UXS1, thereby resolving the contradiction between AJHG 2014 and Frontiers 2026 that this database had previously recorded side by side.","Status of RNA glycosylation: glycoRNA (Flynn 2021 Cell) is real, but its production depends on the classical N-glycan machinery, and there is at present **no** Mendelian disease gene specific to RNA glycosylation; moreover, work published in 2025 raises a technical question about the origin of the glycans in glycoRNA preparations. This database marks that boundary explicitly with evidence_level=mechanism.","[The intersection of glycoRNA with the proteoglycan axis, added in 2026] Nature 2026;651:808-818 showed that the clusters formed by cell-surface glycoRNA with RNA-binding proteins (csRNPs) use heparan sulfate as their assembly scaffold: EXT1, EXT2 and UXS1 were the top three hits of a genome-wide screen, and assembly depends on N-sulfation and 6-O-sulfation (NDST1, HS6ST1) but not on 2-O-sulfation (HS2ST1). Functionally, csRNPs negatively regulate VEGF-A165-VEGFR2-ERK signalling and can quench a Wnt3a fused to an HS-binding domain. This is the first verifiable biochemical point of contact between two mechanism clusters of this database that were otherwise independent (RNA_glycosylation and GAG_chain/GAG_sulfation). But the intersection has not been tested in the skeletal system, and no pathways field has therefore been added to any entry on its basis — which is exactly the purpose of grading evidence here as direct, functional or inferred. Review: Trends Genet 2026 doi:10.1016/j.tig.2026.05.002.","[v4.8: SULF1 added, GLA reviewed] The two candidate genes gave opposite screening results, and both are recorded here.\n- **SULF1 (included, provisional)**: encodes extracellular heparan sulfate 6-O-endosulfatase, which removes 6-O-sulfate from HS chains **after** they have been assembled — a post-synthetic glycan editing layer. Its disease, mesomelia-synostoses syndrome (MSS, OMIM 600383), has 15/33 = 45% skeletal terms among the official annotations, far above the Route A threshold, and carries three terms held by only one disease in the whole corpus, so Route B is met as well. The mechanism lies on the glycosylation machinery, so both criteria are satisfied. It is flagged provisional because MSS is a contiguous gene deletion syndrome (SULF1 plus SLCO5A1); although a 2024 translocation case excluded SLCO5A1 as the candidate, the alternative explanation of enhancer adoption has not been ruled out.\n- **GLA (not included)**: Fabry disease (OMIM 301500) has **no skeletal terms at all** among its 39 official annotations — 0% — and fails both Route A and Route B. This agrees with the earlier systematic screen of glycosphingolipid disorders recorded in this database (see the lipid glycosylation note).\nNote: if SULT1 was intended to mean the SULT1 family of cytosolic sulfotransferases (SULT1A1/A2/A3/B1/C2/C4/E1 and others), none of those genes has any OMIM disease association in HPO, and their substrates are small molecules such as hormones and xenobiotics rather than glycans, so the second criterion also fails.\n[Methodology: another blind spot of the same class as FAM20B] The v4.2 whole-set scan ran along the path 'gene to its OMIM diseases', and SULF1 has **no OMIM association** in HPO's genes_to_phenotype (contiguous gene deletion syndromes are usually not mapped at gene level), so neither Route A nor Route B could ever have hit it. It surfaced only when the screen was recomputed starting from diseases. Gene-driven scanning is therefore systematically blind to contiguous gene deletion syndromes, in the same way that it is blind to genes for which OMIM has not yet created a phenotype entry; both gaps can only be closed by literature searching.\n[Effect on the conclusions: a directional change worth recording] After SULF1-MSS was added, the within-group phenotypic cohesion of the GAG sulfation cluster fell from significant (P = 0.023) to non-significant (P = 0.094), and the number of significantly cohesive clusters dropped from 7/14 to 6/14. The reason is that the mesomelic shortening and multiple synostoses of MSS are far removed from the phenotypes of the other members of that cluster (diastrophic dysplasia, mcEDS, brachyolmia and so on). That a single atypical member can flip the cohesion of a whole cluster is itself a direct illustration of this paper's argument that the phenotypic homogeneity of mechanism clusters is fragile."]}</script>
<script>
const DB = JSON.parse(document.getElementById('DATA').textContent);
const T = DB.terms, DS = DB.diseases;

/* ---------- ontology helpers ---------- */
const ancCache = {};
function anc(id){
  if(ancCache[id]) return ancCache[id];
  const seen = new Set(), st = [id];
  while(st.length){
    const n = st.pop();
    if(seen.has(n) || !T[n]) continue;
    seen.add(n); T[n].p.forEach(x => st.push(x));
  }
  if(!seen.size) seen.add(id);
  return ancCache[id] = seen;
}
function tname(id){ const t = T[id]; if(!t) return id;
  /* in the English build z equals n (the official English name), so the
       label is not repeated as "name / name" */
  return (t.z && t.z !== t.n) ? `${t.n} / ${t.z}` : (t.n || id); }

/* does a disease match the query term (incl. ancestor propagation) */
function hitTerms(d, q, propagate){
  if(!q) return null;
  const out = [];
  for(const h of d.hpo){
    if(h === q || (propagate && anc(h).has(q))) out.push(h);
  }
  return out;
}

/* ---------- state ---------- */
const S = { q:'', hpo:'', prop:true, clusters:new Set(), inh:new Set(),
            pw:new Set(), dc:new Set(), est:false, view:'list', open:null, showPw:true };

/* ---------- initialise controls ---------- */
document.getElementById('hdr').textContent =
  `${DS.length}  diseases · ${new Set(DS.flatMap(d=>d.genes)).size}  genes · `+
  `${Object.keys(DB.clusters).length}  mechanism clusters · HPO ${DB.meta.hpo_version} · `+
  `ontology embedded: ${DB.meta.n_terms_embedded} / ${DB.meta.n_terms_full} terms`;

// Phenotypedropdown：curated terms + common root terms，sorted by number of matching diseases
const curated = Object.keys(T).filter(k=>T[k].c);
const cnt = {}; curated.forEach(k=> cnt[k] = DS.filter(d=>d.hpo.includes(k)).length);
const sel = document.getElementById('hsel');
curated.sort((a,b)=> (cnt[b]-cnt[a]) || a.localeCompare(b)).forEach(k=>{
  const o = document.createElement('option');
  o.value = k; o.textContent = `${tname(k)}  (${cnt[k]})`;
  sel.appendChild(o);
});

// common root terms chips
const rc = document.getElementById('rootchips');
Object.entries(DB.roots).forEach(([id,zh])=>{
  const c = document.createElement('span');
  c.className='chip'; c.dataset.id=id; c.textContent=mainName(zh);
  c.title = `${id} ${T[id]?T[id].n:''}`;
  c.onclick = ()=>{ S.hpo = (S.hpo===id?'':id); sel.value = S.hpo; render(); };
  rc.appendChild(c);
});

/* Take the main name: drop the parenthesised gloss and any alias after an
   em-dash. NOTE: the full-width bracket inside the regex must be written as
   the escape \uff08 - if written literally, ui_replace would treat it as
   translatable text in the English build and the split would fall back to
   whitespace. */
function mainName(s){
  return String(s).split(/[\uff08(]/)[0].trim().split(' \u2014\u2014 ')[0];
}
function inhShort(s){ return String(s).split(/[\uff08(]/)[0].trim(); }
function chipset(el, items, set){
  items.forEach(([v,label,title])=>{
    const c = document.createElement('span');
    c.className='chip'; c.dataset.v=v; c.textContent=label;
    if(title) c.title=title;
    c.onclick = ()=>{ set.has(v)?set.delete(v):set.add(v); render(); };
    el.appendChild(c);
  });
}
chipset(document.getElementById('cchips'),
  Object.entries(DB.clusters).map(([k,v])=>[k, mainName(v), v]),
  S.clusters);
chipset(document.getElementById('pchips'),
  Object.entries(DB.pathways).map(([k,v])=>[k,k,v.zh]),
  S.pw);
document.querySelectorAll('#pchips .chip').forEach(c=>{
  const col=DB.pathways[c.dataset.v].color;
  c.style.borderColor=col; c.dataset.col=col;});
chipset(document.getElementById('dchips'),
  Object.entries(DB.defect_classes).map(([k,v])=>[k,
    k==='core_protein'?'◆ core protein':'glycan machinery', v]),
  S.dc);
chipset(document.getElementById('ichips'),
  [...new Set(DS.map(d=>inhShort(d.inh)))].map(v=>[v,v,null]),
  S.inh);

document.getElementById('notes').innerHTML =

/* ---------- filtering ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* escape → **bold** → line break */
function fmt(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
/* reference entry：auto-detect DOI / PMID / PMC / OMIM and build outbound links */
function srcHTML(t){
  let h = esc(t);
  h = h.replace(/(10\.\d{4,9}\/[^\s,;)】]+)/g,
      '<a class="lnk" target="_blank" rel="noopener" href="https://doi.org/$1">$1</a>');
  h = h.replace(/PMID[:\s]*(\d{6,9})/g,
      'PMID:<a class="lnk" target="_blank" rel="noopener" '+
      'href="https://pubmed.ncbi.nlm.nih.gov/$1/">$1</a>');
  h = h.replace(/PMC(\d{6,9})/g,
      '<a class="lnk" target="_blank" rel="noopener" '+
      'href="https://pmc.ncbi.nlm.nih.gov/articles/PMC$1/">PMC$1</a>');
  h = h.replace(/(?:OMIM|MIM)[:\s]+(\d{6})/g,
      'OMIM <a class="lnk" target="_blank" rel="noopener" '+
      'href="https://omim.org/entry/$1">$1</a>');
  h = h.replace(/【(.+?)】/g,'<span class="keyref">$1</span>');
  return h;
}
function hay(d){
  return [d.key,d.zh,d.en,d.genes.join(' '),d.cluster,
          DB.clusters[d.cluster]||'',d.inh,d.omim.join(' '),
          d.hpo.join(' '),d.hpo.map(h=>tname(h)).join(' '),
          d.pathway,d.notes,d.sources.join(' ')].join(' ').toLowerCase();
}
function filtered(){
  const q = S.q.toLowerCase();
  return DS.filter(d=>{
    if(S.est && d.ev!=='established') return false;
    if(S.clusters.size && !S.clusters.has(d.cluster)) return false;
    if(S.inh.size && !S.inh.has(inhShort(d.inh))) return false;
    if(S.pw.size && !(d.pw||[]).some(w=>S.pw.has(w.name))) return false;
    if(S.dc.size && !S.dc.has(d.dc||'glycan_machinery')) return false;
    if(q && !hay(d).includes(q)) return false;
    if(S.hpo){ const h = hitTerms(d, S.hpo, S.prop); if(!h || !h.length) return false; }
    return true;
  });
}

/* ---------- rendering ---------- */
function hl(text){
  if(!S.q) return esc(text);
  const i = String(text).toLowerCase().indexOf(S.q.toLowerCase());
  if(i<0) return esc(text);
  return esc(String(text).slice(0,i)) + '<mark>' +
         esc(String(text).slice(i, i+S.q.length)) + '</mark>' +
         esc(String(text).slice(i+S.q.length));
}

    <div class="sec"><h3>HPO Phenotype (${d.hpo.length})</h3><div class="hpo">
      ${d.hpo.map(h=>`<a class="${hits.has(h)?'m':''}" target="_blank" rel="noopener"

      ).join('')}</div></div>
    ${(d.pw&&d.pw.length)?`<div class="sec"><h3>★ Associated signalling pathways</h3>
      ${d.pw.map(w=>{const P=DB.pathways[w.name];return `
      <div class="pwrow" style="border-left-color:${P.color}">

    <div class="sec"><h3>References (${d.sources.length})</h3>

function matrix(rows){
  const used = [...new Set(rows.flatMap(d=>d.hpo))]
    .sort((a,b)=> rows.filter(d=>d.hpo.includes(b)).length
                - rows.filter(d=>d.hpo.includes(a)).length || a.localeCompare(b));
  let h = '<div class="matrix"><table><tr><th></th>' +
    used.map((u,i)=>`<th title="${esc(tname(u))}">${i%10}</th>`).join('') + '</tr>';
  rows.forEach(d=>{
    h += `<tr><td style="white-space:nowrap">${esc(d.key)}</td>` +
      used.map(u=>`<td class="${d.hpo.includes(u)?'on':'off'}">`+
                  `${d.hpo.includes(u)?'#':'·'}</td>`).join('') + '</tr>';
  });
  h += '</table></div><div class="sec"><h3>Column legend</h3><ul class="src">' +
    used.map((u,i)=>`<li>${i} (${i%10}) &nbsp; <code>${u}</code> ${esc(tname(u))}`+
      ` &nbsp;[${rows.filter(d=>d.hpo.includes(u)).length}]</li>`).join('') +
    '</ul></div>';
  return h;
}


/* ====================== Network (force-directed) ====================== */
const PAL=['#5aa9e6','#7ddca4','#f0b849','#e8705f','#b18cd9','#63c7c7',
           '#e69ac4','#a8b545','#d98e4a','#8fa3bf','#c97b9e','#6fae7c','#bfa35c'];
const CL_IDX={}; Object.keys(DB.clusters).forEach((k,i)=>CL_IDX[k]=i);
const NET={kind:'disease',minShared:2,mode:'exact',thr:0.25,color:'cluster',nodes:[],links:[],
           raf:null,hover:null,drag:null,pan:{x:0,y:0},zoom:1};

function netData(rows){
  const keep=new Set(rows.map(d=>d.key));
  const G=DB.graph[NET.mode];
  const links=G.edges.filter(e=>e.w>=NET.thr&&keep.has(e.s)&&keep.has(e.t));
  const deg={}; links.forEach(e=>{deg[e.s]=(deg[e.s]||0)+1;deg[e.t]=(deg[e.t]||0)+1;});
  const nodes=rows.map(d=>({id:d.key,d:d,deg:deg[d.key]||0,
    comm:G.community[d.key]!==undefined?G.community[d.key]:-1}));
  return {nodes,links,deg};
}

/* bipartite：Disease ↔ HPO Phenotype */
function bipData(rows){
  const byTerm={};
  rows.forEach(d=>d.hpo.forEach(h=>{(byTerm[h]=byTerm[h]||[]).push(d.key)}));
  const terms=Object.keys(byTerm).filter(h=>byTerm[h].length>=NET.minShared).sort();
  const tset=new Set(terms);
  const links=[];
  rows.forEach(d=>d.hpo.forEach(h=>{if(tset.has(h))links.push({s:d.key,t:h});}));
  const deg={}; links.forEach(e=>{deg[e.s]=(deg[e.s]||0)+1;deg[e.t]=(deg[e.t]||0)+1;});
  const nodes=[];
  rows.forEach(d=>{ if(deg[d.key]) nodes.push(
      {id:d.key,kind:'d',d:d,deg:deg[d.key]}); });
  terms.forEach(h=>nodes.push(
      {id:h,kind:'p',hpo:h,deg:deg[h]||0,
       label:(T[h]&&(T[h].z||T[h].n))||h}));
  return {nodes,links,deg,terms};
}
function nodeColor(n){
  if(NET.color==='community') return n.comm<0?'#8b98a8':PAL[n.comm%PAL.length];
  if(NET.color==='inheritance'){
    const m={'AR':PAL[0],'AD':PAL[3],'XL':PAL[4]};
    return m[inhShort(n.d.inh)]||'#8b98a8';
  }
  return PAL[CL_IDX[n.d.cluster]%PAL.length];
}
function addPathwayLayer(nodes,links,rows){
  if(!S.showPw) return;
  const keep=new Set(rows.map(d=>d.key));
  const used={};
  rows.forEach(d=>(d.pw||[]).forEach(w=>{(used[w.name]=used[w.name]||[]).push(
      {k:d.key,ev:w.evidence})}));
  Object.keys(used).forEach(pn=>{
    nodes.push({id:'PW:'+pn,kind:'w',pw:pn,label:pn,
                zh:DB.pathways[pn].zh,color:DB.pathways[pn].color,
                deg:used[pn].length});
    used[pn].forEach(x=>{ if(keep.has(x.k))
      links.push({s:x.k,t:'PW:'+pn,w:0.6,pwEdge:true,ev:x.ev}); });
  });
}
function startSim(rows){
  const bip=NET.kind==='bipartite';
  const {nodes,links}=bip?bipData(rows):netData(rows);
  addPathwayLayer(nodes,links,rows);
  const cv=document.getElementById('net');
  const W=cv.clientWidth,H=cv.clientHeight;
  const area=W*H, n0=Math.max(nodes.length,1);
  NET.rep = Math.max(3000, area/n0*0.85);
  NET.springLen = Math.max(70, Math.sqrt(area/n0)*0.95);
  // init: diseases laid out in sectors by mechanism cluster; in the bipartite view phenotypes sit on the inner ring and diseases on the outer ring
  const groups=[...new Set(nodes.filter(n=>n.d).map(n=>n.d.cluster))];
  nodes.forEach((n,i)=>{
    const isW=n.kind==='w';
    const isP=(bip&&n.kind==='p')||isW;
    const gi=isP?-1:groups.indexOf(n.d.cluster);
    const a=isP?(i/nodes.length)*Math.PI*2
               :((gi/Math.max(groups.length,1))*Math.PI*2+(i%5)*0.12);
    const r=Math.min(W,H)*(isP?0.16:0.40);
    n.x=W/2+Math.cos(a)*r*(0.6+0.4*Math.random());
    n.y=H/2+Math.sin(a)*r*(0.6+0.4*Math.random());
    n.vx=0;n.vy=0;
    n.r=isW?(8+2.2*Math.sqrt(n.deg)):(isP?(4.5+2.0*Math.sqrt(n.deg))
                                          :(5+2.3*Math.sqrt(n.deg)));
  });
  const byId={}; nodes.forEach(n=>byId[n.id]=n);
  const L=links.map(e=>({a:byId[e.s],b:byId[e.t],
                         w:e.w!==undefined?e.w:0.45,
                         pwEdge:!!e.pwEdge, ev:e.ev})).filter(l=>l.a&&l.b);
  // mark diseases linked only through pathway edges
  const phenoDeg={}; L.forEach(l=>{ if(!l.pwEdge){
    phenoDeg[l.a.id]=(phenoDeg[l.a.id]||0)+1; phenoDeg[l.b.id]=(phenoDeg[l.b.id]||0)+1;}});
  nodes.forEach(n=>{ n.pwOnly = n.kind!=='w' && !phenoDeg[n.id] &&
    L.some(l=>l.pwEdge&&(l.a===n||l.b===n)); });
  NET.nodes=nodes; NET.links=L; NET.byId=byId; NET.bip=bip;
  NET.alpha=1;
  if(NET.raf) cancelAnimationFrame(NET.raf);
  tick();
}
function tick(){
  const cv=document.getElementById('net'); if(!cv) return;
  const W=cv.clientWidth,H=cv.clientHeight;
  const ns=NET.nodes,ls=NET.links;
  const a=NET.alpha;
  if(a>0.003){
    // repulsion
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
      const p=ns[i],q=ns[j];
      let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
      if(d2<1)d2=1;
      const d=Math.sqrt(d2);
      const f=NET.rep/d2;
      const fx=dx/d*f,fy=dy/d*f;
      p.vx-=fx;p.vy-=fy;q.vx+=fx;q.vy+=fy;
      const md=p.r+q.r+4;
      if(d<md){const push=(md-d)*0.5;p.vx-=dx/d*push;p.vy-=dy/d*push;
               q.vx+=dx/d*push;q.vy+=dy/d*push;}
    }
    // spring
    ls.forEach(l=>{
      const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y;
      const d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
      const target=l.pwEdge?NET.springLen*0.55:NET.springLen*(0.45+0.95*(1-l.w));
      const f=(d-target)*(l.pwEdge?0.075:0.04)*(l.pwEdge?1:(0.35+l.w));
      l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;
      l.b.vx-=dx/d*f;l.b.vy-=dy/d*f;
    });
    // centripetal + damping
    ns.forEach(n=>{
      n.vx+=(W/2-n.x)*0.0016; n.vy+=(H/2-n.y)*0.0016;
      if(n.deg===0){ n.vx+=(W/2-n.x)*0.004; n.vy+=(H/2-n.y)*0.004; }
      // pathway nodes and their pathway-only partners get extra centripetal pull,
      if(n.kind==='w'||n.pwOnly){ n.vx+=(W/2-n.x)*0.026; n.vy+=(H/2-n.y)*0.026; }
      if(n===NET.drag){n.vx=0;n.vy=0;return;}
      n.vx*=0.84;n.vy*=0.84;
      n.x+=Math.max(-22,Math.min(22,n.vx*a));
      n.y+=Math.max(-22,Math.min(22,n.vy*a));
      n.x=Math.max(n.r+2,Math.min(W-n.r-2,n.x));
      n.y=Math.max(n.r+2,Math.min(H-n.r-2,n.y));
    });
    NET.alpha*=0.99;
  }
  drawNet();
  NET.raf=requestAnimationFrame(tick);
}
function drawNet(){
  const cv=document.getElementById('net'); if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;}
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const hv=NET.hover;
  const near=new Set();
  if(hv){near.add(hv.id);NET.links.forEach(l=>{
    if(l.a===hv)near.add(l.b.id); if(l.b===hv)near.add(l.a.id);});}
  // edges
  NET.links.forEach(l=>{
    const on=!hv||(l.a===hv||l.b===hv);
    if(l.pwEdge){
      const col=(l.a.kind==='w'?l.a:l.b).color;
      g.setLineDash(l.ev==='inferred'?[3,4]:(l.ev==='functional'?[8,3]:[]));
      g.strokeStyle=on?col:'rgba(120,140,160,.07)';
      g.lineWidth=on?(l.ev==='direct'?3:2):0.5;
    } else {
      g.setLineDash([]);
      g.strokeStyle=on?`rgba(120,160,200,${0.16+0.6*l.w})`:'rgba(120,140,160,0.05)';
      g.lineWidth=on?(0.4+3.2*l.w):0.4;
    }
    g.beginPath();g.moveTo(l.a.x,l.a.y);g.lineTo(l.b.x,l.b.y);g.stroke();
  });
  g.setLineDash([]);
  // nodes：Disease=circle，Phenotype=diamond
  NET.nodes.forEach(n=>{
    const on=!hv||near.has(n.id);
    g.globalAlpha=on?1:0.22;
    if(n.kind==='w'){
      g.beginPath();
      for(let i=0;i<6;i++){const a2=Math.PI/6+i*Math.PI/3;
        const px=n.x+Math.cos(a2)*n.r*1.35, py=n.y+Math.sin(a2)*n.r*1.35;
        i?g.lineTo(px,py):g.moveTo(px,py);}
      g.closePath();
      g.fillStyle=n.color; g.fill();
      g.strokeStyle='#fff'; g.lineWidth=2.5; g.stroke();
    } else if(n.kind==='p'){
      g.beginPath();
      g.moveTo(n.x,n.y-n.r*1.25); g.lineTo(n.x+n.r*1.1,n.y);
      g.lineTo(n.x,n.y+n.r*1.25); g.lineTo(n.x-n.r*1.1,n.y); g.closePath();
      g.fillStyle=(S.hpo&&(n.id===S.hpo))?'#f0b849':'#8b98a8';
      g.fill();
      g.strokeStyle=n===hv?'#fff':'rgba(0,0,0,.25)';g.lineWidth=n===hv?2:1;g.stroke();
    } else {
      g.beginPath();g.arc(n.x,n.y,n.r,0,7);
      g.fillStyle=nodeColor(n);g.fill();
      if(n.d.ev!=='established'){g.strokeStyle='#b18cd9';g.lineWidth=2.4;g.stroke();}
      else if(n.d.dc==='core_protein'){g.strokeStyle='#d98e4a';g.lineWidth=2.8;g.stroke();}
      else if(n===hv){g.strokeStyle='#fff';g.lineWidth=2;g.stroke();}
    }
    g.globalAlpha=1;
  });
  // label：hubs, or the hovered neighbourhood
  g.font='10.5px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='center';g.textBaseline='top';
  const cs=getComputedStyle(document.body);
  const bg=cs.getPropertyValue('--panel')||'#fff';
  const fg=cs.getPropertyValue('--fg')||'#000';
  const cand=[...NET.nodes].sort((a,b)=>b.deg-a.deg)
    .filter(n=>hv?near.has(n.id):true);
  const placed=[];  // rectangles already occupied，avoid overlapping labels
  let shown=0;
  for(const n of cand.filter(x=>x.kind==='w').concat(cand.filter(x=>x.kind!=='w'))){
    if(!hv && n.kind!=='w' && shown>=14) break;
    let t=n.kind==='w'?(n.label+' '+n.zh)
          :(n.kind==='p'?n.label:(n.d.genes.length?n.d.genes.join('/'):n.id));
    if(t.length>16) t=t.slice(0,15)+'…';
    const w=g.measureText(t).width, h=12;
    const x=n.x-w/2, y=n.y+n.r+2;
    let clash=false;
    for(const r of placed){
      if(x<r.x+r.w+3&&x+w+3>r.x&&y<r.y+r.h+2&&y+h+2>r.y){clash=true;break;}
    }
    if(clash) continue;
    placed.push({x,y,w,h}); shown++;
    g.lineWidth=3.2;g.strokeStyle=bg;g.strokeText(t,n.x,y);
    g.fillStyle=fg;g.fillText(t,n.x,y);
  }
}
function netHitTest(mx,my){
  let best=null,bd=1e9;
  NET.nodes.forEach(n=>{
    const d=(n.x-mx)**2+(n.y-my)**2;
    if(d<(n.r+5)**2&&d<bd){bd=d;best=n;}
  });
  return best;
}
function bindNet(){
  const cv=document.getElementById('net'),tip=document.getElementById('tip');
  cv.onmousemove=ev=>{
    const r=cv.getBoundingClientRect();
    const mx=ev.clientX-r.left,my=ev.clientY-r.top;
    if(NET.drag){NET.drag.x=mx;NET.drag.y=my;NET.alpha=Math.max(NET.alpha,0.25);return;}
    const n=netHitTest(mx,my);
    NET.hover=n;
    if(n){
      if(n.kind==='w'){
        const ds=NET.links.filter(l=>(l.a===n||l.b===n))
          .map(l=>({o:(l.a===n?l.b:l.a),ev:l.ev})).filter(x=>x.o.d);
        tip.innerHTML=`<span class="pwb" style="background:${n.color}">`+
          `<i></i>${n.label} <small>${esc(n.zh)}</small></span><br>`+
          `linked to <b>${ds.length}</b>  diseases:<br>`+
          ds.map(x=>`<span style="color:var(--dim)">[${x.ev}]</span> `+
            `${x.o.d.genes.join('/')||x.o.id}`).join('<br>')+
          `<br><span style="color:var(--dim)">click = filter by this pathway</span>`;
      } else if(n.kind==='p'){
        const ds=NET.links.filter(l=>l.a===n||l.b===n)
          .map(l=>(l.a===n?l.b:l.a)).filter(o=>o.d);
        const cl={}; ds.forEach(o=>cl[o.d.cluster]=(cl[o.d.cluster]||0)+1);
        const mix=Object.entries(cl).sort((a,b)=>b[1]-a[1])
          .map(([k,v])=>`${esc(mainName(DB.clusters[k]))}×${v}`);
        tip.innerHTML=`<b>${esc(n.label)}</b><br>`+
          `<code style="color:var(--dim)">${n.id}</code>`+
          (T[n.id]&&T[n.id].n?` ${esc(T[n.id].n)}`:'')+`<br>`+
          `seen in <b>${ds.length}</b>  diseases, spanning <b>${Object.keys(cl).length}</b>  mechanism clusters<br>`+
          `<span style="color:var(--dim)">${mix.join(', ')}</span><br>`+
          `<span style="color:var(--dim)">click = filter the whole database by this phenotype</span>`;
      } else {
      const nb=NET.links.filter(l=>l.a===n||l.b===n)
        .sort((a,b)=>b.w-a.w).slice(0,4)
        .map(l=>{const o=l.a===n?l.b:l.a;
          return o.kind==='p'?esc(o.label)
                 :`${o.d.genes.join('/')||o.id} <b>${(l.w*100).toFixed(0)}%</b>`;});
      tip.innerHTML=`<b>${n.d.zh}</b><br>`+
        `<span style="color:var(--accent2)">${n.d.genes.join(', ')||' (no gene)'}</span>`+
        ` · ${inhShort(n.d.inh)}<br>`+
        `<span style="color:var(--dim)">${DB.clusters[n.d.cluster]}</span><br>`+
        `degree ${n.deg} · Phenotype ${n.d.hpo.length} `+
        (nb.length?`<br><span style="color:var(--dim)">${NET.bip?'phenotype: ':'most similar: '}`+
                   `</span>${nb.join(', ')}`:'')+
        `<br><span style="color:var(--dim)">click for details</span>`;
      }
      tip.style.display='block';
      tip.style.left=Math.min(mx+14,cv.clientWidth-310)+'px';
      tip.style.top=(my+14)+'px';
    } else tip.style.display='none';
  };
  cv.onmouseleave=()=>{NET.hover=null;tip.style.display='none';};
  cv.onmousedown=ev=>{
    const r=cv.getBoundingClientRect();
    const n=netHitTest(ev.clientX-r.left,ev.clientY-r.top);
    if(n){NET.drag=n;NET.dragMoved=false;cv.classList.add('drag');}
  };
  cv.onmouseup=ev=>{
    const was=NET.drag; NET.drag=null; cv.classList.remove('drag');
    const r=cv.getBoundingClientRect();
    const n=netHitTest(ev.clientX-r.left,ev.clientY-r.top);
    if(n&&n===was){
      if(n.kind==='w'){
        const ds=NET.links.filter(l=>(l.a===n||l.b===n))
          .map(l=>({o:(l.a===n?l.b:l.a),ev:l.ev})).filter(x=>x.o.d);
        tip.innerHTML=`<span class="pwb" style="background:${n.color}">`+
          `<i></i>${n.label} <small>${esc(n.zh)}</small></span><br>`+
          `linked to <b>${ds.length}</b>  diseases:<br>`+
          ds.map(x=>`<span style="color:var(--dim)">[${x.ev}]</span> `+
            `${x.o.d.genes.join('/')||x.o.id}`).join('<br>')+
          `<br><span style="color:var(--dim)">click = filter by this pathway</span>`;
      } else if(n.kind==='p'){
        S.hpo=(S.hpo===n.id)?'':n.id;
        const sel2=document.getElementById('hsel'); if(sel2) sel2.value=S.hpo;
        render();
      } else { S.open=n.id;S.view='list';render();
               window.scrollTo({top:0,behavior:'smooth'}); }
    }
  };
}

function bipView(rows){
  const {nodes,links,terms}=bipData(rows);
  const dn=nodes.filter(n=>n.kind==='d').length;
  // Cross-mechanism bridging phenotype: shared by >=2  diseases from different mechanism clusters
  const spread=terms.map(h=>{
    const cs=new Set(rows.filter(d=>d.hpo.includes(h)).map(d=>d.cluster));
    return {h,n:rows.filter(d=>d.hpo.includes(h)).length,c:cs.size};
  }).sort((a,b)=>b.c-a.c||b.n-a.n);
  const bridges=spread.filter(x=>x.c>=4).slice(0,8);
  return `
  <div class="gstat">
    <span>disease nodes <b>${dn}</b></span>
    <span>phenotype nodes <b>${terms.length}</b></span>
    <span>links <b>${links.length}</b></span>
    <span>phenotypes spanning ≥4 mechanism clusters <b>${spread.filter(x=>x.c>=4).length}</b></span>
  </div>
  <div id="netwrap">
    <div class="netbar">
      <label>Graph type
        <select id="nkind" style="width:auto;padding:4px 7px">
          <option value="disease">Disease similarity network</option>
          <option value="bipartite" selected>Disease–phenotype bipartite graph</option>
        </select></label>
      <label>phenotype present in at least <b id="msv">${NET.minShared}</b>  diseases
        <input type="range" id="nms" min="2" max="12" step="1"
               value="${NET.minShared}"></label>
      <label>Colour by
        <select id="ncol" style="width:auto;padding:4px 7px">
          <option value="cluster"${NET.color==='cluster'?' selected':''}>Mechanism cluster</option>
          <option value="community"${NET.color==='community'?' selected':''}>Phenotype community</option>
          <option value="inheritance"${NET.color==='inheritance'?' selected':''}>Inheritance</option>
        </select></label>
      <label class="chk" style="gap:5px"><input type="checkbox" id="npw"
        ${S.showPw?'checked':''}>★ Show signalling pathways</label>
      <button id="nrelax">Re-layout</button>
    </div>
    <canvas id="net"></canvas>
    <div id="tip"></div>
    <div class="legend">
      <span><i class="dot" style="background:#8b98a8"></i>phenotype (diamond)</span>
      <span><i class="dot" style="background:#f0b849"></i>currently filtered phenotype</span>
      ${[...new Set(rows.map(d=>d.cluster))].map(c=>
        `<span><i class="dot" style="background:${PAL[CL_IDX[c]%PAL.length]}"></i>`+
        `${esc(mainName(DB.clusters[c]))}</span>`).join('')}
      <span style="color:var(--dim)">Node size = degree · click a phenotype to filter ·
        clickDiseasefor details</span>
    </div>
  </div>
  ${bridges.length?`<div class="sec" style="margin-top:14px">
    <h3>Phenotypes spanning the most mechanisms (these link mechanistically unrelated diseases)</h3>
    <ul class="src">${bridges.map(x=>
      `<li><code>${x.h}</code> <b>${esc((T[x.h]&&(T[x.h].z||T[x.h].n))||x.h)}</b>`+
      ` — ${x.n}  diseases, spanning ${x.c}  mechanism clusters</li>`).join('')}</ul></div>`:''}`;
}

function netView(rows){
  if(NET.kind==='bipartite') return bipView(rows);
  const {links}=netData(rows);
  const within=links.filter(e=>{
    const A=DS.find(d=>d.key===e.s),B=DS.find(d=>d.key===e.t);
    return A&&B&&A.cluster===B.cluster;}).length;
  const comms={};
  rows.forEach(d=>{const c=DB.graph[NET.mode].community[d.key];
                   if(c!==undefined)(comms[c]=comms[c]||[]).push(d.key);});
  const nBig=Object.values(comms).filter(v=>v.length>1).length;
  const clustersUsed=[...new Set(rows.map(d=>d.cluster))];
  const legend = NET.color==='cluster'
    ? clustersUsed.map(c=>`<span><i class="dot" style="background:${
        PAL[CL_IDX[c]%PAL.length]}"></i>${esc(mainName(DB.clusters[c]))
        }</span>`).join('')
    : NET.color==='community'
    ? Object.keys(comms).sort((a,b)=>comms[b].length-comms[a].length)
        .map(c=>`<span><i class="dot" style="background:${PAL[c%PAL.length]}"></i>`+
                `Community ${c} (${comms[c].length})</span>`).join('')
    : ['AR','AD','XL'].map((v,i)=>`<span><i class="dot" style="background:${
        PAL[[0,3,4][i]]}"></i>${v}</span>`).join('');
  return `
  <div class="gstat">
    <span>nodes <b>${rows.length}</b></span>
    <span>edges <b>${links.length}</b></span>
    <span>within-mechanism edges <b>${within}</b> · cross-mechanism edges <b>${links.length-within}</b></span>
    <span>isolated nodes <b>${rows.length-new Set(links.flatMap(e=>[e.s,e.t])).size}</b></span>
    <span>phenotype communities <b>${nBig}</b> <span style="font-size:11px">(precomputed at threshold 0.25)</span></span>
  </div>
  <div id="netwrap">
    <div class="netbar">
      <label>Graph type
        <select id="nkind" style="width:auto;padding:4px 7px">
          <option value="disease" selected>Disease similarity network</option>
          <option value="bipartite">Disease–phenotype bipartite graph</option>
        </select></label>
      <label>Similarity basis
        <select id="nmode" style="width:auto;padding:4px 7px">
          <option value="exact"${NET.mode==='exact'?' selected':''}>exact terms</option>
          <option value="propagate"${NET.mode==='propagate'?' selected':''}>ancestor closure</option>
        </select></label>
      <label>threshold Jaccard ≥ <b id="thrv">${NET.thr.toFixed(2)}</b>
        <input type="range" id="nthr" min="0.10" max="0.70" step="0.05"
               value="${NET.thr}"></label>
      <label>Colour by
        <select id="ncol" style="width:auto;padding:4px 7px">
          <option value="cluster"${NET.color==='cluster'?' selected':''}>Mechanism cluster</option>
          <option value="community"${NET.color==='community'?' selected':''}>Phenotype community</option>
          <option value="inheritance"${NET.color==='inheritance'?' selected':''}>Inheritance</option>
        </select></label>
      <label class="chk" style="gap:5px"><input type="checkbox" id="npw"
        ${S.showPw?'checked':''}>★ Show signalling pathways</label>
      <button id="nrelax">Re-layout</button>
    </div>
    <canvas id="net"></canvas>
    <div id="tip"></div>
    <div class="legend">${legend}
      ${S.showPw?Object.entries(DB.pathways).map(([k,v])=>
        `<span><i class="dot" style="background:${v.color}"></i>★${k}</span>`).join(''):''}
      ${S.showPw?'<span style="color:var(--dim)">pathway = hexagon · solid = direct '+
        '· dashed = functional · dotted = inferred</span>':''}
      <span style="color:var(--dim)">node size = degree · edge width = similarity ·
        purple ring = mechanism entry · <span style="color:#d98e4a">orange ring = core-protein defect</span> ·
        hover highlights the neighbourhood · draggable · click for details</span></div>
  </div>`;
}

function render(){
  // chip state
  document.querySelectorAll('#cchips .chip').forEach(c=>
    c.classList.toggle('on', S.clusters.has(c.dataset.v)));
  document.querySelectorAll('#ichips .chip').forEach(c=>
    c.classList.toggle('on', S.inh.has(c.dataset.v)));
  document.querySelectorAll('#dchips .chip').forEach(c=>
    c.classList.toggle('on', S.dc.has(c.dataset.v)));
  document.querySelectorAll('#pchips .chip').forEach(c=>{
    const on=S.pw.has(c.dataset.v);
    c.classList.toggle('on', on);
    c.style.background=on?c.dataset.col:''; c.style.color=on?'#fff':'';});
  document.querySelectorAll('#rootchips .chip').forEach(c=>
    c.classList.toggle('on', S.hpo===c.dataset.id));

  const info = document.getElementById('propinfo');
  if(S.hpo){
    const sub = Object.keys(T).filter(k=>k===S.hpo||anc(k).has(S.hpo)).length;
    info.textContent = S.prop
      ? `${S.hpo}：ontology subtree contains ${sub}  embedded terms`
      : `${S.hpo}：exact match only`;
  } else info.textContent = '';

  const rows = filtered();
  document.getElementById('stat').innerHTML =
    `Matched <b>${rows.length}</b> / ${DS.length}  diseases · ` +
    `<b>${new Set(rows.flatMap(d=>d.genes)).size}</b>  genes` +
    (S.hpo ? ` · Phenotype <span class="badge hit">${esc(tname(S.hpo))}</span>`+
             `${S.prop?' <span class="badge">incl. descendant terms</span>':''}` : '');

  const out = document.getElementById('out');
  if(!rows.length){ out.innerHTML =
    '<div class="empty">No matching disease.<br>Try clearing some of the filters.</div>'; return; }

  if(S.view==='matrix'){ out.innerHTML = matrix(rows); return; }

  if(S.view==='net'){
    out.innerHTML = netView(rows);
    if(document.getElementById('nthr'))
    document.getElementById('nthr').oninput=e=>{
      NET.thr=parseFloat(e.target.value);
      document.getElementById('thrv').textContent=NET.thr.toFixed(2);
      const r=filtered(); const d=netData(r);
      NET.links=d.links.map(e2=>({a:NET.byId[e2.s],b:NET.byId[e2.t],w:e2.w}))
                       .filter(l=>l.a&&l.b);
      const deg={}; NET.links.forEach(l=>{deg[l.a.id]=(deg[l.a.id]||0)+1;
                                          deg[l.b.id]=(deg[l.b.id]||0)+1;});
      NET.nodes.forEach(n=>{n.deg=deg[n.id]||0;n.r=5+2.3*Math.sqrt(n.deg);});
      NET.alpha=Math.max(NET.alpha,0.45);
      const st=out.querySelector('.gstat');
      if(st){
        const wi=NET.links.filter(l=>l.a.d.cluster===l.b.d.cluster).length;
        st.children[1].innerHTML='edges <b>'+NET.links.length+'</b>';
        st.children[2].innerHTML='within-mechanism edges <b>'+wi+'</b> · cross-mechanism edges <b>'+
                                 (NET.links.length-wi)+'</b>';
        const iso=NET.nodes.filter(n=>n.deg===0).length;
        st.children[3].innerHTML='isolated nodes <b>'+iso+'</b>';
      }
    };
    const q=id=>document.getElementById(id);
    if(q('nkind')) q('nkind').onchange=e=>{NET.kind=e.target.value;render();};
    if(q('nmode')) q('nmode').onchange=e=>{NET.mode=e.target.value;render();};
    if(q('ncol'))  q('ncol').onchange=e=>{NET.color=e.target.value;render();};
    if(q('nms'))   q('nms').oninput=e=>{
      NET.minShared=parseInt(e.target.value);
      q('msv').textContent=NET.minShared; render(); };
    if(q('npw'))   q('npw').onchange=e=>{S.showPw=e.target.checked;render();};
    if(q('nrelax'))q('nrelax').onclick=()=>startSim(filtered());
    startSim(rows); bindNet();
    return;
  }

  if(S.open){
    const d = rows.find(x=>x.key===S.open) || DS.find(x=>x.key===S.open);
    if(d){ out.innerHTML =
      `<button id="back" style="margin-bottom:12px">← Back to list</button>` + card(d);
      document.getElementById('back').onclick=()=>{S.open=null;render();}; return; }
  }

  out.innerHTML = `<table><thead><tr>
      <th>Disease</th><th>Gene</th><th>Inherit.</th><th>OMIM</th><th>Cluster</th>
      ${S.hpo?'<th>Matched phenotype</th>':''}</tr></thead><tbody>` +
    rows.map(d=>{
      const hits = S.hpo ? (hitTerms(d,S.hpo,S.prop)||[]) : [];
      return `<tr class="row" data-k="${esc(d.key)}">
        <td><div>${hl(d.zh)}
            ${(d.pw||[]).map(w=>`<span class="pwb" style="background:${
              DB.pathways[w.name].color};padding:1px 7px;font-size:10px">${w.name
              }</span>`).join('')}</div>
            <div style="color:var(--dim);font-size:11.5px">${esc(d.key)}
            ${d.ev!=='established'?`<span class="badge mech">${d.ev}</span>`:''}${
              d.dc==='core_protein'?'<span class="badge core">◆ core protein</span>':''}</div></td>
        <td class="gene">${d.genes.map(g=>hl(g)).join('<br>')||'—'}</td>
        <td><span class="badge">${esc(inhShort(d.inh))}</span></td>
        <td style="font-size:12px">${d.omim.join('<br>')||'—'}</td>
        <td style="font-size:11.5px;color:var(--dim)">${esc(d.cluster)}</td>
        ${S.hpo?`<td style="font-size:11.5px">${hits.map(h=>
           esc(T[h]?(T[h].z||T[h].n):h)).join(', ')}</td>`:''}
      </tr>`;}).join('') + '</tbody></table>';

  out.querySelectorAll('tr.row').forEach(tr=>
    tr.onclick = ()=>{ S.open = tr.dataset.k; render();
                       window.scrollTo({top:0,behavior:'smooth'}); });
}
render();
</script>
</body>
</html>
