<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glycosylation-related skeletal dysplasia database</title>
<style>
:root{
  --bg:#0f1419; --panel:#171d24; --panel2:#1e252e; --line:#2b3540;
  --fg:#e3e8ee; --dim:#8b98a8; --accent:#5aa9e6; --accent2:#7ddca4;
  --warn:#f0b849; --danger:#e8705f; --mech:#b18cd9;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--line:#d8dee4;
        --fg:#1c2128;--dim:#5b6874;--accent:#0969da;--accent2:#1a7f4b;
        --warn:#9a6700;--danger:#cf222e;--mech:#8250df;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",
  "PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 20px;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:17px;font-weight:650}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:0;min-height:calc(100vh - 62px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;
  overflow-y:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
@media(max-width:900px){aside{position:static;max-height:none}}
main{padding:18px 22px;overflow-x:hidden}
.grp{margin-bottom:18px}
.grp>label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;font-weight:650}
input[type=search],input[type=text],select{width:100%;padding:8px 10px;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:3px 10px;font-size:11.5px;cursor:pointer;user-select:none;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{color:var(--dim);font-size:12.5px;margin-bottom:12px}
.stat b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
.gene{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  color:var(--accent2);font-weight:600}
.badge{display:inline-block;padding:1.5px 7px;border-radius:4px;font-size:10.5px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.mech{color:var(--mech);border-color:var(--mech)}
.badge.core{color:#d98e4a;border-color:#d98e4a;font-weight:650}
.corebox{background:color-mix(in srgb,#d98e4a 12%,transparent);
  border-left:3px solid #d98e4a;padding:8px 12px;border-radius:0 5px 5px 0;
  font-size:12.5px;margin-bottom:10px}
.badge.hit{color:var(--accent);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:15.5px}
.card .en{color:var(--dim);font-size:12.5px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 12px;font-size:13px;
  margin-bottom:11px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.sec{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:650}
.hpo{display:flex;flex-wrap:wrap;gap:5px}
.hpo a{text-decoration:none;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;padding:3px 8px;font-size:11.5px;color:var(--fg)}
.hpo a:hover{border-color:var(--accent)}
.hpo a.m{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.hpo code{color:var(--dim);font-size:10.5px}
.note{background:color-mix(in srgb,var(--warn) 11%,transparent);
  border-left:3px solid var(--warn);padding:9px 12px;border-radius:0 5px 5px 0;
  font-size:12.5px;white-space:pre-wrap}
.mechbox{background:color-mix(in srgb,var(--mech) 11%,transparent);
  border-left:3px solid var(--mech);padding:9px 12px;border-radius:0 5px 5px 0;
  font-size:12.5px;white-space:normal}
ul.src{margin:0;padding-left:17px;font-size:12px;color:var(--dim)}
ul.src li.key{color:var(--fg)}
.keyref{display:inline-block;background:var(--accent);color:#fff;border-radius:4px;
  padding:0 6px;font-size:10.5px;margin-left:4px;vertical-align:1px}
.pwb{display:inline-flex;align-items:center;gap:5px;border-radius:14px;
  padding:2px 10px 2px 7px;font-size:11.5px;font-weight:650;color:#fff;
  margin:2px 4px 2px 0;white-space:nowrap}
.pwb i{width:8px;height:8px;border-radius:50%;background:#fff9;flex:none}
.pwb small{font-weight:400;opacity:.85;font-size:10px}
.pwrow{border-left:3px solid var(--line);padding:6px 0 6px 11px;margin-bottom:8px}
.pwrow .n{font-size:12px;color:var(--dim);margin-top:3px}
.evb{display:inline-block;border:1px solid currentColor;border-radius:3px;
  padding:0 5px;font-size:10px;margin-left:5px;font-weight:600}
.empty{text-align:center;color:var(--dim);padding:50px 20px}
a.lnk{color:var(--accent);text-decoration:none}
a.lnk:hover{text-decoration:underline}
details.meta{margin-top:20px;font-size:12px;color:var(--dim)}
details.meta summary{cursor:pointer;color:var(--accent)}
details.meta li{margin-bottom:5px}
.matrix{overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.matrix td,.matrix th{padding:2px 4px;border:none}
.matrix .on{color:var(--accent2);font-weight:700}
.matrix .off{color:var(--line)}
mark{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;
  padding:0 1px;border-radius:2px}
#netwrap{position:relative;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);overflow:hidden}
#net{display:block;width:100%;height:660px;cursor:grab}
#net.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:var(--panel2);
  border:1px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:12px;
  max-width:300px;display:none;z-index:5;box-shadow:0 4px 14px #0006}
.netbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 12px;
  border-bottom:1px solid var(--line);font-size:12.5px;background:var(--panel2)}
.netbar label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.netbar input[type=range]{width:120px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:9px 12px;font-size:11.5px;
  border-top:1px solid var(--line);background:var(--panel2)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.gstat{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0;font-size:12.5px;
  color:var(--dim)}
.gstat b{color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>Glycosylation-related skeletal dysplasia database</h1>
  <div class="sub" id="hdr"></div>
</header>

<div class="wrap">
<aside>
  <div class="grp">
    <label>Full-text search</label>
    <input type="search" id="q" placeholder="gene / disease / pathway / OMIM…" autocomplete="off">
  </div>

  <div class="grp">
    <label>HPO phenotype (descendant terms included)</label>
    <select id="hsel"><option value="">— any —</option></select>
    <div class="chips" id="rootchips"></div>
    <label class="chk" style="margin-top:8px">
      <input type="checkbox" id="prop" checked>Use ontology propagation
    </label>
    <div class="sub" id="propinfo"></div>
  </div>

  <div class="grp">
    <label>Mechanism cluster</label>
    <div class="chips" id="cchips"></div>
  </div>

  <div class="grp">
    <label>★ Signalling pathway</label>
    <div class="chips" id="pchips"></div>
  </div>

  <div class="grp">
    <label>Inheritance</label>
    <div class="chips" id="ichips"></div>
  </div>

  <div class="grp">
    <label>◆ Defect class</label>
    <div class="chips" id="dchips"></div>
  </div>

  <div class="grp">
    <label class="chk"><input type="checkbox" id="estonly">Established Mendelian diseases only</label>
  </div>

  <div class="grp" style="display:flex;gap:7px;flex-wrap:wrap">
    <button id="reset">Clear filters</button>
    <button id="tomatrix">Phenotype matrix</button>
    <button id="tonet">Network</button>
    <button id="dl" class="pri">Export JSON</button>
  </div>

  <details class="meta">
    <summary>Scope, caveats and limitations</summary>
    <ul id="notes"></ul>
  </details>
</aside>

<main>
  <div class="stat" id="stat"></div>
  <div id="out"></div>
</main>
</div>

GBS1"],"n_diseases":4,"n_clusters":3}],"edges":[{"disease":"COG4-SaulWilson","pathway":"WNT","evidence":"functional","note":"In zebrafish, wnt4 overexpression phenocopies the disorder and the Wnt inhibitor LGK974 rescues the defect caused by COG4 p.G516R; glypicans (HSPGs) accumulate in patient fibroblasts."},{"disease":"COG4-SaulWilson","pathway":"BMP","evidence":"functional","note":"COG4 p.G516R chondrosarcoma cells show a delayed response to BMP2, with reduced expression of MMP13 and COL10A1."},{"disease":"FAM20B-SKD","pathway":"WNT","evidence":"functional","note":"In mice with conditional knockout of Fam20b in articular cartilage, epiphyseal chondrocytes show **gain of function** across several pathways including Wnt, and develop chondrosarcoma with postnatal ossification defects. The evidence comes from a conditional mouse knockout and has not been verified in human patient material."},{"disease":"FAM20B-SKD","pathway":"BMP","evidence":"functional","note":"BMP signalling likewise shows gain of function in the same mouse model. Mechanistically this is mutually corroborative with HS defects of the EXT1/EXT2 kind: fewer GAG chains release the constraint on morphogen diffusion and presentation. Also model-organism evidence."},{"disease":"EXT1-EXT2-HME","pathway":"BMP","evidence":"inferred","note":"The sulfation pattern of HS determines its binding to signalling proteins, and the distribution and activity of BMP family members expressed in the growth plate are HS-regulated. This is a mechanistic inference at the level of pathway biology, not a direct readout in HME patient samples."},{"disease":"EXT1-EXT2-HME","pathway":"HEDGEHOG","evidence":"inferred","note":"The Drosophila EXT1 orthologue tout-velu implicates HS in the spread of Hedgehog; the evidence is from a model organism and has not been verified directly in human HME."},{"disease":"GALNT3-HFTC","pathway":"FGF23","evidence":"direct","note":"ppGalNAc-T3 directly places mucin-type O-glycans on FGF23; this modification is a prerequisite for FGF23 stability and secretion, and its loss leads to proteolysis of FGF23, disrupting the FGF23-alphaKlotho-FGFR phosphate homeostasis axis."},{"disease":"LFNG-SCDO3","pathway":"NOTCH","evidence":"direct","note":"LFNG (Lunatic Fringe) is a Golgi-resident beta-1,3-N-acetylglucosaminyltransferase that transfers GlcNAc onto the O-fucose residues of the EGF-like repeats in the NOTCH1 extracellular domain, elongating the O-fucose glycan and shifting the receptor's ligand preference (strengthening binding to DLL1, suppressing binding to JAG1). The patient F188L mutant protein loses enzymatic activity, is mislocalised subcellularly and cannot modulate Notch signalling in cell-based assays — evidence at both the direct and the functional level."},{"disease":"EOGT-AOS4","pathway":"NOTCH","evidence":"direct","note":"EOGT is an EGF domain-specific O-linked N-acetylglucosaminyltransferase of the ER lumen (family GT61) that uses UDP-GlcNAc as donor and specifically glycosylates the threonine **between the fifth and sixth conserved cysteines** of folded EGF-like domains, with NOTCH receptors among its substrates; this O-GlcNAc can be further elongated into a glycan capped with N-acetyllactosamine. GeneReviews states explicitly that 'EOGT glycosylates NOTCH1', which is direct-level evidence."},{"disease":"EXTL3-ISDNA","pathway":"FGF","evidence":"functional","note":"Functional analysis indicates that EXTL3 mutations **enhance FGF2 signalling** by altering the length and composition of heparan sulfate (HS) chains; ERK phosphorylation after FGF2 stimulation is raised in patient fibroblasts and is corrected by EXTL3 overexpression."},{"disease":"CHSY1-TPBS","pathway":"NOTCH","evidence":"functional","note":"A secreted form of CHSY1 exists and contains a Fringe domain; its loss **triggers NOTCH activation** in cultured fibroblasts and in chsy1 knockdown zebrafish embryos. On this basis CHSY1 has been proposed to inhibit the NOTCH pathway in the extracellular space through its Fringe domain."},{"disease":"CHSY1-TPBS","pathway":"BMP","evidence":"functional","note":"Gdf5 (BMP-14) is abnormally expressed in the digits of Chsy1 knockout mice. Gdf5 belongs to the TGF-beta superfamily and is one of the earliest markers of embryonic joint formation, implicating BMP signalling."},{"disease":"CHSY1-TPBS","pathway":"HEDGEHOG","evidence":"functional","note":"In the same Chsy1 knockout mouse model, endochondral expression of Ihh during differentiation of the skeletal elements is abnormal."},{"disease":"GPC6-OMOD1","pathway":"HEDGEHOG","evidence":"functional","note":"Gpc6 knockout mice die at birth with severe facial malformation and a skeleton markedly shorter than that of littermate controls; the phenotype has been attributed to defective signalling by the morphogen **Sonic hedgehog**, a heparin-binding protein."},{"disease":"GPC3-SGBS1","pathway":"HEDGEHOG","evidence":"functional","note":"This is the entry with the strongest Hedgehog pathway evidence in the database, but **the direction is disputed in the literature**. The series of studies from the Filmus laboratory (Capurro 2008 Dev Cell and others) argues that GPC3 is a **negative** regulator of Hh: GPC3 binds Hh with high affinity but does not bind its receptor Patched, competes with Patched for Hh, and induces LRP1-mediated endocytosis and degradation of Hh; Hh signalling is raised in Gpc3-null embryos. Genetic epistasis supports the model — Gpc3-null mice overgrow by 29.9% on an Ihh wild-type background but by only 19.8% on an Ihh-null background, so removing Ihh partially rescues the overgrowth. Against this, Liu, Wierbowski and Salic 2022 (J Cell Sci 135:jcs259297) report that GPC3 **is required** for the Hh response and acts at a downstream signal transduction step. The two point in opposite directions and are recorded here side by side without adjudication."},{"disease":"GPC3-SGBS1","pathway":"WNT","evidence":"functional","note":"Loss of GPC3 alters Wnt signalling (Song, Shi, Xiang & Filmus, JBC 2005); several reviews describe GPC3 as a **positive** regulator of canonical Wnt/beta-catenin acting through both the core protein and the HS chains, consistent with its tumour-promoting role in hepatocellular carcinoma and Wilms tumour. The direction is opposite to that for Hedgehog, in keeping with the general property of glypicans of activating or inhibiting according to context."},{"disease":"BGN-SEMDX","pathway":"TGFB","evidence":"functional","note":"Biglycan binds TGF-beta and thereby regulates its free concentration. Three-dimensional modelling places both pathogenic residues (K147E, G259V) on the **concave face of the leucine-rich repeat domain — precisely the interface that interacts with TGF-beta**. Mutant biglycan is expressed at lower levels and degraded faster in patient fibroblasts, which is presumed to alter extracellular TGF-beta signalling."},{"disease":"BGN-SEMDX","pathway":"BMP","evidence":"inferred","note":"Biglycan has been reported to regulate BMP4-induced osteoblast differentiation and to control osteogenic differentiation through Erk-activated Runx2 and through the SMAD1/5/8 pathway; but these are general features of biglycan biology rather than direct readouts in SEMDX patients."},{"disease":"BGN-SEMDX","pathway":"WNT","evidence":"inferred","note":"Biglycan has been reported to modulate canonical Wnt signalling (Berendsen et al. PNAS 2011); again general biology rather than evidence specific to this disease."},{"disease":"NGLY1-CDDG","pathway":"BMP","evidence":"functional","note":"Reviews list bone morphogenetic protein (BMP) signalling explicitly among the key processes affected by loss of NGLY1; the evidence comes mainly from Drosophila, C. elegans and rodent models, with limited direct readout in human patients."}],"evidence_counts":{"functional":13,"inferred":4,"direct":3},"evidence_legend":{"direct":"direct — the gene product directly glycosylates a core pathway component","functional":"functional — experime LG12-CDG (CDG-Ig)","en":"","genes":["ALG12"],"cluster":"N_glycosylation_LLO","inh":"AR","omim":["607143"],"hpo":["HP:0012345","HP:0002652","HP:0005716","HP:0001627","HP:0002721","HP:0001263"],"pathway":"LLO mannosyltransferase; affected sibs have been reported with a distinctive skeletal dysplasia accompanied by hypogammaglobulinaemia, cardiomyopathy, genital malformation and early lethality.","notes":"","sources":["Am J Med Genet A 2007;143:1371-1378","Mol Genet Metab Rep 2014;1:213-219"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"ALG6-CDG","zh":"ALG6-CDG (CDG-Ic)","en":"","genes":["ALG6"],"cluster":"N_glycosylation_LLO","inh":"AR","omim":["603147"],"hpo":["HP:0012345","HP:0001156","HP:0002650","HP:0002652","HP:0001263","HP:0001252"],"pathway":"LLO glucosyltransferase; the second most common N-glycosylation defect. The phenotype is milder than PMM2-CDG and includes a skeletal dysplasia with brachydactyly, finger deformities, scoliosis and short terminal phalanges.","notes":"","sources":["Ann Transl Med 2018 (Chang et al.)","Clin Genet 2010;77:507-509"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PMM2-CDG","zh":"PMM2-CDG (CDG-Ia)","en":"","genes":["PMM2"],"cluster":"nucleotide_sugar","inh":"AR","omim":["212065"],"hpo":["HP:0012345","HP:0004349","HP:0003468","HP:0000944","HP:0002663","HP:0003467","HP:0001382","HP:0001999","HP:0001263","HP:0003026"],"pathway":"Deficiency of phosphomannomutase-2 blocks the conversion of mannose-6-phosphate to mannose-1-phosphate; the resulting shortfall in GDP-mannose supply impairs LLO synthesis.","notes":"Discrepancy: reviews of the skeletal features of CDG contrast PMM2-CDG with the other CDGs and conclude that it lacks a 'definite skeletal dysplasia'; yet individual cases catalogued in OMIM present as a primary skeletal dysplasia (imaging resembling Kniest dysplasia or congenital spondyloepiphyseal dysplasia).","sources":["OMIM 212065","Diagnostics (MDPI) 2021;11:1438","Am J Med Genet A 2008;146:389-392"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PGM3-CDG","zh":"PGM3-CDG; immunodeficiency with skeletal dysplasia","en":"","genes":["PGM3"],"cluster":"nucleotide_sugar","inh":"AR","omim":["615816"],"hpo":["HP:0012345","HP:0002652","HP:0005716","HP:0002721","HP:0001510","HP:0001263"],"pathway":"PGM3 synthesises UDP-GlcNAc, the common precursor for both N-linked and O-linked glycosylation; depletion of this precursor strikes both pathways at once, which may account for the severity of the skeletal phenotype.","notes":"","sources":["Am J Hum Genet 2014;95:96-107","J Bone Miner Res 2017;32:1853-1859","Diagnostics (MDPI) 2021;11:1438"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC35D1-Schneckenbecken","zh":"Schneckenbecken dysplasia (SLC35D1)","en":"","genes":["SLC35D1"],"cluster":"nucleotide_sugar","inh":"AR","omim":["269250"],"hpo":["HP:0002652","HP:0005716","HP:0003468","HP:0000944","HP:0002983"],"pathway":"Endoplasmic-reticulum UDP-glucuronic acid / UDP-GalNAc transporter; an inadequate nucleotide-sugar supply impairs GAG synthesis in the cartilage matrix. Belongs to the group of severe prenatal-onset skeletal dysplasias.","notes":"Hypomorphic SLC35D1 alleles can produce a milder 'Schneckenbecken-like' dysplasia.","sources":["Hum Mol Genet 2019;28:3543-3551","Diagnostics (MDPI) 2021;11:1438"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"TMEM165-CDG","zh":"TMEM165-CDG (CDG-IIk)","en":"","genes":["TMEM165"],"cluster":"golgi_homeostasis","inh":"AR","omim":["614727"],"hpo":["HP:0012345","HP:0002652","HP:0001510","HP:0004349","HP:0001263"],"pathway":"Golgi Mn2+/Ca2+ homeostasis protein; disturbed Golgi ion homeostasis impairs glycosyltransferase activity. The severe phenotype is growth retardation resistant to growth hormone, with psychomotor impairment.","notes":"","sources":["Am J Hum Genet 2012;91:15-26","Front Genet 2021;12:642097","Diagnostics (MDPI) 2021;11:1438"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"COG4-SaulWilson","zh":"Saul-Wilson syndrome; COG4-CDG(ad)","en":"","genes":["COG4"],"cluster":"golgi_homeostasis","inh":"AD (de novo; all reported p.Gly516Arg)","omim":["618150"],"hpo":["HP:0002652","HP:0003510","HP:0001511","HP:0001156","HP:0001762","HP:0000518","HP:0001999","HP:0001385","HP:0003467"],"pathway":"Defect in a subunit of the COG complex accelerates retrograde (Golgi-to-ER) transport and shrinks Golgi volume; the Golgi-dependent glycosylation of decorin is abnormal and glypicans (HSPGs) accumulate, deranging Wnt signalling (wnt4 overexpression phenocopies the disorder and the Wnt inhibitor LGK974 rescues it). In chondrocytes MMP13 and COL10A1 are reduced and the response to BMP2 is delayed.","notes":"[COG4-CDG(ar) is a different disease — one gene, two inheritance patterns, two phenotypes] This entry is the single heterozygous de novo variant p.Gly516Arg (c.1546G>A, OMIM 618150); biallelic loss-of-function variants instead cause COG4-CDG / CDG-IIj (OMIM 613489, AR), dominated by severe intellectual disability, epilepsy, hypotonia, liver cirrhosis, recurrent infection and early death. The distinction can be quantified: under this database's screening criteria, 18/42 = 43% of the official HPO annotations for Saul-Wilson syndrome fall within the HP:0000924 (abnormality of the skeletal system) subtree, against only 1/29 = 3% for COG4-CDG(ar) — the single term being microcephaly. Two diseases of the same gene, with a more than tenfold difference in skeletal burden. Only Saul-Wilson syndrome is therefore included here; COG4-CDG(ar) falls far below the inclusion threshold and has no entry. That is not an omission but the expected result of applying the screen.\n[Why the mechanisms differ] p.Gly516Arg is not a simple loss of function: the variant accelerates retrograde (Golgi-to-ER) transport and shrinks the Golgi, behaving more like a gain-of-function or dominant-negative allele — a molecular event distinct from biallelic loss of function disrupting assembly of the COG complex.\nDiscrepancy: global protein glycosylation in patient serum and fibroblasts is reported as 'not appreciably altered', and the N-glycan changes in cell models as 'very subtle and cell-type dependent'. The core defect lies in vesicular transport and proteoglycan glycosylation, and whether the disorder should be classified as a typical CDG is contested. HP:0012345 is therefore not annotated for this entry.","sources":["GeneReviews NBK554080","Am J Hum Genet 2018;103:553-567","Front Cell Dev Biol 2021;9:720688","Front Cell Dev Biol 2022;10:979096","Mol Genet Metab 2024 (CDG nosology)"],"ev":"established","pw":[{"name":"WNT","evidence":"functional","note":"In zebrafish, wnt4 overexpression phenocopies the disorder and the Wnt inhibitor LGK974 rescues the defect caused by COG4 p.G516R; glypicans (HSPGs) accumulate in patient fibroblasts."},{"name":"BMP","evidence":"functional","note":"COG4 p.G516R chondrosarcoma cells show a delayed response to BMP2, with reduced expression of MMP13 and COL10A1."}],"dc":"glycan_machinery"},{"key":"COG1-CDG","zh":"COG1-CDG (CDG-IIg); severe form: cerebrocostomandibular-like syndrome with vertebral defects","en":"","genes":["COG1"],"cluster":"golgi_homeostasis","inh":"AR","omim":["611209"],"hpo":["HP:0003316","HP:0030282","HP:0000902","HP:0003422","HP:0003177","HP:0003182","HP:0003090","HP:0006429","HP:0008905","HP:0003026","HP:0002751","HP:0002943","HP:0000938","HP:0000470","HP:0000347","HP:0000175","HP:0009465","HP:0000253","HP:0001762","HP:0012345"],"pathway":"COG1 is a lobe-A subunit of the conserved oligomeric Golgi (COG) complex. The COG complex tethers intra-Golgi vesicles and positions glycosylation enzymes correctly; its failure mislocalises numerous glycosyltransferases and glycosidases, so that **N- and O-glycosylation are impaired simultaneously** (ApoC3 analysis in patients shows an O-glycosylation defect as well) and serum transferrin shows a CDG type II isoelectric-focusing pattern. The COG1-COG8 interaction is critical for assembly of the whole COG complex, which is why the two deficiencies are biochemically closely similar.","notes":"[One of the few CDGs in this database whose axis is vertebral and costal malformation] The skeletal phenotype is not ordinary short stature or osteoporosis but **butterfly vertebrae, rib fusion, posterior rib gaps, vertebral segmentation defects, squared iliac bones, shallow acetabular fossae and hypoplastic femoral capital epiphyses** — placing it among the 'osteodysplasias that are predominantly vertebral, with or without rib involvement'. The Genomics England skeletal dysplasia panel rates COG1 green (at least three unrelated cases).\n[Allelic severity gradient] The infant girl first reported by Foulquier et al. 2006 was mildly affected: feeding difficulty, growth retardation with rhizomelic short stature, progressive microcephaly, mild psychomotor delay and mild hepatosplenomegaly. The two cases reported by Zeevaert et al. 2009 were severe, presenting as a **cerebrocostomandibular-like syndrome** (Pierre-Robin sequence: cleft palate, micrognathia, glossoptosis; plus rib fusion and posterior rib gaps, butterfly vertebrae and vertebral misalignment). The original authors proposed that the severe form corresponds to more complete truncation of the COG1 protein — an intragenic dose-severity relationship.\n[Screening data] 21/76 = 28% of the official HPO annotations fall within the HP:0000924 subtree, and the great majority are structural changes of vertebrae, ribs, ilia and femoral heads — axial and appendicular bone, not microcephaly alone. This makes it one of the entries with the firmest skeletal evidence in the golgi_homeostasis cluster of this database.","sources":["Foulquier F, et al. Conserved oligomeric Golgi complex subunit 1 deficiency reveals a previously uncharacterized congenital disorder of glycosylation type II. Proc Natl Acad Sci USA 2006;103:3764-3769. PMID:16537452 (first report)","Zeevaert R, et al. 2009 (cerebrocostomandibular-like syndrome; splice-site variant c.1070+5G>A) PMID:19008299","Coman D, et al. The skeletal manifestations of the congenital disorders of glycosylation. Clin Genet 2008;73:507-515. PMID:18462449","Genomics England PanelApp: COG1 (Skeletal dysplasia, green)","OMIM 611209"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"COG8-CDG","zh":"COG8-CDG (CDG-IIh)","en":"","genes":["COG8"],"cluster":"golgi_homeostasis","inh":"AR","omim":["611182"],"hpo":["HP:0006466","HP:0006380","HP:0012385","HP:0034337","HP:0002673","HP:0010665","HP:0040019","HP:0002650","HP:0000470","HP:0000347","HP:0000252","HP:0000260","HP:0012345"],"pathway":"COG8, like COG1, belongs to the COG complex; Foulquier et al. 2007 showed that **the COG1-COG8 interaction is critical for formation of the COG complex** — which explains why either deficiency impairs N- and O-glycosylation together and why both give a CDG type II serum transferrin pattern.","notes":"[An important qualification: this entry is not a primary skeletal dysplasia] It is included under the database's quantitative criteria (16/68 = 24% of official annotations fall within the HP:0000924 subtree), but the nature of the evidence must be stated: the clinical axis of COG8-CDG is **neurological** — severe psychomotor delay, hypotonia, epilepsy, esotropia, failure to thrive and progressive microcephaly. GeneReviews does not describe a skeletal dysplasia in this disorder. Its 'skeletal' annotations are mainly **joint contractures (ankle, knee), camptodactyly, claw hand, coxa valga and clinodactyly** — postural changes secondary to severe neuromuscular disease — together with microcephaly, a wide anterior fontanelle and Dandy-Walker malformation. The last three are genuinely cranial/axial findings, but they are driven by abnormal brain development rather than by a defect of bone formation.\n[Why it is nevertheless retained] Reporting the case faithfully is preferable to adjusting the criteria after the fact. This entry is a **known false positive** of the quantitative inclusion rule: the HP:0000924 subtree contains joint contractures, and cranial terms can be driven by abnormal brain development, so any severe neurological disorder will accrue a substantial 'skeletal' fraction. Users who want genuine skeletal dysplasias should read the fraction together with defect_class, the mechanism cluster and this note, and not the percentage alone. The methodological discussion is in GLOBAL_NOTES.\n[Contrast with COG1] COG1 and COG8 are tightly coupled biochemically (they are each other's assembly partners), yet their skeletal phenotypes differ sharply: COG1 has true vertebral-costal malformation, COG8 does not. This suggests the skeletal consequences of the COG complex are not governed by the single variable of 'overall loss of complex function'.","sources":["Foulquier F, et al. A new inborn error of glycosylation due to a Cog8 deficiency reveals a critical role for the Cog1-Cog8 interaction in COG complex formation. Hum Mol Genet 2007;16:717-730. PMID:17220172","Kranz C, et al. COG8 deficiency causes new congenital disorder of glycosylation type IIh. Hum Mol Genet 2007;16:731-741. PMID:17331980","GeneReviews NBK1332 (the clinical description of COG8-CDG is predominantly neurological)","OMIM 611182"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"UXS1-SLSS","zh":"UXS1-related short-limbed short stature (provisional)","en":"","genes":["UXS1"],"cluster":"linkeropathy","inh":"AD (monoallelic; de novo in the proband's father)","omim":[],"hpo":["HP:0003026","HP:0004322","HP:0008905","HP:0003027","HP:0000944","HP:0001382"],"pathway":"UXS1 encodes UDP-glucuronate decarboxylase 1 (UDP-xylose synthase), a Golgi enzyme that decarboxylates UDP-glucuronic acid (UDP-GlcA) to UDP-xylose (UDP-Xyl). UDP-Xyl is precisely the xylose donor that XYLT1/XYLT2 transfer onto the core-protein serine — the **first brick** of the linker tetrasaccharide. UXS1 therefore sits on the supply chain exactly between UGDH (which makes UDP-GlcA) and XYLT1/XYLT2, and is the link that was missing between this database's nucleotide_sugar and linkeropathy clusters.","notes":"[Why this entry matters — it connects TGDS to the linkeropathies] Nature 2025 showed that TGDS generates the 'enzyme-rescue metabolite' UDP-4-keto-6-deoxyglucose, which regenerates NAD+ inside the catalytic pocket of UXS1 within the NAD+-poor Golgi lumen and so sustains UXS1 activity; TGDS deficiency therefore inactivates UXS1 and causes Catel-Manzke syndrome. This database had repeatedly used 'the phenotypic Jaccard index between TGDS and XYLT1 is only 0.16, so a purely phenotypic graph cannot see this link' as an illustration of methodological limitation — the UXS1 entry now makes the intermediate node of that biochemical chain explicit.\n[Why the evidence level is provisional, and one conflict between sources] (1) Only one family with two affected individuals (an 8.5-year-old Norwegian boy and his father, in whom the variant arose de novo), and the variant is **monoallelic**, unlike the other linkeropathies, which are mostly recessive. (2) **OMIM explicitly lists the variant (609749.0001) as of uncertain significance (VUS)**, on the grounds that 'its contribution to the short-stature phenotype has not been confirmed'; HPO likewise records no OMIM disease association for UXS1. (3) **The two papers reach opposite conclusions about the molecular mechanism**: Rustad et al. 2024 report that purified Ile186Asn mutant protein is **completely unable** to convert UDP-GlcA to UDP-Xyl, whereas Li et al. 2025 (FEBS Lett, doi:10.1002/1873-3468.70277) report that the same variant (numbered Ile181Asn under an alternative convention) has **catalytic properties comparable to wild type**, the real defect being a collapse of thermal stability — the melting temperature falls from 48.2 degrees C to 35.2 degrees C, leaving roughly a tenth of wild-type stability at 37 degrees C with a tendency to precipitate. In other words 'inactivation' holds, but through destabilisation rather than loss of catalysis. Both accounts are recorded here side by side without adjudication.\n[Phenotype] Father and son both have short-limbed short stature: short long bones, rhizo-mesomelic shortening, and long-bone measurements more than 2 SD below the mean at every age examined; epiphyses are normal and the metaphyses show mild change, predominantly in the lower limbs. Additional features are interphalangeal joint hyperextensibility, a webbed neck, sloping shoulders and a sandal gap. **Biochemical support**: plasma glycosaminoglycan levels were reduced in both, and glucuronic acid averaged 80% higher than in unaffected sibs — consistent with the predicted accumulation of UDP-GlcA and shortage of UDP-Xyl, and the strongest in vivo evidence for this entry.\n[Contrast with UGDH] UGDH lies immediately upstream of UXS1, yet its human disease is early-onset epileptic encephalopathy (6% skeletal). Two adjacent enzymes on one supply chain, one presenting as bone disease and the other as brain disease, indicate that tissue specificity is not determined by position in the pathway.","sources":["Rustad CF, Backe PH, Jin C, et al. A monoallelic UXS1 variant associated with short-limbed short stature. Mol Genet Genomic Med 2024;12(6):e2472. doi:10.1002/mgg3.2472; PMID:38860481; PMC11165340 [gene discovery]","Li et al. Structural instability impairs function of the UDP-xylose synthase 1 Ile181Asn variant associated with short-stature genetic syndrome in humans. FEBS Lett 2025. doi:10.1002/1873-3468.70277 [opposite mechanistic conclusion]","OMIM *609749 (gene entry; variant .0001 listed as a VUS, no phenotype MIM number)","Jacobs J, et al. Nature 2025;646:218-226 (TGDS sustains UXS1 activity through an enzyme-rescue metabolite)","Eames BF, et al. UDP xylose synthase 1 is required for morphogenesis and histogenesis of the craniofacial skeleton. Dev Biol 2010;341:400-415 (zebrafish)"],"ev":"provisional","pw":[],"dc":"glycan_machinery"},{"key":"XYLT1-DBQD2","zh":"Desbuquois dysplasia type 2 (DBQD2)","en":"","genes":["XYLT1"],"cluster":"linkeropathy","inh":"AR","omim":["615777"],"hpo":["HP:0002652","HP:0004322","HP:0001510","HP:0001382","HP:0001373","HP:0005616","HP:0002751","HP:0001263","HP:0001999","HP:0000175"],"pathway":"Xylosyltransferase I transfers xylose from UDP-Xyl onto serine residues of proteoglycan core proteins, the first step of the linker tetrasaccharide GlcA-Gal-Gal-Xyl-O-; loss of function reduces total GAG synthesis and decorin glycosylation.","notes":"","sources":["Am J Hum Genet 2014;94:405-414","Genes (MDPI) 2019;10:631","Front Genet 2021;12:642097"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"FAM20B-SKD","zh":"FAM20B-related skeletal dysplasia (neonatal short limb dysplasia resembling Desbuquois dysplasia)","en":"","genes":["FAM20B"],"cluster":"linkeropathy","inh":"AR","omim":[],"hpo":["HP:0002983","HP:0003026","HP:0006487","HP:0012095","HP:0001373","HP:0034392","HP:0001762","HP:0010557","HP:0009601","HP:0001511","HP:0010880","HP:0001561","HP:0000347","HP:0011800","HP:0001999","HP:0003811","HP:0003826"],"pathway":"FAM20B encodes glycosaminoglycan xylosylkinase, which phosphorylates the 2-hydroxyl of the xylose within the linker tetrasaccharide in the Golgi. This phosphorylation is not decorative: xylose 2-O-phosphorylation modulates the catalytic activity of B3GAT3 (GlcAT-I) and so determines whether the linker tetrasaccharide can be completed and how many mature GAG chains are ultimately made. FAM20B deficiency therefore weakens the elongation and sulfation of both chondroitin sulfate and heparan sulfate chains.","notes":"[Why the omim field is empty here — an important methodological lesson] OMIM 611063 is the **gene** entry for FAM20B (an asterisk entry), not a phenotype entry; at the time of searching OMIM had not assigned a phenotype MIM number to FAM20B-related skeletal dysplasia, so FAM20B has no OMIM disease association in HPO's genes_to_phenotype. Version 3.2 of this database used that fact to place FAM20B on the list of genes 'confirmed to have no Mendelian disease' — **that inference was wrong**. The absence of an OMIM phenotype entry means only that OMIM has not yet created one; it does not mean no established Mendelian disease exists. This was corrected in v3.3 and the lesson written into GLOBAL_NOTES.\n[Evidence base] At least three independent reports, together six biallelic cases from three families: (1) Kuroda et al. 2019 reported a girl who died two hours after birth with a phenotype resembling Desbuquois dysplasia but negative for all known DBQD genes; exome sequencing found compound heterozygous FAM20B frameshift variants (c.174_178delTACCT / c.1038delG). Her brother had a similar phenotype and died at 66 days. (2) A 12-year-old girl with a milder phenotype. (3) Arduc et al. 2026 reported three fetuses from two pregnancies of the same couple (twin sibs plus a younger sib), compound heterozygous for a paternal ~8 kb deletion involving the last exon and a maternal missense variant p.Arg290Cys — the very residue affected in the earlier mild case. The first two died in utero and the third in the neonatal period.\n[Phenotype] Prenatal: increased nuchal translucency (about 5 mm), severe micromelia, short bowed long bones, joint dislocation/subluxation, intrauterine growth restriction, polyhydramnios, overlapping fingers, talipes equinovarus and abnormal bone modelling; craniofacial anomalies include micrognathia and midface hypoplasia. Postnatal: limb shortening with joint contractures, and absent or malformed thumbs. The spectrum is wide, from perinatal lethality to a mild form surviving to age 12.\n[Position within the linkeropathy spectrum] XYLT1/XYLT2 install the xylose, B4GALT7/B3GALT6 add the galactoses and B3GAT3 caps the chain with GlcA; FAM20B is instead **the switch that sets the throughput of this assembly line**, not one of its stations. Its lethality indicates that this regulatory layer matters as much as the structural one.\n[The partner gene PXYLP1 still has no disease] PXYLP1, the 2-phosphoxylose phosphatase that removes the phosphate, still has no OMIM association in HPO; but given the FAM20B lesson, the statement made here is only that 'OMIM has no phenotype entry', and no claim is drawn from it about the absence of a Mendelian disease.\n[Position in the phenotype graph] The phenotypic Jaccard index between this entry and CANT1-DBQD1 is 0.21, its closest match — matching the literature description 'resembling Desbuquois dysplasia' and so serving as an independent validation. But 0.21 lies below the default graph threshold of 0.25, so FAM20B-SKD appears as an isolated node. This is one more instance of the same recurring limitation: a real biological relationship can fall below the threshold.","sources":["Arduc A, Zuurbier LC, van Maarle MC, et al. FAM20B related skeletal dysplasia: expanding the prenatal phenotype. Clin Genet 2026;109(5):946-950. doi:10.1111/cge.70115; PMID:41277483; PMC13066759","Kuroda Y, Murakami H, Enomoto Y, et al. A novel gene (FAM20B encoding glycosaminoglycan xylosylkinase) for neonatal short limb dysplasia resembling Desbuquois dysplasia. Clin Genet 2019;95:713-717. PMID:30847897 (first report)","OMIM *611063 (FAM20B gene entry; no phenotype MIM number)","Ma P, et al. Inactivation of Fam20B in joint cartilage leads to chondrosarcoma and postnatal ossification defects (conditional knockout mouse: GAG deficiency with gain of function in Wnt and BMP signalling)","Vogel P, et al. 2012 (Fam20b-/- mice are embryonic lethal, with the skeletal system most severely affected)"],"ev":"established","pw":[{"name":"WNT","evidence":"functional","note":"In mice with conditional knockout of Fam20b in articular cartilage, epiphyseal chondrocytes show **gain of function** across several pathways including Wnt, and develop chondrosarcoma with postnatal ossification defects. The evidence comes from a conditional mouse knockout and has not been verified in human patient material."},{"name":"BMP","evidence":"functional","note":"BMP signalling likewise shows gain of function in the same mouse model. Mechanistically this is mutually corroborative with HS defects of the EXT1/EXT2 kind: fewer GAG chains release the constraint on morphogen diffusion and presentation. Also model-organism evidence."}],"dc":"glycan_machinery"},{"key":"XYLT2-SOS","zh":"Spondylo-ocular syndrome (SOS)","en":"","genes":["XYLT2"],"cluster":"linkeropathy","inh":"AR","omim":["605822"],"hpo":["HP:0002652","HP:0004322","HP:0002757","HP:0004349","HP:0002751","HP:0000518","HP:0000365","HP:0001627","HP:0001263"],"pathway":"Xylosyltransferase II, which shares with XYLT1 the transfer of the first linker xylose.","notes":"Generalised osteoporosis and multiple fractures are commoner in SOS and in B3GALT6-spEDS; hearing loss is relatively specific to XYLT2 among the linkeropathies.","sources":["Genes (MDPI) 2019;10:631","Orphanet J Rare Dis 2019;14"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"B4GALT7-spEDS","zh":"spondylodysplastic EDS, B4GALT7 type; B4GALT7-CDG","en":"","genes":["B4GALT7"],"cluster":"linkeropathy","inh":"AR","omim":["130070"],"hpo":["HP:0012345","HP:0002652","HP:0004322","HP:0001382","HP:0000974","HP:0007957","HP:0000518","HP:0001999","HP:0005716","HP:0001263"],"pathway":"Galactosyltransferase I (GalT-I): the second sugar of the linker tetrasaccharide (the first Gal).","notes":"The phenotypic spectrum now extends to perinatally lethal skeletal dysplasia. Ocular involvement (corneal clouding, cataract, iris coloboma) is prominent.","sources":["Eur J Hum Genet 2019 (PMC6777465)","Clin Utility Gene Card PMC5255951","Genes (MDPI) 2019;10:631"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"B3GALT6-spEDS","zh":"spondylodysplastic EDS, B3GALT6 type; SEMD-JL1","en":"","genes":["B3GALT6"],"cluster":"linkeropathy","inh":"AR","omim":["615349","271640"],"hpo":["HP:0012345","HP:0002652","HP:0004322","HP:0001382","HP:0034392","HP:0002757","HP:0004349","HP:0002751","HP:0000974","HP:0001627","HP:0001999"],"pathway":"Galactosyltransferase II (GalT-II): the third sugar of the linker tetrasaccharide (the second Gal). Patient fibroblasts show a marked reduction in HS and in the HS-proteoglycan perlecan, while the CS-PG versican and DS-PG decorin are normal, indicating that HS biosynthesis is the principal target.","notes":"","sources":["Am J Hum Genet 2013;92:927-934","Genes (MDPI) 2019;10:631","Front Genet 2021;12:717535"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"B3GAT3-linkeropathy","zh":"B3GAT3-linkeropathy; Larsen-like syndrome (JDSCD)","en":"","genes":["B3GAT3"],"cluster":"linkeropathy","inh":"AR","omim":["245600"],"hpo":["HP:0012345","HP:0002652","HP:0004322","HP:0001373","HP:0034392","HP:0002757","HP:0004349","HP:0001627","HP:0000592","HP:0001547","HP:0001762","HP:0002974","HP:0001999","HP:0001263"],"pathway":"Glucuronosyltransferase I (GlcAT-I): the fourth sugar of the linker tetrasaccharide (GlcA).","notes":"Twenty-five cases from twelve families have been reported, with phenotypes that may resemble Larsen, Antley-Bixler, Shprintzen-Goldberg or geroderma osteodysplastica; radioulnar synostosis and atrial/ventricular septal defects are common.","sources":["Genes (MDPI) 2019;10:631","Am J Med Genet A 2015;167A:2691-2696","Orphanet J Rare Dis 2019;14","PMC4384644"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"EXT1-EXT2-HME","zh":"Hereditary Multiple Exostoses (HME) / Multiple osteochondromas","en":"","genes":["EXT1","EXT2"],"cluster":"GAG_chain","inh":"AD","omim":["133700","133701"],"hpo":["HP:0002762","HP:0001510","HP:0004322","HP:0000944"],"pathway":"EXT1 and EXT2 form a hetero-oligomeric Golgi complex that catalyses polymerisation of heparan sulfate (HS) chains. The sulfation pattern of HS determines its binding to many signalling proteins: the distribution and activity of BMP family members expressed in the growth plate are HS-regulated, and the Drosophila orthologue tout-velu implicates HS in the spread of Hedgehog. Exostoses are benign cartilage-capped bony outgrowths beside the growth plate, with a 2-5% risk of malignant transformation.","notes":"Mutations in EXT1 or EXT2 account for about 90% of HME (around 65% in EXT1); EXT1 mutations are generally associated with a more severe phenotype. A rare EXT3 locus on 19p has been reported by linkage, but the gene is unidentified.\n[A new functional dimension of HS chains (Nature 2026)] In a genome-wide CRISPR screen, EXT1, EXT2 and UXS1 were the top three hits for loss of cell-surface glycoRNA/RNA-binding-protein cluster (csRNP) assembly; knockout of any of the three abolished HS and csRNPs together, and wild-type EXT2 rescued the defect whereas a catalytically dead mutant did not. The EXT1/EXT2 product is thus not only a co-receptor scaffold for morphogens but also an anchoring scaffold for cell-surface RNA. This function has not been tested in HME patient material or skeletal tissue, so **no** pathway annotation has been added on its basis; it is recorded here to indicate that the downstream consequences of HS deficiency may be broader than the current BMP/Hedgehog inferences suggest.","sources":["JCI 2001 (jci.org/articles/view/13737)","PMC4007065","Chai P, et al. Nature 2026;651(8106):808-818. doi:10.1038/s41586-025-10052-8 (EXT1/EXT2/UXS1 required for csRNP assembly)"],"ev":"established","pw":[{"name":"BMP","evidence":"inferred","note":"The sulfation pattern of HS determines its binding to signalling proteins, and the distribution and activity of BMP family members expressed in the growth plate are HS-regulated. This is a mechanistic inference at the level of pathway biology, not a direct readout in HME patient samples."},{"name":"HEDGEHOG","evidence":"inferred","note":"The Drosophila EXT1 orthologue tout-velu implicates HS in the spread of Hedgehog; the evidence is from a model organism and has not been verified directly in human HME."}],"dc":"glycan_machinery"},{"key":"CSGALNACT1-CDG","zh":"CSGALNACT1-CDG","en":"","genes":["CSGALNACT1"],"cluster":"GAG_chain","inh":"AR","omim":["618870"],"hpo":["HP:0012345","HP:0002652","HP:0001382","HP:0005616","HP:0004322"],"pathway":"Chondroitin sulfate N-acetylgalactosaminyltransferase-1 (GalNAcT-I) transfers the first GalNAc onto the non-reducing-end GlcA of the linker, initiating synthesis of the chondroitin backbone.","notes":"","sources":["Hum Mutat 2017;38:34-38","Front Pediatr 2021;9:715151"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"GALNT3-HFTC","zh":"Hyperphosphatemic familial tumoral calcinosis (HFTC) / HHS","en":"","genes":["GALNT3"],"cluster":"O_GalNAc","inh":"AR","omim":["211900"],"hpo":["HP:0100774","HP:0000944","HP:0003330"],"pathway":"GALNT3 encodes ppGalNAc-T3, which places mucin-type O-glycans on FGF23. That O-glycosylation is a prerequisite for FGF23 stability and secretion; without it FGF23 is proteolysed, intact FGF23 falls, renal phosphate reabsorption rises, and the resulting hyperphosphataemia produces periarticular ectopic calcification and cortical hyperostosis of the long bones. Pathway: the FGF23-alphaKlotho-FGFR phosphate homeostasis axis.","notes":"One disease spectrum: tumoral calcinosis and hyperostosis-hyperphosphataemia syndrome are regarded as a continuum of the same disorder.\n[Change in v4.5: the genes field of this entry now holds GALNT3 alone] HFTC has three allelically heterogeneous genes — GALNT3, FGF23 and KL — which produce the same clinical phenotype, but **only GALNT3 is a glycosylation gene**: it encodes ppGalNAc-T3, which O-glycosylates FGF23. FGF23 encodes the **substrate** that is modified, and KL (alphaKlotho) the **co-receptor** for FGF23 signalling; neither defect lies on the glycosylation machinery, so neither meets inclusion criterion two. Listing all three in the genes field caused two non-glycosylation genes to be counted into the database on gene-based searches and inflated the count of 'glycan machinery defect' genes. They have been removed, but their differential-diagnostic value is preserved here:\n  - **GALNT3 deficiency** (this entry): loss of O-glycosylation leads to proteolysis of FGF23 and low intact FGF23;\n  - **FGF23 deficiency**: loss-of-function variants in the substrate itself, likewise giving insufficient intact FGF23 activity;\n  - **KL deficiency**: loss of the co-receptor, so that FGF23 is present but cannot signal (FGF23 levels are in fact raised).\nThe three differ in serum intact FGF23 and can be distinguished on that basis. This is the same class of phenomenon as the LFNG/JAG1 'glycan side versus ligand side' contrast elsewhere in this database: defects at different levels of one pathway converge on a single diagnosis.\nEctopic calcification carries no HPO ID in this database: HP:0010766 'Ectopic calcification' is the better fit and has been added to HPO_ZH for future use.","sources":["Nat Genet 2004;36:579-581 (Topaz et al.)","J Biol Chem 2006;281:18370-18377 (Kato et al.)","Am J Med Genet A 2010;152A:896-903","J Clin Endocrinol Metab 2009;94:4267-4274","Bone Res 2016;4:16038"],"ev":"established","pw":[{"name":"FGF23","evidence":"direct","note":"ppGalNAc-T3 directly places mucin-type O-glycans on FGF23; this modification is a prerequisite for FGF23 stability and secretion, and its loss leads to proteolysis of FGF23, disrupting the FGF23-alphaKlotho-FGFR phosphate homeostasis axis."}],"dc":"glycan_machinery"},{"key":"PIGV-HPMRS1","zh":"Hyperphosphatasia with mental retardation syndrome 1 (HPMRS1); PIGV-CDG","en":"","genes":["PIGV"],"cluster":"GPI_anchor","inh":"AR","omim":["239300"],"hpo":["HP:0003155","HP:0006118","HP:0001263","HP:0001250","HP:0001252","HP:0000175","HP:0001627","HP:0001999"],"pathway":"PIGV encodes GPI mannosyltransferase II, which adds the second mannose to the growing GPI anchor. In late GPI-synthesis defects the GPI transamidase can still recognise the incomplete anchor, so alkaline phosphatase (ALP, a GPI-anchored protein) is secreted into the blood instead of being anchored at the cell surface, producing hyperphosphatasia. Loss of surface ALP affects vitamin B6 metabolism and neural development.","notes":"Brachytelephalangy was present in 16/18 cases and distinguishes PIGV-related GPI biosynthesis defect from the other HPMRS disorders. Skeletal involvement in GPI defects is mainly acral (phalangeal) rather than a classical long-bone skeletal dysplasia.","sources":["Nat Genet 2010;42:827-829","Orphanet J Rare Dis 2020;15 (PMC7254680)","Eur J Hum Genet 2013;22:762-767","cdghub.com/cdg/pigv"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PIGO-HPMRS2","zh":"HPMRS2; PIGO-CDG","en":"","genes":["PIGO"],"cluster":"GPI_anchor","inh":"AR","omim":["614749"],"hpo":["HP:0003155","HP:0006118","HP:0002164","HP:0001263","HP:0001250","HP:0001252","HP:0001363","HP:0001999"],"pathway":"PIGO transfers ethanolamine phosphate (EtNP) onto the third mannose of the GPI anchor, acting together with PIGF. It is likewise a late GPI-synthesis defect and so is accompanied by hyperphosphatasia.","notes":"The spectrum ranges from infantile lethality to mild learning difficulty. Nail hypoplasia or aplasia and, in isolated cases, coronal craniosynostosis have been described.","sources":["Am J Hum Genet 2012;91:146-151","Hum Mutat 2017;38:805-815","International Osteoporosis Foundation, GPI pathway"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PGAP2-HPMRS3","zh":"HPMRS3; PGAP2-CDG","en":"","genes":["PGAP2"],"cluster":"GPI_anchor","inh":"AR","omim":["614207"],"hpo":["HP:0003155","HP:0001263","HP:0001250","HP:0000175","HP:0001627","HP:0001999"],"pathway":"PGAP2 catalyses fatty-acid remodelling of the lipid moiety of the GPI anchor in the Golgi (addition of stearic acid), a prerequisite for stable residence of GPI-anchored proteins in cell-surface lipid rafts; loss of function causes excessive extracellular shedding of GPI-APs and raised serum ALP.","notes":"","sources":["Am J Hum Genet 2013;92:584-589","Am J Hum Genet 2013;92:575-583","eLife 2019;8:e45248"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PGAP3-HPMRS4","zh":"HPMRS4; PGAP3-CDG","en":"","genes":["PGAP3"],"cluster":"GPI_anchor","inh":"AR","omim":["615716"],"hpo":["HP:0003155","HP:0001263","HP:0001252","HP:0001250","HP:0000175","HP:0001999"],"pathway":"PGAP3 participates in maturation of the GPI anchor (lipid remodelling); loss of function likewise reduces surface levels of GPI-APs and raises ALP.","notes":"Discrepancy: early reports held that the PGAP3 form lacks brachytelephalangy (in contrast to PIGO/PIGV), but later case reports have described brachytelephalangy, indicating that the feature can occur. A cohort review of 65 cases is available.","sources":["Am J Hum Genet 2014 (Howard et al.)","Hum Genome Var 2018 (PMC5842148)","Mol Genet Metab 2023;140:107688"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PIGW-PIGY-HPMRS56","zh":"HPMRS5 (PIGW) / HPMRS6 (PIGY)","en":"","genes":["PIGW","PIGY"],"cluster":"GPI_anchor","inh":"AR","omim":["616025","616809"],"hpo":["HP:0003155","HP:0001263","HP:0001250","HP:0001252","HP:0001999"],"pathway":"PIGW adds an acyl chain to inositol early in GPI biosynthesis; PIGY participates in the initiating step. Six genes in total (PIGV, PIGO, PGAP2, PGAP3, PIGW, PIGY) correspond to HPMRS1-6.","notes":"ALP is usually normal or only mildly raised in the PIGW and PIGY forms, unlike the very high ALP of PIGV/PGAP2. PIGW deficiency is also associated with West syndrome. The skeletal evidence is weaker than for PIGV/PIGO; the entry is included for completeness of the group.","sources":["Hum Mol Genet 2015;24:6146-6159","J Med Genet 2014 (PIGW; PMID 24367057)","Orphanet J Rare Dis 2020;15 (PMC7254680)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"GNPTAB-MLII","zh":"Mucolipidosis II alpha/beta (I-cell disease)","en":"","genes":["GNPTAB"],"cluster":"M6P_targeting","inh":"AR","omim":["252500"],"hpo":["HP:0000943","HP:0002652","HP:0004322","HP:0000938","HP:0003468","HP:0000926","HP:0002751","HP:0001363","HP:0034392","HP:0001762","HP:0001385","HP:0001547","HP:0000280","HP:0001263","HP:0001252","HP:0001627","HP:0000365","HP:0001510"],"pathway":"GNPTAB encodes the alpha/beta subunits of GlcNAc-1-phosphotransferase, which attaches the mannose-6-phosphate (M6P) targeting tag to lysosomal hydrolases in the cis-Golgi; loss of function causes the hydrolases to be missorted and secreted extracellularly, leaving the lysosome deficient in many enzymes. Storage material accumulating within chondrocytes disturbs postnatal endochondral and intramembranous ossification, producing dysostosis multiplex; spinal involvement can cause developmental cervical canal stenosis and atlantoaxial instability.","notes":"The radiological phenotype of ML II is fully established before the age of two and reads as 'severe dysostosis multiplex'. Unlike the MPS disorders, ML II shows no mucopolysacchariduria. Haematopoietic stem cell transplantation is ineffective in ML II (in contrast to MPS I).","sources":["GeneReviews NBK1828 (GNPTAB-Related Disorders)","MedLink Neurology, Mucolipidosis II/III","Int J Mol Sci 2020;21:6812","Int J Mol Sci 2025;26:2408"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"GNPTAB-GNPTG-MLIII","zh":"Mucolipidosis III alpha/beta (GNPTAB) and III gamma (GNPTG)","en":"","genes":["GNPTAB","GNPTG"],"cluster":"M6P_targeting","inh":"AR","omim":["252600","252605"],"hpo":["HP:0000943","HP:0004322","HP:0000938","HP:0000926","HP:0002751","HP:0005930","HP:0000944","HP:0000280","HP:0001263","HP:0001433"],"pathway":"As in ML II, but with partial rather than complete retention of GlcNAc-1-phosphotransferase activity, giving a milder phenotype; GNPTG encodes the gamma subunit (the enzyme has an alpha2-beta2-gamma2 structure).","notes":"ML III alpha/beta is caused by GNPTAB mutations and ML III gamma by GNPTG. Mild dysostosis multiplex appears between ages 5 and 10, with the ball-and-socket joints most severely affected; kyphoscoliosis can be severe enough to require orthopaedic intervention. Impaired bone remodelling is seen in the GNPTAB form but not the GNPTG form. The disorder is often misdiagnosed as MPS I or juvenile idiopathic arthritis.","sources":["GeneReviews NBK1828","MedLink Neurology","Rudolph's Pediatrics 24th ed., Ch. Mucolipidosis"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-I-IDUA","zh":"Mucopolysaccharidosis type I (MPS I)","en":"","genes":["IDUA"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["607014","607015","607016"],"hpo":["HP:0000943","HP:0004322","HP:0000280","HP:0034392","HP:0007957","HP:0001433","HP:0002751","HP:0001263","HP:0001627","HP:0000365"],"pathway":"Deficiency of alpha-L-iduronidase blocks degradation of dermatan sulfate (DS) and heparan sulfate (HS), which then accumulate; GAG infiltration of soft tissue and facial bone produces coarse facies and skeletal hypoplasia.","notes":"Hurler is the most severe form, Scheie the mildest and Hurler-Scheie intermediate; all three arise from IDUA deficiency. Dermatan sulfate and heparan sulfate are detectable in the urine.","sources":["Rudolph's Pediatrics 24th ed.","ScienceDirect Topics, Beta-Mannosidosis entry"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-II-IDS","zh":"Mucopolysaccharidosis type II (Hunter syndrome)","en":"","genes":["IDS"],"cluster":"lysosomal_GAG_degradation","inh":"XL (X-linked recessive)","omim":["309900"],"hpo":["HP:0000943","HP:0004322","HP:0000280","HP:0034392","HP:0001433","HP:0001263","HP:0000365","HP:0001627"],"pathway":"Deficiency of iduronate-2-sulfatase (IDS) blocks degradation of HS and DS.","notes":"The only X-linked MPS subtype (all other MPS entries in this database are autosomal recessive).","sources":["Front Genet 2024;15:1343094","Int J Mol Sci 2025;26:2408 (enzyme profile)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-III-Sanfilippo","zh":"Mucopolysaccharidosis type III (Sanfilippo syndrome) A-D","en":"","genes":["SGSH","NAGLU","HGSNAT","GNS"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["252900","252920","252930","252940"],"hpo":["HP:0001263","HP:0001249","HP:0001250","HP:0004322"],"pathway":"Four enzymes — sulfamidase (SGSH), alpha-N-acetylglucosaminidase (NAGLU), the acetyltransferase HGSNAT and N-acetylglucosamine-6-sulfatase (GNS) — act at successive steps in the degradation of heparan sulfate (HS). HS is critical for central nervous system development, so this subtype is dominated by neurodegeneration.","notes":"An important contrast: the somatic and skeletal features of MPS III are 'relatively mild' — the cornea is clear and vertebral change is minimal or absent — in sharp distinction to the other MPS disorders. It is included here to keep the GAG degradation pathway complete, not because it is a typical skeletal dysplasia.","sources":["OMIM 252900","Front Genet 2024;15:1343094","MedlinePlus Genetics, MPS III"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-IVA-GALNS","zh":"Mucopolysaccharidosis type IVA (Morquio A)","en":"","genes":["GALNS"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["253000"],"hpo":["HP:0002652","HP:0000943","HP:0004322","HP:0000926","HP:0003468","HP:0003467","HP:0001382","HP:0001547","HP:0007957","HP:0000280"],"pathway":"Deficiency of galactosamine-6-sulfate sulfatase (GALNS) blocks degradation of keratan sulfate (KS) and chondroitin sulfate. KS is a principal constituent of the cartilage matrix, which makes this the MPS subtype with the most prominent skeletal phenotype (short-trunk short stature).","notes":"Clinically characterised by a short trunk, short stature and an inverted upper-to-lower segment ratio; atlantoaxial instability with odontoid hypoplasia is the critical complication. Intelligence is usually spared (unlike MPS I/II/III).","sources":["OMIM 253000","Front Genet 2024;15:1343094","Front Genet 2023;14:1254909"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-IVB-GLB1","zh":"Mucopolysaccharidosis type IVB (Morquio B)","en":"","genes":["GLB1"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["253010"],"hpo":["HP:0002652","HP:0000943","HP:0004322","HP:0000926","HP:0007957"],"pathway":"Deficiency of beta-galactosidase (GLB1) impairs keratan sulfate degradation. GLB1 is an allelically heterogeneous gene: variants that chiefly impair the enzyme's ability to degrade keratan sulfate present as Morquio B, while those that chiefly impair GM1 ganglioside degradation present as GM1 gangliosidosis.","notes":"","sources":["OMIM 253010","Front Genet 2024;15:1343094","GeneReviews NBK164500"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-VI-ARSB","zh":"Mucopolysaccharidosis type VI (Maroteaux-Lamy)","en":"","genes":["ARSB"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["253200"],"hpo":["HP:0000943","HP:0004322","HP:0034392","HP:0007957","HP:0001433","HP:0001627","HP:0001999"],"pathway":"Deficiency of arylsulfatase B (ARSB) causes lysosomal storage of dermatan sulfate (DS).","notes":"Intelligence is usually preserved. The incidence is about 1 in 250,000 to 1 in 600,000.","sources":["ScienceDirect Topics (MPS VI entry)","Front Genet 2024;15:1343094"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MPS-VII-GUSB","zh":"Mucopolysaccharidosis type VII (Sly syndrome)","en":"","genes":["GUSB"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["253220"],"hpo":["HP:0000943","HP:0004322","HP:0000280","HP:0001433","HP:0001263"],"pathway":"Deficiency of beta-glucuronidase (GUSB) prevents degradation of glucuronic acid-containing GAGs.","notes":"","sources":["ScienceDirect Topics (MPS VII entry)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MAN2B1-alpha-mannosidosis","zh":"Alpha-mannosidosis","en":"","genes":["MAN2B1"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["248500"],"hpo":["HP:0000943","HP:0000280","HP:0001249","HP:0000365","HP:0001433","HP:0004322"],"pathway":"Deficiency of lysosomal acidic alpha-mannosidase (MAN2B1) causes failure of glycoprotein catabolism, with storage of various mannose oligosaccharides in lysosomes throughout the tissues; mannose-rich oligosaccharides are detectable in the urine.","notes":"A modest genotype-phenotype correlation exists: patients with missense variants whose enzyme still localises to the lysosome have better neurocognitive function than those with ER-retained protein or nonsense variants, although the groups overlap considerably.","sources":["MedLink Neurology, Mannosidosis","Orphanet J Rare Dis 2015;10:70","PMC7348849 (glycoprotein diseases HCT review)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"FUCA1-fucosidosis","zh":"Fucosidosis","en":"","genes":["FUCA1"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["230000"],"hpo":["HP:0000943","HP:0000280","HP:0001249","HP:0002751","HP:0034392","HP:0001433","HP:0001250","HP:0000365","HP:0001385"],"pathway":"Deficiency of alpha-L-fucosidase (FUCA1) causes storage of fucose-containing glycolipids, glycoproteins and fucose-rich oligosaccharides in many tissues; fucose is a constituent sugar of cell-surface N-glycans.","notes":"Fewer than 100 cases have been reported. Phenotypic variability is extreme, even within a family; some patients present predominantly with angiokeratoma and 'no appreciable skeletal abnormality' (resembling Fabry disease), and phenotype generally correlates poorly with genotype or residual enzyme activity.","sources":["MedLink Neurology, Fucosidosis","PMC7348849","MalaCards Fucosidosis"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"NEU1-sialidosis","zh":"Sialidosis (Mucolipidosis I)","en":"","genes":["NEU1"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["256550"],"hpo":["HP:0000943","HP:0000280","HP:0004322","HP:0001433","HP:0001249","HP:0001250","HP:0000365"],"pathway":"Deficiency of lysosomal neuraminidase (NEU1) causes storage of sialylated glycoconjugates. NEU1 forms a high-molecular-weight multienzyme complex with beta-galactosidase (GLB1) and cathepsin A (CTSA).","notes":"Type I is milder and non-neuronopathic, beginning in the twenties with myoclonus, ataxia and ocular defects; type II is severe and early-onset, and may include hydrops fetalis, a cherry-red spot, dysostosis multiplex, short stature and severe intellectual disability.","sources":["PMC7348849","Rudolph's Pediatrics 24th ed.","GeneReviews NBK164500"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"CTSA-galactosialidosis","zh":"Galactosialidosis","en":"","genes":["CTSA"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["256540"],"hpo":["HP:0002652","HP:0000280","HP:0007957","HP:0001433","HP:0001249","HP:0001250"],"pathway":"A primary defect of protective protein / cathepsin A (CTSA) causes a secondary combined deficiency of beta-galactosidase (reduced to about 15%) and neuraminidase (reduced to under 1%), because the three proteins must form a stable multienzyme complex.","notes":"Diagnostic point: in a patient with partial beta-galactosidase deficiency, both CTSA and NEU1 activities must be assayed in fibroblasts before galactosialidosis can be confidently excluded. More than 100 cases have been reported.","sources":["GeneReviews NBK164500 (GLB1-Related Disorders)","ScienceDirect Topics (Galactosialidosis entry)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"CANT1-DBQD1","zh":"Desbuquois dysplasia type 1 (DBQD1, incl. Kim variant); Multiple epiphyseal dysplasia 7 (EDM7)","en":"","genes":["CANT1"],"cluster":"GAG_chain","inh":"AR","omim":["251450","617719"],"hpo":["HP:0002652","HP:0003510","HP:0001511","HP:0001510","HP:0002983","HP:0003026","HP:0001382","HP:0001373","HP:0002827","HP:0002751","HP:0005616","HP:0000944","HP:0005930","HP:0003417","HP:0011800","HP:0000520","HP:0001999"],"pathway":"CANT1 encodes calcium-activated nucleotidase 1 of the ER and Golgi, which hydrolyses UDP preferentially (UDP > GDP > UTP > GTP) to UMP and phosphate. **UDP is precisely the by-product of glycosyltransferase reactions**, and clearing it relieves product inhibition of those enzymes, making CANT1 an obligatory accessory factor for GAG chain synthesis and elongation. In chondrocytes of Cant1 knockout mice GAG synthesis is reduced, GAG chains have a smaller hydrodynamic volume, sulfation is paradoxically increased and proteoglycan secretion is delayed; the GAG chains carried by decorin and aggrecan are markedly shortened, chondrocyte proliferation and maturation in the growth plate are dysregulated, and skeletal growth is reduced. Patient fibroblasts show markedly reduced GAG synthesis in the presence of beta-D-xyloside.","notes":"This and XYLT1-DBQD2 are two subtypes of one disease spectrum, separated by the presence or absence of the characteristic hand anomaly: type 1 (CANT1) has an extra ossification centre distal to the second metacarpal, a delta phalanx, a bifid distal phalanx of the thumb and interphalangeal dislocation; type 2 (XYLT1) lacks these hand findings. A 'Kim variant' also exists, with nearly normal hands but short metacarpals, slender phalanges and advanced carpal bone age. The shared radiological hallmark is a 'Swedish key' appearance of the proximal femur (an excessively prominent greater trochanter), present in nearly all patients. CANT1 can also cause the milder multiple epiphyseal dysplasia type 7 (EDM7, 617719), likewise autosomal recessive. The disorder is readily misdiagnosed as diastrophic dysplasia. Note that CANT1 is not itself a glycosyltransferase but supports glycosylation indirectly by clearing a reaction by-product, placing it mechanistically between 'nucleotide-sugar metabolism' and 'GAG chain elongation'.","sources":["OMIM 251450 / 613165","Am J Hum Genet 2009 (Huber et al., gene discovery)","Matrix Biol 2019 (PMC6598859, Cant1 KO mouse GAG and endochondral ossification)","Biomolecules 2024;14:1064 (PMC11430760, aggrecan/decorin characterisation)","FEBS Open Bio 2020 (PMID 32277574, CRISPR Cant1 KO)","Hum Mutat 2012 (Nizon et al., proteoglycan synthesis)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"TGDS-CatelManzke","zh":"Catel-Manzke syndrome (CATMANS); Manzke dysostosis","en":"","genes":["TGDS"],"cluster":"nucleotide_sugar","inh":"AR","omim":["616145"],"hpo":["HP:0000201","HP:0000347","HP:0000175","HP:0030368","HP:0009464","HP:0004209","HP:0012385","HP:0001762","HP:0004322","HP:0001627","HP:0001999","HP:0000520"],"pathway":"[Mechanism solved in 2025] The function of TGDS in mammals was established by Nature in 2025: using UDP-glucose as substrate, TGDS produces **UDP-4-keto-6-deoxyglucose**, an 'enzyme-rescue metabolite'.\nIts target is UDP-xylose synthase **UXS1**. UXS1 uses tightly bound NAD+ to oxidise the C4 hydroxyl of UDP-glucuronic acid, generating NADH and a UDP-4-keto-xylose intermediate; normally, formation of UDP-xylose regenerates NAD+ for the next catalytic cycle. Occasionally, however, the intermediate dissociates from the catalytic pocket, leaving UXS1 stalled in an inactive NADH-bound state. Because H6PD activity keeps the NAD+/NADH ratio very low in the ER (and probably the Golgi), reactivation by simply rebinding NAD+ is not an available route. At this point the UDP-4-keto-6-deoxyglucose made by TGDS enters the UXS1 catalytic pocket as a **mimic** of the reaction intermediate and, using UXS1's own native catalytic mechanism, completes one cycle that reoxidises the enzyme-bound NADH to NAD+ and so revives UXS1.\n**Downstream consequence**: TGDS deficiency leaves too little UDP-4-keto-6-deoxyglucose, inactivating UXS1, lowering UDP-xylose and impairing synthesis of the specific glycans required for skeletal development. Note that UDP-xylose is exactly the donor that XYLT1/XYLT2 use to transfer xylose onto proteoglycan core proteins (step 1 of the GAG linker tetrasaccharide), which biochemically connects TGDS directly to the linkeropathy cluster of this database.","notes":"[A previously recorded source conflict, now resolved by the primary literature] Earlier versions of this database set out two contradictory accounts side by side: a Frontiers 2026 review stated that TGDS deficiency affects glycan synthesis through UXS1, while the gene-discovery paper (AJHG 2014) stated that 'UXS1 does not possess any dehydratase activity, which emphasises that UXS1 and TGDS are likely involved in different enzymatic processes'. Nature 2025 (Jacobs & Lyubenova et al.) shows that **both were right**: AJHG was correct that the two do not share dehydratase activity, and the review's direction was also correct in that TGDS does act through UXS1 — but by a route nobody had anticipated, not an enzymatic relay but metabolite-mediated **enzyme rescue**. The paper thereby converted TGDS from an enzyme of unknown function into a mechanistically defined entry, and the pathway field above has been rewritten accordingly.\n[Conceptual novelty] An accompanying commentary notes that the concept of a rescue metabolite is not itself new to biochemistry; what makes this study distinctive is the first identification of a case in which **a defect in the rescue pathway itself causes disease**.\n[Mouse] Mice completely lacking the TGDS gene are not viable.\n[Key phenotype] The core is the Pierre-Robin sequence (micrognathia, glossoptosis, often with cleft palate) plus bilateral hyperphalangism of the index finger: an extra bone is interposed between the second metacarpal and its proximal phalanx, causing radial deviation of the index finger at the metacarpophalangeal joint and ulnar bowing of the phalanges (Manzke dysostosis).\n[The spectrum has widened] In 2020, pathogenic TGDS variants were reported to produce Catel-Manzke syndrome **without radiological evidence of hyperphalangism**, together with disproportionate short stature — a feature not previously linked to the disorder — suggesting that the 'typical/atypical' clinical division may have to give way to a molecular classification.\n[Differential diagnosis] There is clinical overlap with DBQD1 (CANT1), Temtamy preaxial brachydactyly syndrome (CHSY1) and chondrodysplasia with joint dislocations, GPAPP type (IMPAD1); IMPAD1 variants have also been found in two 'Catel-Manzke-like' patients. Haplotype reconstruction indicates that c.298G>T (p.Ala100Ser) is probably a founder variant.\n[Phenotypic overlap of KYNU and TGDS — the two share NAD+ as a final common pathway] Ehmke et al. 2020 (Bone 133:115219) reported three unrelated patients with a **clinical diagnosis of Catel-Manzke syndrome** who carried biallelic KYNU variants with xanthurenic aciduria; a further case had a homozygous deletion of KYNU exon 5 through maternal uniparental isodisomy of chromosome 2 and presented as Catel-Manzke/VCRL.\n**Correction in v4.0 of this database**: earlier versions stated that 'the mechanisms of KYNU and TGDS are entirely unrelated'. That was wrong. The two are connected through **NAD+**, and the junction is very specific:\n  - KYNU is an enzyme of de novo NAD+ synthesis (the kynurenine pathway), and its deficiency causes **systemic NAD+ shortage**;\n  - **UXS1 uses tightly bound NAD+ as cofactor** and must regenerate it within the active-site pocket on every catalytic cycle;\n  - **UGDH consumes two molecules of NAD+ for each molecule of UDP-GlcA produced**;\n  - **the entire known function of TGDS is to produce UDP-4-keto-6-deoxyglucose and thereby regenerate NAD+ for UXS1 within the NAD+-poor Golgi lumen** (Nature 2025).\nTGDS deficiency (local failure of NAD+ regeneration) and KYNU deficiency (systemic shortage of NAD+ supply) therefore **weaken the same enzyme, UXS1, by different routes**, limiting UDP-xylose and blocking initiation of the linker tetrasaccharide. A single clinical diagnosis thus acquires a unified biochemical explanation rather than a coincidence.\n[Evidence grading] NAD+ regeneration by TGDS for UXS1 is direct evidence (Nature 2025); the NAD+ dependence of UGDH and UXS1 is established enzymology; but the step 'KYNU deficiency causes a skeletal phenotype by limiting UXS1 through NAD+' has **not been demonstrated experimentally** and remains a mechanistic inference. No entry is therefore created for KYNU, although the convergence is presented in full in GLOBAL_NOTES and in Figure 4.\n[Clinical note] A patient with a Catel-Manzke phenotype who is TGDS-negative should have urine organic acids measured (xanthurenic aciduria) and the NAD pathway genes HAAO/KYNU/NADSYN1 screened — the original authors explicitly recommend this workflow, and recurrence in that branch can be prevented by niacin supplementation during pregnancy.","sources":["Jacobs J, Lyubenova H, et al. A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia. Nature 2025;646:218-226. doi:10.1038/s41586-025-09397-x  PMID:40836090  PMC12488480  [primary mechanistic paper]","Nature 2025;d41586-025-02428-7 (News & Views: Rare skeletal condition caused by enzyme's failure to rescue a catalytic cycle)","OMIM 616145 / 616146","Am J Hum Genet 2014;95:763-770 (Ehmke et al., gene discovery; PMC4259972)","Am J Med Genet A 2020 (Boschann et al., phenotype without hyperphalangism)","Mol Genet Metab Rep 2015 (PMC4563870, phenotypic extension)","Genomics England PanelApp, TGDS","Front Genet 2026;17:1883963 (early UXS1 hypothesis; revised and confirmed by Nature 2025)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"LFNG-SCDO3","zh":"Spondylocostal dysostosis 3, autosomal recessive (SCDO3)","en":"","genes":["LFNG"],"cluster":"Notch_O_glycosylation","inh":"AR","omim":["609813"],"hpo":["HP:0002652","HP:0003468","HP:0002751","HP:0002650","HP:0000773","HP:0001547","HP:0004322","HP:0009464"],"pathway":"LFNG is a glycosylation-level regulator of the Notch pathway. Somitogenesis depends on the segmentation clock, whose oscillation is governed largely by differential ligand binding to NOTCH1. LFNG elongates the O-fucose on the NOTCH1 EGF repeats and strengthens NOTCH1-DLL1 heterodimerisation, producing a **pulsatile rhythm** of NICD endocytosis; that pulsatility is essential for gene expression in the anterior somite, whereas the posterior somite depends on HES7-mediated repression of LFNG and on the sustained NICD endocytosis maintained by NOTCH1 binding to DLL4. Loss of LFNG function disrupts the segmentation clock, somite polarity and organisation fail, and vertebral and costal segmentation defects result.","notes":"[The clearest glycosylation-to-signalling chain in this database] Unlike most entries, which influence signalling indirectly through proteoglycans, the substrate of LFNG is the Notch receptor itself.\n[An instructive contrast] The two other SCDO genes in the Notch pathway, DLL3 (SCDO1) and MESP2 (SCDO2), are not glycosylation genes — so one pathway and one disease can be caused either by mutation of a pathway component itself or by mutation of the glycosyltransferase that modifies it.\n[Phenotype] Vertebral and costal segmentation defects: vertebral fusion, hemivertebrae, rib fusion and malformation, with secondary severe scoliosis or kyphoscoliosis and lordosis producing a dwarf-like appearance. A narrow thorax leads to recurrent respiratory infection and respiratory insufficiency in infancy, which can be life-threatening within the first year.\n[Genetic heterogeneity of SCDO — with a quantitative screen] Seven genes have been reported: DLL3, MESP2, TBX6, HES7, RIPPLY2, DMRT2 and LFNG, of which **only LFNG is a glycosyltransferase**, so only LFNG is included here. Notably, the skeletal burden of the other six is not lower than that of LFNG — by the fraction of skeletal terms among official HPO annotations: RIPPLY2 83%, LFNG 73%, TBX6 69%, MESP2 67% (SCDO2) / 55% (SCDO1), DLL3 55%, HES7 39%. Their exclusion from this database is therefore **not for want of skeletal evidence** but because they fail the second criterion: their disease mechanism does not lie on
