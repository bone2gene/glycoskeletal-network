tal and growth-related features (real but mild)] Short stature, low birth weight, microcephaly, clinodactyly (especially of the fifth finger), long fingers and craniofacial dysmorphism (a high broad forehead, triangular face). Mouse models carrying OGT-CDG variants likewise show low body weight, low body fat, short stature and microcephaly. The clinical axis remains intellectual disability, developmental delay and severely limited speech, often with brain and ocular anomalies, epilepsy, autism spectrum features and sleep disturbance. More than 70 patients are known.\n[Mechanism undetermined, with one counterintuitive finding] Despite the CDG designation, the pathogenic mechanism is unsettled. Candidate hypotheses include an altered O-GlcNAcome, altered OGA levels, abnormal HCF1 processing, OGT misfolding and perturbation of the OGT interactome. Notably, in patients with certain variants (such as the TPR-domain L254F) **global O-GlcNAc levels are broadly normal** while OGA levels fall, implying an incomplete compensatory mechanism; reviews state explicitly that 'reduced OGT glycosyltransferase or protease activity' cannot serve as a common mechanism for all variants. In addition, transferrin glycosylation testing is negative in patients, so routine CDG screening will not detect this disease.","sources":["Willems AP, Gundogdu M, Kempers MJE, et al. Mutations in N-acetylglucosamine (O-GlcNAc) transferase in patients with X-linked intellectual disability. J Biol Chem 2017;292:12621-12631. doi:10.1074/jbc.M117.790097","Pravata VM, Gundogdu M, Bartual SG, et al. A missense mutation in the catalytic domain of O-GlcNAc transferase links perturbations in protein O-GlcNAcylation to X-linked intellectual disability. FEBS Lett 2020;594:717-727. doi:10.1002/1873-3468.13640","Pravata VM, et al. An intellectual disability syndrome with single-nucleotide variants in O-GlcNAc transferase. Eur J Hum Genet 2020 (proposes the name OGT-CDG; PMID:32080367)","OMIM 300997"],"ev":"provisional","pw":[],"dc":"glycan_machinery"},{"key":"NANS-SEMDCG","zh":"Spondyloepimetaphyseal dysplasia, Camera-Genevieve type (NANS-CDG)","en":"","genes":["NANS"],"cluster":"nucleotide_sugar","inh":"AR","omim":["610442"],"hpo":["HP:0002651","HP:0003085","HP:0005121","HP:0031367","HP:0004233","HP:0002868","HP:0001498","HP:0010582","HP:0003180","HP:0003015","HP:0004322","HP:0001263","HP:0012345"],"pathway":"NANS encodes sialic acid synthase (N-acetylneuraminate synthase), which converts ManNAc-6-P to Neu5Ac-9-P in the cytosol — the **rate-limiting step of de novo sialic acid synthesis**. Sialic acid is the commonest capping sugar at the termini of N-glycans, O-glycans and gangliosides, and its shortage leaves nearly all glycoconjugates undersialylated at their termini. Urinary N-acetylmannosamine (ManNAc) is markedly raised and is the characteristic biochemical marker.","notes":"[Contrast with the other precursor defects in this database] The entries previously in the nucleotide_sugar cluster (PMM2, PGM3, SLC35D1, TGDS) all act on sugar donors for the glycan **backbone**; NANS acts on the **terminal capping sugar**. Both present as skeletal dysplasia, showing that terminal modification of glycans is as necessary for cartilage development as backbone elongation.\n[Phenotype] Spondyloepimetaphyseal dysplasia (SEMD) with short stature and developmental delay. The imaging is quite indicative: relatively long fibulae, posterior scalloping of the vertebral bodies, metaphyseal striation, advanced carpal bone age, narrow iliac wings, carpal hypoplasia and irregular epiphyses. Of these, 'long fibula' is carried by only 4 of the 8,478 OMIM diseases and 'posterior vertebral scalloping' by only 6 — so both inclusion routes are satisfied.\n[Therapeutic lead] Work suggests that supplementing ManNAc (bypassing the NANS step) may have therapeutic potential, since ManNAc lies upstream of the block while the steps downstream of NANS are intact; this remains at the research stage.","sources":["OMIM 610442","van Karnebeek CDM, et al. NANS-mediated synthesis of sialic acid is required for brain and skeletal development. Nat Genet 2016;48:777-784 [gene discovery]","Mol Genet Metab 2024 (CDG nosology)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"ARSK-MPSX","zh":"Mucopolysaccharidosis type X (ARSK deficiency)","en":"","genes":["ARSK"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["619698"],"hpo":["HP:0012307","HP:0008833","HP:0005121","HP:0000916","HP:0000885","HP:0003521","HP:0004568","HP:0003307","HP:0001385","HP:0002857","HP:0000926","HP:0002650"],"pathway":"ARSK encodes arylsulfatase K, which hydrolyses the **sulfate at the 2-O position of glucuronic acid** in glycosaminoglycans. This step was long the missing link in the degradation chain of heparan sulfate and chondroitin sulfate — before ARSK was identified, the desulfatase for GlcA-2-O-sulfate was unknown. Deficiency blocks GAG degradation at that position, with consequent storage.","notes":"[The newest member of the MPS family (named in 2022)] The lysosomal_GAG_degradation cluster of this database thereby grew from nine entries to ten. Compared with the classical MPS disorders, the ARSK phenotype is relatively **mild**: predominantly skeletal, with short-trunk short stature, usually normal or only mildly affected intelligence, and no corneal clouding.\n[Highly indicative imaging] Oar-shaped ribs (only 3 diseases in the full set), an irregular acetabular roof (4), posterior vertebral scalloping (6) and broad clavicles (7) — satisfying both Route A (44%) and Route B (the most specific term is carried by only 3 diseases).\n[Relation to SUMF1] Like the other sulfatases in this database (ARSB, GALNS, GNS), the catalytic activity of ARSK depends on the post-translational cysteine-to-formylglycine conversion performed by SUMF1; SUMF1 deficiency therefore abolishes every sulfatase including ARSK (see the SUMF1-MSD entry).","sources":["OMIM 619698","Verheyen S, et al. Novel subtype of mucopolysaccharidosis caused by arylsulfatase K (ARSK) deficiency. J Med Genet 2022;59:957-964 [gene discovery]","Trombetta-Lima M, et al. (ARSK substrate specificity: GlcA 2-O-sulfatase)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SUMF1-MSD","zh":"Multiple sulfatase deficiency (SUMF1 / formylglycine-generating enzyme)","en":"","genes":["SUMF1"],"cluster":"sulfatase_activation","inh":"AR","omim":["272200"],"hpo":["HP:0000943","HP:0008479","HP:0011304","HP:0010055","HP:0004322","HP:0000280","HP:0008064","HP:0001263","HP:0001252","HP:0012345"],"pathway":"SUMF1 encodes the formylglycine-generating enzyme (FGE), which converts the active-site **cysteine of every sulfatase to C-alpha-formylglycine** within the ER. This post-translational modification is the **only route** by which a sulfatase acquires catalytic activity; without it the enzyme protein is still synthesised but is completely inactive. All 17 human sulfatases are therefore **inactivated simultaneously**, and the clinical picture superimposes the mucopolysaccharidoses (substrates of ARSB, GALNS, GNS, IDS, ARSK), metachromatic leukodystrophy (ARSA substrate) and X-linked ichthyosis (STS substrate).","notes":"[Why it forms a mechanism cluster of its own] Every other entry in this database has a defect on one specific glycan pathway; SUMF1 is a **cross-pathway post-translational activation node** — it never touches a sugar, yet it determines whether an entire enzyme family can work at all. The products of five genes in this database (ARSB, GALNS, GNS, IDS, ARSK) all depend on SUMF1 for activation, making it the most highly coupled single node in the whole set.\n[Included under Route B] The proportion is only 4/34 = 12%, below Route A. But the skeletal annotations include **dysostosis multiplex (24 diseases in the full set)** and vertebral hypoplasia (10), the former being the defining radiological sign of the mucopolysaccharidoses. This again illustrates the dilution effect of the proportional method in multisystem disease — the skeletal burden of MSD is in fact no lower than that of a single MPS.\n[Phenotype] Combines MPS and leukodystrophy features: dysostosis multiplex, coarse facies, short stature, ichthyosis, severe developmental delay and regression, and hypotonia. Most patients die in childhood.","sources":["OMIM 272200","Cosma MP, et al. The multiple sulfatase deficiency gene encodes an essential and limiting factor for the activity of sulfatases. Cell 2003;113:445-456 [gene discovery]","Dierks T, et al. Multiple sulfatase deficiency is caused by mutations in the gene encoding the human C-alpha-formylglycine generating enzyme. Cell 2003;113:435-444 [independent, simultaneous discovery]"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC17A5-ISSD","zh":"Free sialic acid storage disease (infantile form, ISSD; allelic Salla disease is the mild form)","en":"","genes":["SLC17A5"],"cluster":"lysosomal_glycoprotein_degradation","inh":"AR","omim":["269920"],"hpo":["HP:0002680","HP:0003025","HP:0000938","HP:0004322","HP:0000280","HP:0001433","HP:0000100","HP:0001263","HP:0001252"],"pathway":"SLC17A5 encodes sialin, the **free sialic acid exporter** of the lysosomal membrane. Once NEU1 and related enzymes have cleaved sialic acid from glycoconjugates inside the lysosome, the free sialic acid must be exported by sialin before it can be reused; loss of function causes free sialic acid to accumulate in lysosomes and to be excreted in large amounts in the urine. Note that this is a transport defect for a **degradation product**, not a defect of the degrading enzyme itself — forming a pair with NEU1 sialidosis elsewhere in this database.","notes":"[A precise contrast with NEU1 sialidosis, the cleanest such pair in the database] NEU1 deficiency means the sialic acid **cannot be cleaved off**, and the stored material is oligosaccharides bearing bound sialic acid; SLC17A5 deficiency means it is cleaved but **cannot be exported**, and the stored material is free sialic acid. Two adjacent steps on one metabolic chain, one an enzyme and one a transporter, distinguishable by urine biochemistry (free versus bound sialic acid).\n[Included under Route B] The proportion for ISSD is 4/33 = 12%, below Route A; but it carries **a J-shaped sella turcica (only 12 diseases in the full set)**, which is a typical sign of dysostosis multiplex and was one of the examples cited when v3.7 of this database withdrew the 'exclude the cranial branch' criterion. Had that criterion been retained, this entry would have been eliminated in error.\n[Allelic disease spectrum] The severe form, ISSD (269920), has infantile onset with hydrops fetalis and nephropathy and early death; the mild form, Salla disease (604369), is dominated by intellectual disability and ataxia, with a skeletal proportion of only 6% that meets neither route, so only ISSD is included here.","sources":["OMIM 269920 / 604369","Verheijen FW, et al. A new gene, encoding an anion transporter, is mutated in sialic acid storage diseases. Nat Genet 1999;23:462-465","GeneReviews: Free Sialic Acid Storage Disorders (NBK1470)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"ATP6V0A2-CDG","zh":"ATP6V0A2-CDG (wrinkly skin syndrome / autosomal recessive cutis laxa IIA)","en":"","genes":["ATP6V0A2"],"cluster":"golgi_homeostasis","inh":"AR","omim":["278250","219200"],"hpo":["HP:0001476","HP:0000270","HP:0002645","HP:0003100","HP:0002812","HP:0001374","HP:0030799","HP:0000253","HP:0000938","HP:0002808","HP:0000767","HP:0000973","HP:0001263","HP:0012345"],"pathway":"ATP6V0A2 encodes the a2 subunit of the vacuolar proton pump (V-ATPase), responsible for **acidification of the Golgi lumen**. The Golgi pH gradient is a prerequisite for correct localisation and activity of glycosyltransferases and glycosidases; failure of acidification impairs N- and O-glycosylation **simultaneously**, giving abnormalities of both serum transferrin and ApoC-III — a classic CDG of the 'multiple glycosylation pathway defect' type.","notes":"[Why it is grouped with TMEM165 and the COG subunits] This entry shares a mechanism with TMEM165 (Mn2+/Ca2+ homeostasis) and COG1/4/8 (vesicle tethering) in the golgi_homeostasis cluster: **the glycosyltransferases themselves are normal, but the Golgi environment in which they work is disrupted**. Together the three show that glycosylation depends not only on enzyme gene sequence but on the physicochemical conditions of the organelle.\n[Phenotype] Cutis laxa / wrinkled skin (present at birth, sometimes improving with age), delayed closure of the anterior fontanelle, delayed closure of the cranial sutures, wormian bones, slender long bones, coxa vara, congenital hip dislocation, osteopenia, kyphosis, pectus excavatum, and progressive microcephaly with developmental delay. The coexistence of cutis laxa and skeletal change suggests that elastic fibres and bone matrix share glycosylation-regulated assembly steps.\n[Nomenclature disagreement] Wrinkly skin syndrome (278250) and autosomal recessive cutis laxa type IIA (219200) were once regarded as two diseases and are now considered a phenotypic continuum of one gene; they are merged into one entry here with both MIM numbers listed. Their skeletal proportions are 28% and 17% respectively, both meeting Route A.","sources":["OMIM 278250 / 219200","Kornak U, et al. Impaired glycosylation and cutis laxa caused by mutations in the vesicular H+-ATPase subunit ATP6V0A2. Nat Genet 2008;40:32-34 [gene discovery]","Guillard M, et al. (combined N- and O-glycosylation defect in ATP6V0A2-CDG)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MBTPS1-SEMD","zh":"MBTPS1-related spondyloepimetaphyseal dysplasia with elevated lysosomal enzymes (Kondo-Fu type)","en":"","genes":["MBTPS1"],"cluster":"M6P_targeting","inh":"AR","omim":["618392"],"hpo":["HP:0002655","HP:0001216","HP:0004349","HP:0100864","HP:0000768","HP:0002808","HP:0001156","HP:0004322","HP:0000518","HP:0000023","HP:0001263"],"pathway":"MBTPS1 encodes site-1 protease (S1P), a Golgi serine protease. Its connection to this database is very specific: **S1P performs the activating cleavage of the GlcNAc-1-phosphotransferase (GNPTAB) precursor**, and GNPTAB is the enzyme that attaches the mannose-6-phosphate (M6P) tag to lysosomal enzymes. S1P deficiency therefore leaves GNPTAB inadequately activated, M6P tagging insufficient and lysosomal enzymes missecreted into the plasma — hence 'elevated plasma lysosomal enzymes' as the diagnostic clue. S1P has a further, independent function: activation of the ER stress transducer BBF2H7, loss of which causes collagen to be retained in the chondrocyte ER.","notes":"[Why it is placed in the M6P_targeting cluster] That cluster previously contained GNPTAB and GNPTG (mucolipidosis II/III), the tagging enzyme itself; MBTPS1 and TMEM251 are **upstream activators** of that enzyme. The three-tier structure is thus complete: activators (MBTPS1, TMEM251) to tagging enzyme (GNPTAB/GNPTG) to the M6P tag.\n[A dual mechanism that must not be simplified] The literature states explicitly that the skeletal phenotype arises through two parallel mechanisms: (1) impaired M6P-dependent delivery of lysosomal enzymes, which are instead secreted extracellularly and degrade bone matrix; and (2) impaired activation of BBF2H7, so that collagen is retained in the chondrocyte ER and chondrocytes undergo apoptosis. This entry is therefore **not a pure glycosylation disease**; it is included because one of the two mechanisms lies squarely on the M6P pathway.\n[Phenotype] Postnatal-onset short stature, thoracic deformity (pectus carinatum or excavatum), kyphosis/scoliosis, reduced bone density, inguinal hernia, abdominal distension, cataract, developmental delay and a characteristic facies (prominent forehead and malar region, retrognathia, large ears). Imaging: diffuse osteopenia, a beaten-copper appearance of the skull, hypoplasia of several thoracolumbar vertebrae, small irregular long-bone epiphyses, mildly widened and irregular metaphyses, and hip dysplasia.\n[Allelic disease] MBTPS1 also causes CAOP syndrome (cataract, alopecia, oral mucosal disease and psoriasis-like features, 621252), whose skeletal proportion is 0% — another instance of one gene with two phenotypes.","sources":["OMIM 618392","Kondo Y, Fu J, Wang H, et al. Site-1 protease deficiency causes human skeletal dysplasia due to defective inter-organelle protein trafficking. JCI Insight 2018;3:e121596 [gene discovery]","GeneReviews: MBTPS1-Related Spondyloepimetaphyseal Dysplasia with Elevated Lysosomal Enzymes (NBK597768)","Carvalho DR, et al. Am J Med Genet A 2020;182:1796-1800"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"TMEM251-GCAF-MLV","zh":"TMEM251/GCAF (LYSET)-related severe skeletal dysplasia (proposed mucolipidosis type V)","en":"","genes":["TMEM251"],"cluster":"M6P_targeting","inh":"AR","omim":[],"hpo":["HP:0003510","HP:0000943","HP:0000280","HP:0004322","HP:0000926","HP:0001156","HP:0012345"],"pathway":"TMEM251 (alias **GCAF** = GNPTAB cleavage and activity factor; also LYSET) is a Golgi membrane protein **required for cleavage and activation of the GNPTAB precursor**. With MBTPS1 it forms the upstream activation layer of the M6P tagging enzyme: without TMEM251 the GNPTAB alpha/beta precursor cannot be cleaved into active subunits, the M6P tag is lost and lysosomal enzymes are missecreted. Its cellular phenotype closely matches that of GNPTAB knockout.","notes":"[A note on gene symbols] **GCAF is not an HGNC-approved symbol**; it is the functional name given to **TMEM251** by Zhang et al. in Nat Commun in 2022 (GNPTAB cleavage and activity factor). The same gene has a third name, **LYSET** (lysosomal enzyme trafficking factor), published simultaneously in Science by two independent groups. All three names denote one gene; this database uses the HGNC symbol TMEM251 and records every alias here so that searches do not miss the entry.\n[Why the evidence level is provisional] (1) Neither HPO nor OMIM has yet assigned a phenotype entry, so the gene cannot take part in the database's quantitative screen (the same situation as FAM20B and UXS1). (2) Human cases have been reported: Ain et al., Hum Mutat 2021, described patients with biallelic TMEM251 variants presenting with **severe skeletal dysplasia and extreme short stature**. (3) Knockout of TMEM251 in zebrafish causes pericardial oedema, cartilage deficiency and skeletal dysplasia, matching the GNPTAB knockout phenotype and supporting causality.\n[Relation to mucolipidosis II/III] The original authors propose the name **mucolipidosis type V**, on the grounds that the mechanism lies on the same M6P pathway as ML II/III (GNPTAB/GNPTG) and the clinical picture is similar. The name has not been adopted by OMIM, and this database labels it faithfully as 'proposed'.","sources":["Zhang W, Yang X, et al. GCAF(TMEM251) regulates lysosome biogenesis by activating the mannose-6-phosphate pathway. Nat Commun 2022;13:5351. doi:10.1038/s41467-022-33025-1 [GCAF naming and mechanism]","Ain NU, et al. Biallelic TMEM251 variants in patients with severe skeletal dysplasia and extreme short stature. Hum Mutat 2021;42:89-101 [human phenotype]","Pechincha C, et al. Lysosomal enzyme trafficking factor LYSET enables nutritional usage of extracellular proteins. Science 2022;378:eabn5637","Richards CM, et al. The human disease gene LYSET is essential for lysosomal enzyme transport and viral infection. Science 2022;378:eabn5648"],"ev":"provisional","pw":[],"dc":"glycan_machinery"},{"key":"ASAH1-Farber","zh":"Farber lipogranulomatosis (acid ceramidase deficiency)","en":"","genes":["ASAH1"],"cluster":"glycosphingolipid","inh":"AR","omim":["228000"],"hpo":["HP:0009134","HP:0010501","HP:0003049","HP:0001386","HP:0009771","HP:0001187","HP:0001369","HP:0001482","HP:0001609","HP:0001263"],"pathway":"ASAH1 encodes lysosomal acid ceramidase, which hydrolyses **ceramide** to sphingosine and a fatty acid. On the glycosphingolipid degradation chain it follows directly after GBA1: glucosylceramide --GBA1--> ceramide --ASAH1--> sphingosine + fatty acid. Accumulating ceramide provokes macrophage-derived granulomas deposited in joints, subcutaneous tissue and the larynx.","notes":"[A classification caveat that must be stated: the substrate here is not a sugar] This is the only entry in the database whose **substrate contains no sugar**. Ceramide is the backbone of sphingolipids and carries no glycan; the step catalysed by ASAH1 occurs after the sugar has been removed. It is included because it is **directly contiguous** with GBA1 on the same degradation chain and GBA1 is already included — omitting ASAH1 would cut the chain artificially at the sugar/non-sugar boundary. Strictly speaking this is a **sphingolipidosis** rather than a glycolipid disorder, and users searching under 'abnormal glycosylation' should bear that in mind.\n[A bone and joint phenotype unlike any other in the database] The classical triad is painful swollen contracted joints, subcutaneous nodules (periarticular and at pressure points) and progressive hoarseness (laryngeal granuloma). Imaging shows **osteolytic destruction** of the phalanges and foot bones — the term 'osteolysis involving bones of the feet' is carried by **this disease alone** among the 8,478 OMIM diseases in the full set, making it one of the most specific skeletal terms verified in this database (on a par with the butterfly vertebral arches of Alagille syndrome). Both Route A (27%) and Route B are satisfied.\n[Distinction from skeletal dysplasia] The bone and joint lesions of Farber disease are **inflammatory and granulomatous**, destructive rather than developmental, and differ in pathological character from the great majority of entries here; the distinction must be kept in view when reading the database by mechanism cluster.\n[Allelic disease] ASAH1 also causes spinal muscular atrophy with progressive myoclonic epilepsy (SMA-PME, 159950), whose skeletal proportion is only 4% and which meets neither route, so it is not included.","sources":["OMIM 228000","Koch J, et al. Molecular cloning and characterization of a full-length complementary DNA encoding human acid ceramidase. J Biol Chem 1996","GeneReviews / Orphanet: Farber disease","HPO phenotype.hpoa (osteolysis involving bones of the feet is carried by this disease alone in the full set)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"SLC35C1-CDG","zh":"SLC35C1-CDG (CDG-IIc / leukocyte adhesion deficiency type II)","en":"","genes":["SLC35C1"],"cluster":"golgi_transporter","inh":"AR","omim":["266265"],"hpo":["HP:0001212","HP:0200055","HP:0001773","HP:0001156","HP:0004322","HP:0002718","HP:0001249","HP:0012345"],"pathway":"SLC35C1 encodes the **Golgi GDP-fucose transporter**, carrying cytosolically synthesised GDP-fucose into the Golgi lumen for use by fucosyltransferases. Loss of function leaves all fucosylation severely deficient — including the Lewis blood group antigens and the leukocyte-surface sialyl Lewis X that serves as the selectin ligand — so leukocytes cannot bind endothelial selectins or undergo rolling adhesion, producing recurrent infection and extreme leukocytosis.","notes":"[Why the evidence level is provisional: neither inclusion route is met] Skeletal terms make up 5/37 = 13.5% of the official HPO annotations (below 15%), and the most specific skeletal term, prominent fingertip pads, is carried by 52 diseases in the full set (not below 15). By the database's objective criteria this entry therefore **does not qualify**. It is retained for two reasons: (1) it is the only representative in the database of the entire fucosylation pathway; and (2) together with SLC10A7, SLC35A3 and SLC35B2 it completes the 'nucleotide-sugar / ion transporter' group of the golgi_transporter cluster. Users working through the differential diagnosis of a skeletal dysplasia should not treat this entry as a candidate; `--established-only` will exclude it.\n[The skeletal and growth features are genuinely mild] Short stature, small hands and feet, brachydactyly, prominent fingertip pads and microcephaly; the clinical axis is **recurrent bacterial infection with extreme leukocytosis but without pus formation**, severe intellectual disability and developmental delay, and the Bombay (hh) blood group.\n[Treatable, and worth flagging] Some patients respond to oral **L-fucose** supplementation, which can raise selectin ligand expression and reduce infections. This is one of the few entries in the database with a specific metabolic treatment (another example is niacin supplementation in pregnancy for CNDD, although that entry is not included). Response varies between individuals and depends on the particular variant.","sources":["OMIM 266265","Lubke T, et al. Complementation cloning identifies CDG-IIc, a new type of congenital disorders of glycosylation, as a GDP-fucose transporter deficiency. Nat Genet 2001;28:73-76 [gene discovery]","Luhn K, et al. The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose transporter. Nat Genet 2001;28:69-72 [independent, simultaneous discovery]","Marquardt T, et al. Correction of leukocyte adhesion deficiency type II with oral fucose. Blood 1999;94:3976-3985 [fucose therapy]"],"ev":"provisional","pw":[],"dc":"glycan_machinery"},{"key":"MGAT2-CDG","zh":"MGAT2-CDG (CDG type IIa)","en":"","genes":["MGAT2"],"cluster":"N_glycan_processing","inh":"AR","omim":["212066"],"hpo":["HP:0003423","HP:0001547","HP:0003100","HP:0009623","HP:0002673","HP:0000938","HP:0000303","HP:0000248","HP:0000278","HP:0000767","HP:0000470","HP:0001508","HP:0001250","HP:0012345"],"pathway":"MGAT2 encodes N-acetylglucosaminyltransferase II (GlcNAc-T II), which adds the second GlcNAc to the alpha-1,6-mannose arm of the N-glycan in the Golgi — the decisive branching step that converts the **hybrid-type** triantennary precursor into a **complex-type biantennary** N-glycan. Loss of function leaves all complex-type N-glycans with a single antenna, and serum transferrin shows a CDG type II pattern.","notes":"[A structural gap in the database's N-glycan coverage, found by systematic screening] The previous N-glycan entries (ALG3/6/9/12, STT3A/B) all lay on the **ER side, in LLO assembly and transfer**; not one covered **processing and branching on the Golgi side**. MGAT2 is the prototypical defect of that step and, with MAN1B1 (trimming) and FUT8 (core fucosylation), makes up the newly created N_glycan_processing cluster.\n[Phenotype] Thoracolumbar kyphoscoliosis, rib anomalies, slender long bones, proximally placed thumbs, coxa valga, osteopenia, mandibular prognathism, short neck and pectus excavatum, with developmental delay, seizures and feeding difficulty. The skeletal proportion is 13/59 = 22%, and thoracolumbar kyphoscoliosis is carried by only 4 diseases in the full set, so both Route A and Route B are satisfied.","sources":["OMIM 212066","Tan J, Dunn J, Jaeken J, Schachter H. Mutations in the MGAT2 gene controlling complex N-glycan synthesis cause carbohydrate-deficient glycoprotein syndrome type II. Am J Hum Genet 1996;59:810-817 [gene discovery]","Mol Genet Metab 2024 (CDG nosology)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MAN1B1-Rafiq","zh":"MAN1B1-CDG (Rafiq syndrome)","en":"","genes":["MAN1B1"],"cluster":"N_glycan_processing","inh":"AR","omim":["614202"],"hpo":["HP:0005469","HP:0000268","HP:0000272","HP:0001371","HP:0004209","HP:0000470","HP:0000256","HP:0001249","HP:0001252","HP:0012345"],"pathway":"MAN1B1 encodes ER alpha-1,2-mannosidase I, which trims mannose from N-glycans. Its role goes beyond glycan processing: the enzyme also acts as **the timer that commits misfolded glycoproteins to ERAD degradation** — the extent of mannose trimming determines whether a glycoprotein continues to fold or is sent for degradation. Loss of function gives a CDG type II serum transferrin pattern.","notes":"[Two superimposed functions] What distinguishes this entry from the other N-glycan entries is that MAN1B1 deficiency both alters glycan structure and disturbs the timing of ERAD quality control; the relative contribution of the two to the phenotype has not been resolved.\n[Predominantly neurological and craniofacial, with the skeleton secondary] A flat occiput, dolichocephaly, flat malar region, flexion contractures, fifth-finger clinodactyly, short neck and macrocephaly, with intellectual disability and hypotonia. The skeletal proportion is 7/44 = 16%, barely above the Route A threshold, and the most specific skeletal term is carried by 51 diseases in the full set, failing Route B. Users should read this accordingly: the skeletal evidence for this entry is among the weaker in the database.","sources":["OMIM 614202","Rafiq MA, et al. Mutations in the alpha 1,2-mannosidase gene, MAN1B1, cause autosomal-recessive intellectual disability. Am J Hum Genet 2011;89:176-182 [gene discovery]","Jaeken J, Lefeber DJ, Matthijs G. Clinical utility gene card for: MAN1B1 deficiency-CDG. Eur J Hum Genet 2016"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"FUT8-CDG","zh":"FUT8-CDG (core fucosylation defect)","en":"","genes":["FUT8"],"cluster":"N_glycan_processing","inh":"AR","omim":["618005"],"hpo":["HP:0009826","HP:0034392","HP:0002827","HP:0002751","HP:0000938","HP:0000278","HP:0001252","HP:0001508","HP:0001249","HP:0012345"],"pathway":"FUT8 encodes alpha-1,6-fucosyltransferase, which adds fucose to **the innermost core GlcNAc** of N-glycans (core fucosylation). The modification does not alter the glycan backbone but markedly affects receptor binding and signal transduction by the glycoprotein (the best-known example being the core fucose on the IgG Fc, which determines ADCC potency).","notes":"[Complementary to SLC35C1] The only previous representative of fucosylation in this database was SLC35C1 (the GDP-fucose transporter, and provisional at that) — 'the substrate cannot get in'. FUT8 is 'the enzyme itself is broken', and specifically at the core position. Together they give the fucosylation pathway representation on both the donor and the enzyme side.\n[Phenotype] Limb hypoplasia, joint contractures, hip dislocation, kyphoscoliosis, osteopenia and retrognathia, with growth and developmental delay, recurrent respiratory infection and early death. The skeletal proportion is 7/34 = 21% (Route A).\n[Mechanistic note] Loss of core fucose affects the function of several signalling receptors including the TGF-beta receptor, and Fut8 knockout mice show growth retardation and emphysema-like change; but no direct experimental link has been made between the patients' skeletal phenotype and a specific signalling pathway, so no pathways are annotated.","sources":["OMIM 618005","Ng BG, et al. Biallelic mutations in FUT8 cause a congenital disorder of glycosylation with defective fucosylation. Am J Hum Genet 2018;102:188-195 [gene discovery]"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"ALG1-CDG","zh":"ALG1-CDG (CDG type Ik)","en":"","genes":["ALG1"],"cluster":"N_glycosylation_LLO","inh":"AR","omim":["608540"],"hpo":["HP:0000239","HP:0034392","HP:0001371","HP:0000347","HP:0000252","HP:0001252","HP:0001250","HP:0002240","HP:0012345"],"pathway":"ALG1 encodes beta-1,4-mannosyltransferase, which adds the **first mannose** to GlcNAc2-PP-Dol on the cytosolic face of the ER — an early and critical step of lipid-linked oligosaccharide (LLO) assembly. Loss of function leaves the LLO severely truncated and gives a CDG type I serum transferrin pattern.","notes":"[A different position from the other ALG entries here] ALG3/6/9/12 all act at **later** steps of LLO assembly; ALG1 acts at the earliest. The general rule is that the earlier the block, the less residual glycosylation and the more severe the phenotype — and ALG1-CDG is indeed among the most severe CDGs, with most affected children dying in infancy.\n[Phenotype] A wide fontanelle, joint and flexion contractures, micrognathia and microcephaly, with severe hypotonia, refractory epilepsy, hepatomegaly, coagulopathy and immunodeficiency. The skeletal proportion is 5/25 = 20% (Route A), but with exactly 5 terms it only just reaches the threshold, and the skeletal changes are mainly contractures and craniofacial features rather than a primary dysostosis — the same situation that calls for caution in the COG8 entry.","sources":["OMIM 608540","Schwarz M, et al. Deficiency of GDP-Man:GlcNAc2-PP-dolichol mannosyltransferase causes congenital disorder of glycosylation type Ik. Am J Hum Genet 2004;74:472-481 [gene discovery]","Ng BG, et al. (ALG1-CDG case series and phenotypic spectrum)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"DPM1-CDG","zh":"DPM1-CDG (CDG type Ie)","en":"","genes":["DPM1"],"cluster":"N_glycosylation_LLO","inh":"AR","omim":["608799"],"hpo":["HP:0009824","HP:0006466","HP:0005469","HP:0004279","HP:0006380","HP:0200055","HP:0012385","HP:0000347","HP:0001252","HP:0001250","HP:0012345"],"pathway":"DPM1 is the catalytic subunit of **dolichol-phosphate-mannose (Dol-P-Man) synthase**. Dol-P-Man is the mannose donor shared by three pathways: (1) the later mannoses of LLO assembly; (2) the mannoses of the **GPI anchor**; and (3) **O-mannosylation** of alpha-dystroglycan. DPM1 deficiency is therefore one of the few nodes that strikes N-glycosylation, GPI anchoring and O-mannosylation **simultaneously**.","notes":"[A rare 'three-pathway convergence' entry] Most entries in this database affect a single pathway; DPM1 sits at the donor level, and its downstream reach covers both the N_glycosylation_LLO and GPI_anchor clusters here as well as the O-mannosylation (dystroglycanopathy) branch, which this database does not include. Structurally this parallels SUMF1 (which spans the sulfatase family): **a single-point defect at the donor or activation layer has consequences that cross clusters**.\n[Phenotype] Upper-limb hypoplasia, flexion contractures of ankles and knees, flat occiput, short metacarpals, small hands, camptodactyly and micrognathia, with severe hypotonia, refractory epilepsy and hepatomegaly. The skeletal proportion is 9/49 = 18% (Route A).\n[Overlap with muscular dystrophy] Because O-mannosylation is affected, some patients with DPM1/DPM2/DPM3 defects also show muscular dystrophy-dystroglycanopathy features (most prominently in DPM3-CDG), making this one of the junctions between the CDG and muscular dystrophy disease groups.","sources":["OMIM 608799","Imbach T, et al. Deficiency of dolichol-phosphate-mannose synthase-1 causes congenital disorder of glycosylation type Ie. J Clin Invest 2000;105:233-239 [gene discovery]","Barone R, et al. DPM2-CDG: a muscular dystrophy-dystroglycanopathy syndrome with severe epilepsy. Ann Neurol 2012;72:550-558"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"HYAL2-MCC","zh":"HYAL2-related Muggenthaler-Chowdhury-Chioza syndrome","en":"","genes":["HYAL2"],"cluster":"lysosomal_GAG_degradation","inh":"AR","omim":["621063"],"hpo":["HP:0010884","HP:0009622","HP:0005709","HP:0011304","HP:0010055","HP:0000260","HP:0004209","HP:0000767","HP:0000470","HP:0002007","HP:0000347","HP:0000252"],"pathway":"HYAL2 encodes hyaluronidase 2, a GPI-anchored cell-surface enzyme that cuts high-molecular-weight hyaluronan (HA) into intermediate fragments of about 20 kDa, which HYAL1 then degrades further within the lysosome. The two form the **tandem two-step** degradation of HA: HYAL2 initiates at the cell surface and HYAL1 completes the process in the lysosome.","notes":"[A tandem pair with HYAL1 in this database] HYAL1 deficiency is mucopolysaccharidosis type IX, already included here; HYAL2 deficiency presents quite differently, dominated by **orofacial clefting and cardiac malformation** (the original report described cleft lip and palate with congenital heart disease) rather than the storage features of a typical MPS. One substrate, two adjacent steps, dissimilar phenotypes — another demonstration that position in a pathway does not predict phenotype.\n[Phenotype] Acromelia (carried by only 2 diseases in the full set), distally placed thumbs, cutaneous syndactyly of the toes, broad thumbs and halluces, a wide anterior fontanelle, fifth-finger clinodactyly, pectus excavatum, short neck, frontal bossing, micrognathia and microcephaly. The skeletal proportion is 13/78 = 17%, and the most specific term is carried by only 2 diseases — both Route A and Route B are satisfied.\n[Historical note] HYAL2 was long thought to have no human disease; the syndrome on which this entry rests was named only recently and is one of the entries filled in by the v4.2 systematic screen from the list of 'already passing the screen but not yet curated'.","sources":["OMIM 621063","Muggenthaler MMA, et al. Mutations in HYAL2, encoding hyaluronidase 2, cause a syndrome of orofacial clefting and cor triatriatum sinister. PLoS Genet 2017;13:e1006470 [gene discovery]"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"MAN2C1-CDDG2","zh":"MAN2C1-related congenital disorder of deglycosylation 2 (CDDG2)","en":"","genes":["MAN2C1"],"cluster":"deglycosylation","inh":"AR","omim":["619775"],"hpo":["HP:0002816","HP:0011304","HP:0000960","HP:0001852","HP:0000256","HP:0000347","HP:0001252","HP:0001249","HP:0012345"],"pathway":"MAN2C1 encodes **cytosolic alpha-mannosidase**, which continues to trim free oligosaccharides after NGLY1 has released the N-glycan from a misfolded glycoprotein, so that they can be transported into the lysosome for complete degradation. Like NGLY1 it belongs to 'deglycosylation', the direction opposite to synthesis: NGLY1 **removes** the glycan and MAN2C1 **processes what has been removed**.","notes":"[The deglycosylation cluster grows from one entry to two and the chain is complete] The cluster previously contained only NGLY1 (CDDG1). MAN2C1 deficiency has been designated CDDG2; the two are consecutive on one degradation chain, and patient cells in both accumulate free oligosaccharides.\n[Phenotype] Genu recurvatum, broad thumbs, a sacral dimple, sandal gap, macrocephaly and micrognathia, with developmental delay and hypotonia. The skeletal proportion is 6/35 = 17% (Route A), but the most specific term is carried by 20 diseases in the full set and so fails Route B; the skeletal changes are mainly postural and craniofacial rather than a primary dysostosis.","sources":["OMIM 619775","Verheijen J, et al. (MAN2C1 deficiency causing a congenital disorder of deglycosylation)","Mol Genet Metab 2024 (CDG nosology, CDDG2)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PIGF-OOIID","zh":"PIGF-related onychodystrophy, osteodystrophy and impaired intellectual development","en":"","genes":["PIGF"],"cluster":"GPI_anchor","inh":"AR","omim":["619356"],"hpo":["HP:0005707","HP:0001857","HP:0009882","HP:0000347","HP:0000252","HP:0012345"],"pathway":"PIGF forms a complex with PIGO and together they carry out **transfer of ethanolamine phosphate** onto the GPI anchor; PIGF is the partner subunit required for PIGO to function. PIGO-HPMRS2 is already in this database, and the PIGF entry brings both partners of the pair into the set.","notes":"[Osteodystrophy appears in the disease name itself, which is unusual among GPI defects] Most entries in the GPI_anchor cluster have a neurological axis; PIGF is one of the few GPI defects with **dysostosis written into the disease name**.\n[Phenotype] Bilateral triphalangeal thumbs (carried by only 3 diseases in the full set), short distal phalanges of fingers and toes, micrognathia and microcephaly, with nail dysplasia and intellectual disability. The skeletal proportion is 5/29 = 17%, with exactly 5 terms meeting the threshold; the most specific term is carried by 3 diseases, so Route B is also satisfied.\n[Phenotypic contrast with PIGO] PIGO deficiency (HPMRS2) has hyperphosphatasia with intellectual disability as its axis, whereas PIGF deficiency is dominated by nail and bone dysplasia and alkaline phosphatase may not be raised — two subunits of one complex with different phenotypic emphases.","sources":["OMIM 619356","Jezela-Stanek A, et al. (clinical description of PIGF deficiency)","Knaus A, et al. (phenotypic spectrum of GPI biosynthesis defects)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"PSAP-GDSAPC","zh":"Atypical Gaucher disease due to saposin C deficiency (PSAP)","en":"","genes":["PSAP"],"cluster":"glycosphingolipid","inh":"AR","omim":["610539"],"hpo":["HP:0004975","HP:0000938","HP:0002808","HP:0001433","HP:0001744","HP:0001873","HP:0000407","HP:0002376","HP:0001336","HP:0002080","HP:0001250"],"pathway":"PSAP encodes prosaposin, which is cleaved sequentially within the lysosome into the four small proteins saposin A, B, C and D. These have no catalytic activity of their own but are **obligatory activators of sphingolipid hydrolases**:\n  - saposin C activates glucocerebrosidase (**GBA1**)\n  - saposin B activates arylsulfatase A, **beta-galactosidase (GLB1)** and alpha-galactosidase A\n  - saposin A activates galactocerebrosidase; saposin D activates sphingomyelinase\nSaposin C does not solubilise the substrate but binds the enzyme together with acidic lipids to form an activated complex.","notes":"[The key diagnostic feature: normal enzyme activity yet overt disease] In patients with saposin C deficiency **in vitro glucocerebrosidase activity is normal**, yet a Gaucher-like phenotype develops. Measuring enzyme activity alone will miss the diagnosis — one of the few instances in this database of 'normal enzyme activity but a failed pathway', logically the same as SUMF1 (where the enzyme protein exists but is inactive for want of formylglycine).\n[Included under Route B, on the same term as GBA1-Gaucher] The skeletal proportion is only 2/24 = 8%, far below Route A; but it carries the **Erlenmeyer flask deformity of the femurs** (only 7 diseases in the full set), exactly the basis on which GBA1-Gaucher was included — which is the very intent of Route B: one characteristic bone sign should capture both the enzyme deficiency and the deficiency of its activator.\n[Marked phenotypic heterogeneity] Reports range from type 1-like (growth retardation, hepatosplenomegaly, thrombocytopenia, kyphosis) to type 3-like (severe refractory myoclonic epilepsy, developmental regression, intention tremor); one Pakistani family presented prominently with **prelingual severe sensorineural deafness and vestibular dysfunction**. Variants within the Sap-C domain that affect cysteines (disulfide bonds) are more often accompanied by neurological involvement.\n[Upstream and downstream relations within this database] PSAP lies upstream of both **GBA1** (through saposin C) and **GLB1** (through saposin B), both of which are included here; variants affecting all saposins cause combined saposin deficiency (611721), whose skeletal proportion is 0% and which is not included.","sources":["OMIM 610539 / 176801","Christomanou H, et al. 1986 (first case: atypical Gaucher disease with normal enzyme activity and Sap-C deficiency)","Tamargo RJ, Velayati A, Goldin E, Sidransky E. The role of saposin C in Gaucher disease. Mol Genet Metab 2012;106:257-263 [review]","Vaccaro AM, et al. Saposin C mutations in Gaucher disease patients resulting in lysosomal lipid accumulation, saposin C deficiency, but normal prosaposin processing and sorting. Hum Mol Genet 2010;19:2987-2997","Genes (MDPI) 2022;13:662 (Pakistani family: extension of the phenotype to hearing loss)"],"ev":"established","pw":[],"dc":"glycan_machinery"},{"key":"glycoRNA-mechanism","zh":"[Mechanism entry] glycoRNA / RNA glycosylation — no established Mendelian gene","en":"","genes":[],"cluster":"RNA_glycosylation","inh":"N/A (not a disease entity)","omim":[],"hpo":["HP:0012345"],"pathway":"In 2021 Flynn and Bertozzi discovered that mammals use RNA as a 'third scaffold' for glycosylation: conserved small non-coding RNAs (Y RNAs predominate, together with snRNA, snoRNA, tRNA and rRNA) carry sialylated N-glycans — glycoRNAs — displayed chiefly at the cell surface. Their production depends on the classical N-glycan biosynthetic machinery: the OST complex (particularly STT3A-dependent activity) and the ER/Golgi alpha-mannosidases I/II (inhibited dose-dependently by kifunensine and swainsonine). The covalent attachment site has been mapped to the modified base acp3U, and to yW-72 and yW-82. Other work suggests that O-glycosylation also contributes to glycoRNA production. Function: glycoRNAs can act as ligands for Siglec receptors (Siglec-11 and Siglec-14 binding is RNase A-sensitive) and for P-selectin, participating in neutrophil recruitment and immune regulation.\n[Nature 2026: cell-surface anchoring of glycoRNA depends on heparan sulfate] In a genome-wide CRISPR knockout screen the top three hits for loss of Siglec-11 binding were EXT1, EXT2 and UXS1 — the HS chain polymerases and UDP-xylose synthase. In EXT1/EXT2/UXS1 knockout cells the surface signals for HS, glycoRNA (9D5) and cell-surface RNA-binding proteins (csRBPs: DDX21, hnRNP-U) disappeared together; wild-type EXT2 rescued the defect whereas catalytically dead mutants (D517N/D573N) did not, showing that the enzymatic activity of EXT2 is what is required. After heparinase removal of HS the csRNP clusters vanished and recovered within 180 minutes as HS was resynthesised. The sulfation requirement is selective: knockout of NDST1 (N-sulfation) or HS6ST1 (6-O-sulfation) greatly reduced csRNPs, while knockout of HS2ST1 (2-O-sulfation) had no significant effect. GlycoRNA and the proteoglycan axis are therefore not two parallel strands of glycobiology but one and the same cell-surface assembly.","notes":"[Why this entry has no gene] As of the search date, no established human Mendelian disease arises from a defect in a gene specific to RNA glycosylation. There are two reasons: (1) glycoRNA uses the classical N-glycosylation machinery, and defects in those genes already present as CDG (see other entries in this database) and cannot be distinguished as 'abnormal RNA glycosylation'; (2) the candidate acp3U/queuosine-related writer enzymes DTWD1, DTWD2, TSR3, QTRT1 and QTRT2 have been checked and none has any OMIM disease association in the HPO database.\n[A technical controversy in the field] In 2025 a paper in Exp Mol Med entitled 'Proteins are a source of glycans found in preparations of glycoRNA' questioned the origin of the glycans in glycoRNA preparations, suggesting they may derive from residual protein contamination. The controversy is unresolved, and every inference in this entry should be qualified accordingly.\n[Relation to the skeleton] There is still no evidence **directly** linking glycoRNA to skeletal development; this entry is included to mark the boundary of the field, not to suggest that such skeletal diseases exist. The Nature work of 2026 has nonetheless loosened that boundary: csRNP clusters were shown to be negative regulators of HS-mediated signalling — the C-terminal, arginine-rich heparin-binding domain of VEGF-A165 binds glycoRNA directly, and both RNase treatment and an R/K mutant in which all eight arginines of that domain are changed to lysine (retaining HS binding while selectively losing RNA binding) increased VEGFR2-ERK phosphorylation roughly two- to threefold and caused abnormal vascular development in mouse retina and in zebrafish. The same paper used a Wnt3a-HS-domain fusion protein to show that directing Wnt3a to csRNPs quenches its activity (the shortened body axis phenotype in zebrafish was rescued and 6 of 8 Wnt target genes were no longer upregulated), whereas the R/K version could not. This indicates a general capacity of csRNPs to negatively regulate **growth factors bearing a heparin-binding domain**, which in principle should include BMP, FGF and Hedgehog — the skeletal morphogens repeatedly invoked in this database. But the inference has not been tested in the skeletal system, and **no** pathways field is therefore added to this entry.","sources":["Cell 2021;184:3109-3124 (Flynn et al., original discovery)","Cell 2024;187:5228-5237 (Xie et al., acp3U as the N-glycan attachment site)","Cell 2024;187:846-860 (Zhang et al., cell-surface RNA regulates neutrophil recruitment)","Protein Cell 2026;17:1 (PMC12959772, review)","bioRxiv 2024.08.28.610074 (Porat et al., contribution of O-glycosylation; preprint)","Exp Mol Med 2025 (Kegel et al., technical challenge)","Nat Biotechnol 2024;42:608-616 (ARPLA single-cell imaging)","Chai P, et al. GlycoRNA complexed with heparan sulfate regulates VEGF-A signalling. Nature 2026;651(8106):808-818. doi:10.1038/s41586-025-10052-8 (EXT1/EXT2/UXS1 required for csRNP assembly; N- and 6-O-sulfation dependence; negative regulation of VEGF-A165)","Tzintzun-Tapia E, Aryan F, Flynn RA. Defining cell surface and glycosylated RNAs. Trends Genet 2026 (Jun). doi:10.1016/j.tig.2026.05.002; PMID:42225521 (review: detection methods, RNA export and surface anchoring mechanisms)"],"ev":"mechanism","pw":[],"dc":"glycan_machinery"}],"notes":["Total number of CDGs: 200 CDGs have been identified, caused by defects in 189 different genes (Mol Genet Metab 2024 new nosology).","Frequency of skeletal involvement: skeletal abnormality is present in 52.7% of CDGs, ranking behind only the nervous system (80.5%) and dysmorphic features (55.6%).","Source of HPO IDs: term IDs and names were checked one by one against hp.obo (data-version hp/releases/2026-09-01).","Curated HPO annotations are not official annotations: the hpo field in this database is a manually distilled set of 'representative phenotypes' drawn from the cited literature, not the official HPO phenotype.hpoa annotation. Use the `compare` command to check against the official annotations; differences should be read as a prompt, not as an error.","[Inclusion criteria, made objective from v3.2] Whether a candidate gene is included rests on a systematic screen of the official HPO phenotype.hpoa: for each OMIM disease of that gene, count the official annotation terms falling within the HP:0000924 (abnormality of the skeletal system) subtree and compute their proportion; a gene is included if it reaches 'at least 5 skeletal terms AND at least 15%'. The screen can be recomputed with the script given in the methods.","[Systematic screen of all 8 COG complex subunits] COG complex defects cannot be treated as a single class. By this database's measure (count and proportion of skeletal terms): COG4-Saul-Wilson 18/42 = 43%, COG1 21/76 = 28%, COG8 16/68 = 24% — included; COG7 7/59 = 12%, COG6-CDG 5/51 = 10%, COG2 1/14 = 7%, COG5 1/14 = 7%, COG3 2/33 = 6%, COG6-Shaheen 2/9 = 22% but with only 2 terms (below the minimum of 5), and **COG4-CDG(ar) 1/29 = 3%** — none reaches the threshold and none has an entry. Most striking is the more than tenfold difference between the two COG4 diseases (43% vs 3%): heterozygous de novo p.Gly516Arg causes Saul-Wilson syndrome (skeletal axis), while biallelic loss of function causes COG4-CDG/CDG-IIj (neurological-hepatic axis, with almost no skeletal involvement). A statement at the level of 'gene X belongs to pathway Y' is not sufficient to predict the skeletal phenotype; the variant position and the mode of inheritance are what decide it.","[A known false-positive class of the quantitative criterion, and a remedy that was rejected] The HP:0000924 subtree contains **joint contractures**, and also cranial changes driven by abnormal brain development (microcephaly, wide anterior fontanelle, Dandy-Walker malformation). A severe neurological disorder may therefore acquire a substantial 'skeletal' proportion automatically without being a primary skeletal dysplasia. COG8-CDG is the explicitly flagged instance in this database: the proportion of 24% passes, yet the GeneReviews clinical description contains no skeletal dysplasia. The choice here is to include it faithfully and annotate the entry, rather than to adjust the criteria after the fact.\n[An auxiliary criterion that was tried and rejected] Version 3.5 proposed using 'the proportion after removing the cranial branch (HP:0000929)' as an auxiliary criterion; v3.6 **withdrew** it. The reason is that the practice does not hold biologically: the skull is bone, and what gets removed includes precisely the **J-shaped sella turcica, calvarial hyperostosis and a dense calvarium** — the **defining radiological features of dysostosis multiplex** in the mucopolysaccharidoses. Measured against this database's own entries the damage is large: MAN2B1 alpha-mannosidosis and ALG9-CDG lose 50% of their skeletal terms, HSPG2-perlecan 45%, MPS-II 38%, several GPI anchor entries 40-67%, and STT3A/STT3B-CDG fall to zero. The criterion would therefore systematically discriminate against two classes of disease characterised by craniofacial involvement: the lysosomal storage disorders and the GPI anchor defects. Conclusion — **the skeletal proportion is computed on a single definition, with no cranial subtraction**; neurologically driven false positives should be identified by reading the clinical description, not by trimming the ontology.","[Inclusion Route B: a highly specific skeletal phenotype (added in v3.8)] The proportional method has a structural false-negative mode: when the annotations of a multisystem disease are filled with visceral, haematological or neurological terms, a real and serious skeletal burden is diluted away. A second inclusion route was therefore added: a disease carrying at least one skeletal term held by **fewer than 15 OMIM diseases in the whole set** (that is, a phenotype of very high diagnostic specificity, close to pathognomonic) may be included even if its proportion falls below 15%. Two worked examples:\n  - **Gaucher disease type I** scores only 2/25 = 8%, but carries the 'Erlenmeyer flask deformity' — held by only 7 diseases in the whole set. Clinically, bone crises, osteonecrosis and pathological fracture are the leading causes of disability in type I, and the proportional method cannot see this at all. Included under Route B.\n  - **Alagille syndrome type 1 (JAG1)** scores 6/64 = 9%, but carries the 'butterfly vertebral arch' — a term annotated to **this disease alone** among the 8,478 OMIM diseases in the whole set, the most specific skeletal term verified in this database. Butterfly vertebrae are one of the classical diagnostic criteria for Alagille syndrome. Yet Alagille syndrome **is not included**, for reasons of mechanism rather than skeleton (see the next note).\nThe two routes are alternative sufficient conditions for the phenotype criterion; each must still be combined with the second criterion, 'the mechanism lies on the glycosylation machinery'.","[Alagille syndrome: discussed as a vertebral segmentation disorder, but not an entry in this database] On phenotype, Alagille syndrome qualifies fully: butterfly vertebrae are one of its five classical diagnostic criteria (cholestasis, cardiac malformation, butterfly vertebrae, posterior embryotoxon, characteristic facies), and the official HPO annotations for JAG1 contain both butterfly vertebral arch and hemivertebrae, the former with a whole-set specificity of 1/8478 — no skeletal phenotype is more specific than that.\nOn mechanism it does not qualify: JAG1 is a **ligand** of NOTCH and NOTCH2 (Alagille type 2) is the **receptor**; both lie on the receptor/ligand side, not on the glycan machinery. This is exactly the reason DLL3, MESP2 and NOTCH2-Hajdu-Cheney are excluded.\n**There is nevertheless a real mechanistic connection to this database, worth stating explicitly**: the function of LFNG (Lunatic Fringe) is precisely to elongate the O-fucose on the NOTCH1 EGF repeats and thereby **shift NOTCH's ligand preference — strengthening binding to DLL1 and suppressing binding to JAG1**. In other words, the glycosylation step lost in LFNG-SCDO3, which this database does include, directly sets the strength of the JAG1 arm of the pathway. The result is a symmetrical and instructive pattern: **a defect on the glycan side (LFNG) and one on the ligand side (JAG1) both produce vertebral malformation, but of different form** — LFNG deficiency produces widespread segmentation defects of vertebrae and ribs (spondylocostal dysostosis), JAG1 deficiency relatively isolated butterfly vertebrae. This suggests that the glycan modification tunes the **quantitative strength and ligand selectivity** of the pathway rather than simply reproducing the phenotype of ligand loss.","[Excluded on screening, with the figures] SLC35A2 (4/45 = 9%), NDST1 (1/28 = 4%), B4GAT1 (3/35 = 9%), NAGA (1/19 = 5%), PIGA (25/202 = 12%), PIGN (5/57 = 9%), PIGL (11/86 = 13%), PIGM (0/14), PIGC (0/8), PIGG (0/18), PIGH (3/25), PIGK (1/18), PIGP (3/25), PIGQ (5/37 = 14%), PIGU (6/51 = 12%), PGAP1 (3/59 = 5%), COG7 (7/59 = 12%), MPDU1 (4/29 = 14%), ALG8 (3/39 = 8%), SRD5A3 (1/34 = 3%), DOLK (1/26 = 4%), ALG2 (1/45 = 2%), ATP6AP1 (0/47), HS6ST1 (0/12) — none reaches the threshold; all are phenotypes dominated by the nervous, immune or other systems. (Note: HS6ST1 is excluded for want of skeletal annotations, but its 6-O-sulfation product was shown in Nature 2026 to be required for cell-surface csRNP assembly and for regulation of VEGF-A signalling, making it a functional candidate worth watching.)","[No OMIM phenotype entry does not mean no Mendelian disease] EXTL1, EXTL2, CHSY3, CHPF, CHPF2, UST, GLCE, PXYLP1, PIGX, B3GNT2, CCDC115 and TMEM199 have no OMIM association in HPO's genes_to_phenotype. But this can **only** mean that OMIM has not yet assigned them a phenotype MIM number; it is not sufficient to assert that no established Mendelian disease exists.","[Correction in v3.3: FAM20B] Version 3.2 of this database placed FAM20B on the list of genes 'confirmed to have no Mendelian disease'. That judgement was wrong. FAM20B indeed has no OMIM disease association in HPO, because OMIM 611063 is a **gene** entry rather than a phenotype entry; but skeletal dysplasia from biallelic FAM20B variants has at least 3 independent reports covering 6 cases (Kuroda 2019 Clin Genet; Arduc 2026 Clin Genet doi:10.1111/cge.70115), with phenotypes from perinatally lethal short-limb dysplasia to a mild form surviving to age 12. The entry FAM20B-SKD has been added. **Methodological lesson**: the inclusion screen of this database is built on HPO's phenotype.hpoa, which covers only diseases that have been given an OMIM phenotype number, and is therefore systematically blind to the class 'gene established, OMIM entry not yet created'. This is an inherent blind spot of purely database-driven curation and can only be closed by literature searching.","[The former list of 'passed the screen but not yet curated' was emptied in v4.2] MAN1B1, ALG1, DPM1 and HYAL2 now all have formal entries; COG1 and COG8 were added in v3.5. SRD5A3-Kahrizi (3/16 = 19%) in fact fails Route A because it has only 3 skeletal terms (below 5) and was removed from the list on review this round.","[The boundary of the differential diagnosis for vertebral malformation — what does not belong to glycosylation disease] Congenital vertebral malformation (CVM) and vertebral segmentation defects form a large class that intersects this database but mostly does not belong to it. Inclusion here requires **both**: (1) skeletal involvement reaching the quantitative threshold; and (2) a disease mechanism on the glycosylation machinery. On that boundary the vertebral anomaly spectrum falls into four groups:\n  (A) Both criteria met, included: LFNG-SCDO3 (O-fucose elongation on NOTCH1 EGF domains), EOGT-AOS4 (O-GlcNAc on EGF domains), COG1-CDG (butterfly vertebrae, posterior rib gaps, vertebral segmentation defects).\n  (B) Skeletal criterion met but mechanism not glycosylation — not included, but part of the differential neighbourhood: the other 6 spondylocostal dysostosis genes DLL3 (55%), MESP2 (67%), TBX6 (69%), HES7 (39%), RIPPLY2 (83%), DMRT2; Klippel-Feil syndrome GDF6 (32%), GDF3 (57%), MEOX1 (36%); NOTCH2-related Hajdu-Cheney syndrome (34%), NOTCH3-related lateral meningocele syndrome (24%), RBPJ-related Adams-Oliver syndrome type 3 (50%). The skeletal evidence for these genes is no weaker than for entries that are included; the sole reason for exclusion is that the mechanism is not on the glycosylation machinery.\n  (C) NAD-related: congenital NAD deficiency disorder (CNDD) / VCRL syndrome, caused by biallelic variants in the de novo NAD synthesis genes HAAO (12%), KYNU (38%) and NADSYN1 (31%), with a phenotype overlapping VACTERL closely and centred on vertebral segmentation defects (hemivertebrae, vertebral fusion) plus cardiac, renal and limb anomalies. Discussed separately in the next note.\n  (D) Associations or spectra rather than single-gene disease: the VACTERL association and the oculo-auriculo-vertebral spectrum (OAVS) are clinical associations or spectra, genetically heterogeneous and in most cases without a defined monogenic cause, and are unsuitable as disease entries here.\n**A conceptual point about NOTCH-related disease**: the NOTCH1/2/3 receptors are themselves **substrates** of glycosyltransferases such as POFUT1, POGLUT1, LFNG/MFNG/RFNG and EOGT, but a mutation in a NOTCH gene is on the receptor side, not the glycan side. Hajdu-Cheney syndrome arises from truncating variants in the last exon of NOTCH2 that let the protein escape PEST-mediated degradation (gain of function) and has nothing to do with glycosylation. The converse also holds: the human diseases of POFUT1 and POGLUT1 (Dowling-Degos disease types 2 and 4, limb-girdle muscular dystrophy R21) have skeletal proportions of 0-7% and none reaches the inclusion threshold.","[A real but unverified biochemical bridge between NAD and proteoglycans] This note is explicitly flagged as a **hypothesis**. Two facts are established: (1) CNDD results from biallelic HAAO/KYNU/NADSYN1 variants causing embryonic NAD deficiency, its core phenotype includes vertebral segmentation defects, and niacin supplementation in pregnancy prevents the malformations in mice; yet several papers (including 2025 zebrafish model work) state explicitly that 'the mechanism by which NAD deficiency causes the developmental anomalies of CNDD remains undetermined'. (2) UDP-glucose dehydrogenase UGDH is an **NAD-dependent** enzyme, consuming 2 molecules of NAD+ for each molecule of UDP-glucose converted to UDP-glucuronic acid; UDP-GlcA is the sole source of the UDP-xylose made by UXS1, and UDP-xylose is in turn the substrate with which XYLT1/XYLT2 initiate the linker tetrasaccharide — so UGDH is the single upstream entry point of GAG and proteoglycan synthesis (both the linkeropathy and nucleotide_sugar clusters of this database hang downstream of it). (3) **UXS1 uses tightly bound NAD+ as cofactor** and must regenerate it within the active-site pocket on every catalytic cycle; and **the entire known function of TGDS is to regenerate NAD+ for UXS1 within an NAD+-poor compartment, the Golgi lumen** (Nature 2025, direct evidence). (4) Patients with biallelic KYNU variants can present as **clinically diagnosed Catel-Manzke syndrome** (Ehmke 2020, Bone 133:115219), the same disease as TGDS deficiency.\n**Correction in v4.0**: this database earlier described KYNU and TGDS as 'two entirely unrelated pathways'. That was wrong. The four facts together give a specific point of convergence: **NAD+ to UGDH and UXS1 to UDP-xylose to the linker tetrasaccharide**. TGDS deficiency is a local failure to regenerate NAD+ and KYNU deficiency a systemic shortfall in NAD+ supply; both weaken the same enzyme, UXS1, so that producing one clinical diagnosis is not a coincidence.\n**A qualification that must be kept**: the causal step 'the skeletal defect of KYNU/CNDD is indeed caused by NAD+ limitation of UGDH/UXS1' has **no direct experimental proof** (several papers still describe the CNDD mechanism as undetermined). No disease entry is therefore created for CNDD and no pathways annotation is added, but Figure 4 presents the convergence in full together with its evidence grading. One counter-indication must be set alongside it: the human disease of UGDH itself is developmental and epileptic encephalopathy 84 (OMIM 618792), with a skeletal proportion of only 2/32 = 6% — even a defect in the single upstream entry point of GAG synthesis does not present as skeletal dysplasia. The convergence model therefore must not be over-extrapolated: the **degree and compartment** of NAD+ limitation may be what determines the phenotype, rather than any simple rule that 'upstream in a pathway necessarily affects downstream'. One possible explanation is that complete UGDH inactivation causes embryonic lethality or preferential neural involvement, while a partial NAD+ shortfall shows a skeletal phenotype only at UXS1, the node most dependent on NAD+ regeneration — but this too is inference and awaits testing.","[A phenotypic crossover worth recording] Maternal uniparental isodisomy of chromosome 2 has been reported to produce a homozygous deletion of KYNU exon 5 presenting clinically as Catel-Manzke syndrome / VCRL syndrome. This database includes TGDS-CatelManzke (a glycosylation mechanism) while KYNU belongs to the NAD pathway — one clinical diagnosis arising from defects in two entirely different metabolic pathways, which means that in a patient with a Catel-Manzke phenotype and negative TGDS testing the NAD pathway genes should be considered.","[Systematic screen of lipid glycosylation (glycosphingolipids): an almost entirely negative result] A complete screen of 21 genes on both the synthetic and the degradative side of glycosphingolipid metabolism gives an unambiguous conclusion: **glycosphingolipid disorders are overwhelmingly diseases of the nervous system, not of the skeleton**. Synthetic side: ST3GAL5 (GM3 synthase deficiency) 4%, B4GALNT1 (spastic paraplegia 26) 3%, CERS3 0%, SPTLC1 0%, GM2A 0%; UGCG, ST8SIA1 and B3GALT4 have no OMIM association in HPO. Degradative side: HEXA (Tay-Sachs) 0%, HEXB (Sandhoff) 3%, GLA (Fabry) 0%, GALC (Krabbe) 0%, ARSA (metachromatic leukodystrophy) 0%, SMPD1 (Niemann-Pick A/B) 5%/0%, NPC1/NPC2 0%, PSAP 0%. None reaches the threshold.\n**There are only two exceptions, each for a particular reason**: (1) GBA1-Gaucher disease: the proportion is only 8% and it enters under Route B (Erlenmeyer flask deformity); moreover its bone disease is a space-occupying effect of storage cells on the marrow rather than a glycan defect of the cartilage matrix. (2) GLB1, long included here, is **the only gene straddling glycolipids and glycosaminoglycans** — one and the same beta-galactosidase deficiency causes both GM1 ganglioside storage (GM1 gangliosidosis, proportion 21-25%) and impaired keratan sulfate degradation (Morquio B, proportion 47%). The skeletal weight of the two clinical phenotypes differs more than twofold although the gene and the enzyme are identical. GLB1 is therefore the best instance of 'the substrate determines the phenotype, not the enzyme', and the only natural bridge between lipid glycosylation and the proteoglycan axis.\nOne further point: the GPI_anchor cluster of this database (8 entries) is also, strictly speaking, lipid glycosylation — a GPI anchor is a glycan attached to phosphatidylinositol. It is listed separately only by convention.","[Gene symbol aliases, to avoid duplicate entries and missed searches] This database follows HGNC-approved symbols; the following aliases are common in the literature and in clinical reports:\n  - **PPGB** = **CTSA** (protective protein / cathepsin A). Galactosialidosis is entered here under CTSA; no separate PPGB entry is created.\n  - **GCAF** = **LYSET** = **TMEM251**. GCAF is the functional name given in Nat Commun 2022 (GNPTAB cleavage and activity factor) and LYSET the name used in two contemporaneous Science papers; all three denote one gene. The entry here is under TMEM251.\n  - **IMPAD1** = **BPNT2** (entered here as BPNT2; the audit requires the new symbol to pass).\n  - **GBA** = **GBA1** (renamed by HGNC).\n  - **UXS1** is also called UDP-glucuronate decarboxylase 1 / UDP-xylose synthase.","[The M6P targeting pathway is now complete across three tiers] The M6P_targeting cluster has grown from 2 entries to 4, with the hierarchy: **upstream activators** (MBTPS1/S1P performs the activating cleavage of GNPTAB; TMEM251/GCAF is required for that cleavage) to the **tagging enzyme** (GNPTAB and GNPTG, the alpha/beta and gamma subunits of GlcNAc-1-phosphotransferase) to the **M6P tag** and correct delivery of lysosomal enzymes. The shared biochemical signature of all four diseases is 'raised plasma lysosomal enzymes with reduced intracellular activity'. Note that MBTPS1 has a further pathogenic mechanism independent of M6P (BBF2H7, ER stress and collagen retention), so its skeletal phenotype is not caused purely by a glycosylation defect.","[The two tiers of the sulfatases] This database now includes both the sulfatases themselves (ARSB, GALNS, GNS, IDS, ARSK) and **their sole post-translational activating enzyme, SUMF1/FGE**. SUMF1 converts the active-site cysteine of these enzymes to formylglycine, and without that step the enzyme protein has no activity whatsoever. SUMF1 deficiency (multiple sulfatase deficiency) therefore superimposes several MPS phenotypes on metachromatic leukodystrophy. It is the most highly coupled single node in the database: one gene determines whether the products of five included genes can work.","[The v4.2 systematic screen: running Routes A and B across all 203 glycosylation-related genes at once] Until this round, Route B (highly specific skeletal phenotype) had only been used **passively**, when prompted, and had never been executed systematically. This round built 203 candidate genes from glycosylation-related gene prefixes plus the known families and ran both Route A and Route B over all their OMIM diseases, yielding 129 qualifying pairs, of which **32 had not previously been included**. After review against the mechanism criterion, 8 entries were added: MGAT2, MAN1B1, FUT8 (in the new N_glycan_processing cluster), ALG1, DPM1, HYAL2, MAN2C1 and PIGF. This also emptied the 'passed the screen but not yet curated' list that had been outstanding since v3.2.\n**Lesson**: an objective criterion that is written but not systematically executed is worth nothing. Until now this database had found Route B cases such as Alagille syndrome and Gaucher disease only because users pointed them out one at a time, whereas a single exhaustive scan found 32 gaps in a few minutes.","[Notable cases that pass the screen but are excluded by the mechanism criterion]\n  - **TRAPPC2 / X-linked late-onset spondyloepiphyseal dysplasia (SEDT, 313400)** — the skeletal proportion is **17/23 = 74%**, the highest of all candidates, and it carries 'hump-shaped bony protrusion of the posterior vertebral endplate', a term held by **only 1 disease in the whole set**; both Route A and Route B are cleared by a wide margin. But its mechanism is sedlin's regulation of the Sar1 cycle, mediating **ER export of procollagen (type II collagen)** — a defect in macromolecular cargo transport, unrelated to the glycosylation machinery — so it is not included. This is the strongest single demonstration that the two criteria of this database are mutually independent: on skeletal evidence alone it would rank first in the entire set. (Footnote: 8 TRAPP complex subunits cause disease, and only TRAPPC2 is restricted to cartilage; the other 7 TRAPPopathies are neuromuscular phenotypes.)\n  - **VPS35L / Ritscher-Schinzel syndrome type 3** (32%, with 'poor vertebral ossification' held by only 1 disease in the whole set) and **VPS13B / Cohen syndrome** (16%): both are endosomal/Golgi trafficking defects with insufficient glycosylation evidence, and neither is included.","[False-positive categories of Route B, confirmed again this round]\n  - **Dystroglycanopathies (O-mannosylation)**: POMT1, POMT2, FKTN, FKRP, LARGE1 and CRPPA pass Route B on Walker-Warburg syndrome (236670) at 12%, but the most specific term driving this is **encephalomeningocele** (held by only 1 disease in the whole set) — a neural tube and cranial lesion counted through the HP:0000924 subtree, not a dysostosis. O-mannosylation is an important glycosylation pathway in its own right, but its human disease spectrum is **muscle-eye-brain** rather than skeletal, so it is not included as a whole; the single point of contact is DPM1 (at the donor level, see that entry).\n  - **Some PIG genes**: PIGA (12%), PIGL (13%), PIGH, PIGP and PIGN are selected by Route B, but their skeletal terms are joint contractures, clinodactyly, abnormal head shape and similar secondary or craniofacial items, of the same class as COG8. They remain excluded; only PIGB, PIGF, PIGO, PIGS, PIGT, PIGV, PIGW and PIGY, which have substantive skeletal evidence, are included.\n**Conclusion**: Route B widens recall, but it must be used together with the mechanism criterion and the clinical description; used alone it mistakes neural tube defects and secondary contractures for skeletal dysplasia.","[An important v4.3 qualification to Route B: specific is not the same as developmental] On reviewing two candidates this round, a further class of Route B false positive came to light — **the term is highly specific, but it points to an inflammatory or degenerative arthropathy rather than a developmental dysostosis**. The typical example is **MAN2B2-CDG (621140)**: the skeletal proportion is only 4/64 = 6%, yet it passes Route B by carrying 'arthritis of the wrist' (held by **only 1 disease in the whole set**, tying with Alagille's butterfly vertebral arch for the highest specificity). But its skeletal annotations are **arthritis and osteoarthritis** of the wrist, knee and hip, while its clinical axis is immunodeficiency (abnormal plasmablast proportion, abnormal class-switched memory B cells, recurrent herpes labialis). Arthritis is not a skeletal dysplasia. **It is therefore not included.**\nThe full statement of Route B should accordingly be: carrying at least one skeletal term that is held by fewer than 15 diseases in the whole set **and that denotes a developmental or structural bone change**. Judging 'developmental versus inflammatory/degenerative' can at present only be done by human reading and cannot be derived automatically from ontology structure — a boundary that this database's quantitative criteria have not yet resolved.","[Two former candidates definitively excluded after v4.3 review]\n  - **MPDU1-CDG (CDG-If, 609180)**: skeletal 4/29 = 14%, with 4 terms (below 5), failing Route A; Route B is triggered by 'parietal bossing' (12 in the whole set), but its 4 skeletal terms are parietal bossing, wide anterior fontanelle, flexion contractures and microcephaly — **cranium plus contractures**, the same false-positive class as COG8 and the PIG genes. The clinical axis of the disease is severe neurological regression, erythroderma/ichthyosiform skin lesions and death in infancy. **Not included.**\n  - **MAN2B2-CDG (621140)**: see the previous note; an arthritis-type false positive. **Not included.**\nThe mechanism of both is indeed glycosylation (MPDU1 governs the use of Man-P-Dol, MAN2B2 is a lysosomal mannosidase), but the first criterion of this database is skeletal involvement, and a correct mechanism cannot substitute for phenotypic evidence. When they were listed as 'priority candidates' in the previous round only the screening figures had been consulted and the clinical descriptions had not been read; this corrects that.","[The 'activation layer' is a recurring structural theme in this database] In several pathways the point of failure lies not in the enzyme itself but in an upstream factor that confers activity on it. There are now four instances:\n  - **SUMF1/FGE** acting on all sulfatases (ARSB, GALNS, GNS, IDS, ARSK)\n  - **MBTPS1 and TMEM251** acting on GNPTAB (the M6P tagging enzyme)\n  - **PSAP / the saposins** acting on GBA1 (Sap-C) and GLB1 (Sap-B)\n  - **TGDS** acting on UXS1 (regenerating NAD+ via an enzyme-rescue metabolite)\nThe shared feature is that **the enzyme protein is present and its in vitro activity may be normal, yet the disease occurs regardless**. The clinical implication is concrete: measuring enzyme activity alone will miss this entire class of disease. The taxonomic implication is that a classification organised around 'the enzyme' will place these entries in the wrong position.","[Status of the candidate list (after the v4.3 review)] PSAP atypical Gaucher disease has been included; MPDU1 and MAN2B2 were judged Route B false positives after reading their clinical descriptions and are explicitly excluded (see above). Still to be evaluated: ALG14 (20%), ALG13 (16%) and GNE-sialuria (16%) — all three have predominantly neurological or muscular phenotypes, and the substance of their skeletal evidence needs to be verified before a decision.","Abbreviations for inheritance: AR, autosomal recessive; AD, autosomal dominant; XL, X-linked.","[defect_class, the most important conceptual distinction in this database] glycan_machinery = the defect lies in the machinery that builds, modifies or degrades glycans (enzymes, transporters, cofactors); core_protein = the defect lies in the core protein scaffold that carries the glycan, with the glycosylation machinery intact. Strictly speaking the latter is not an 'abnormality of glycosylation'; it is included to present the proteoglycan axis in full, and is marked with an orange diamond in both the CLI and the web view. Use --defect-class to view each separately. The best contrast between the two: EXT1/EXT2 deficiency means HS chains cannot be made, while GPC6 deficiency means the core protein that carries the HS chains is gone.","[The glypican family: a stress test for the defect_class dichotomy] The Filmus 2023 review (Proteoglycan Research 1(2):e5, doi:10.1002/pgr2.5) notes that mammals have 6 glypicans, all anchored to the cell surface by GPI and carrying 2-4 HS chains near the carboxy terminus, whose functions are 'mediated by the HS chains and/or the core protein' — either, depending on the particular glypican and the context. This is a stress test for this database's glycan_machinery / core_protein dichotomy: in the glypicans, a core-protein defect and a glycan defect may not be cleanly separable. GPC3 is the focus of the dispute: Capurro 2008 holds that the HS chains are not required for GPC3-Hh binding (supporting a pure core-protein disorder), while Liu 2022 holds that the HS-modified stalk is both necessary and sufficient (supporting glycan dependence). Both are recorded here as they stand.","[The direction of glypican regulation is context-dependent and cannot be generalised] The same review stresses that glypicans can **either activate or inhibit** Hh, Wnt, FGF and BMP, depending on the structural features of the glypican, the levels of growth factor and receptor in the cell, and whether the glypican can be released from its GPI anchor by a lipase. Work in the Drosophila wing disc further shows that glypicans participate in **gradient formation** for Hh, Wnt and BMP, so their action is not confined to the signal-receiving cell itself. Annotating GPC3 with both HEDGEHOG (negative) and WNT (positive) in this database is an expression of that general property — and it follows that an annotation of the form 'gene X is associated with pathway Y', given without direction and context, carries very little information.","Three levels of evidence_level: established = an established Mendelian disease (71 entries); provisional = the gene-disease association or the skeletal evidence falls short of this database's usual standard but the entry has mechanistic or coverage value (UXS1: a single family, listed by OMIM as a VUS, with two papers reaching opposite mechanistic conclusion
